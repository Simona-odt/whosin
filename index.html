/* ======================================================================
   REDUCER
====================================================================== */
function recomputePlanState(next, plan){
  const counts = responseCounts(next, plan);
  if(["day_of_check","at_risk","happened"].includes(plan.state)) return;
  if(counts.in >= plan.minPeople){
    if(plan.state !== "confirmed"){
      plan.state = "confirmed";
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"confirmed", planId:plan.id, message:`${next.activities[plan.activityId].title} hit its number — let's make it happen 🎉 you can leave suggestions now`, createdAt:now(), read:false});
    }
  } else if(plan.state==="confirmed"){
    plan.state = "gathering";
  } else if(plan.state==="shared" && counts.in + counts.no + counts.backedOut > 0){
    plan.state = "gathering";
  }
}

function actorName(next){ return (ME && next.users[ME]) ? next.users[ME].name : "Someone"; }

function reducer(db, action){
  const next = JSON.parse(JSON.stringify(db));
  switch(action.type){
    case "MARK_SEEN": { next.plans[action.planId].seenByMe = true; return next; }
    case "TOGGLE_PIN": { const p = next.plans[action.planId]; p.pinnedToTop = !p.pinnedToTop; return next; }

    case "RESPOND": {
      const plan = next.plans[action.planId];
      plan.responses[action.userId] = action.response;
      // "no" / "backed out" only affects the responder's own view (see
      // isPutAsideForMe) — it never changes the shared plan for the group.
      recomputePlanState(next, plan);
      return next;
    }
    case "UPDATE_PLAN_DETAILS": {
      const plan = next.plans[action.planId];
      const activity = next.activities[plan.activityId];
      activity.title = action.title; activity.location = action.location;
      plan.minPeople = action.minPeople; plan.priority = action.priority; plan.note = action.note;
      plan.groupTravelPlan = (action.travelPlan||"").trim();
      plan.updatedAt = now();
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:plan.id, message:`${actorName(next)} updated ${activity.title} — take a look`, createdAt:now(), read:false});
      return next;
    }
    case "ADD_PLANNER": {
      const plan = next.plans[action.planId];
      plan.plannerIds = Array.from(new Set([...(plan.plannerIds||[]), action.userId]));
      plan.coplannerRequests = (plan.coplannerRequests||[]).filter(id=>id!==action.userId);
      const addedName = next.users[action.userId] ? next.users[action.userId].name : "Someone";
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"planner", planId:plan.id, message:`${addedName} is now helping plan ${next.activities[plan.activityId].title}`, createdAt:now(), read:true});
      return next;
    }
    case "ASK_COPLANNER": {
      const plan = next.plans[action.planId];
      plan.coplannerRequests = Array.from(new Set([...(plan.coplannerRequests||[]), action.userId]));
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"planner", planId:plan.id, message:`${actorName(next)} wants to help plan ${next.activities[plan.activityId].title}`, createdAt:now(), read:true});
      return next;
    }
    case "MEET_IN_PERSON": {
      const plan = next.plans[action.planId];
      const when = action.proposedTime && action.proposedTime.trim() ? ` — proposed for ${action.proposedTime.trim()}` : "";
      plan.meetProposedTime = action.proposedTime && action.proposedTime.trim() ? action.proposedTime.trim() : null;
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"meet", planId:plan.id, message:`${actorName(next)} wants to meet in person to decide on ${next.activities[plan.activityId].title}${when}`, createdAt:now(), read:false});
      return next;
    }
    case "FINALIZE": {
      const plan = next.plans[action.planId];
      plan.finalized = true;
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"finalized", planId:plan.id, message:`${actorName(next)} finalized ${next.activities[plan.activityId].title} — it's on everyone's calendar now`, createdAt:now(), read:false});
      return next;
    }
    case "SUGGEST_NOTE": {
      const plan = next.plans[action.planId];
      plan.suggestionNotes = plan.suggestionNotes || {};
      plan.suggestionNotes[action.userId] = {text:action.text, ts:now()};
      const isPlannerSelf = (plan.plannerIds||[])[0]===action.userId;
      if(!isPlannerSelf){
        next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:plan.id, message:`${actorName(next)} left a note on ${next.activities[plan.activityId].title}`, createdAt:now(), read:false});
      }
      return next;
    }
    case "ADD_TRAVEL_PLAN": { const plan = next.plans[action.planId]; plan.travelPlans = plan.travelPlans || {}; plan.travelPlans[action.userId] = {text:action.text, ts:now()}; return next; }
    case "NUDGE": { const plan = next.plans[action.planId]; next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"nudge", planId:plan.id, message:`${actorName(next)} poked the group about ${next.activities[plan.activityId].title}`, createdAt:now(), read:false}); return next; }
    case "DAYOF_RESPOND": {
      const plan = next.plans[action.planId];
      plan.dayOfResponses = plan.dayOfResponses || {};
      plan.dayOfResponses[action.userId] = action.val;
      if(action.val==="out"){
        plan.responses[action.userId] = {type:"backed_out", ts:now()};
        plan.state = "at_risk";
        next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"backedout", planId:plan.id, message:`${actorName(next)} backed out of ${next.activities[plan.activityId].title}`, createdAt:now(), read:false});
      }
      return next;
    }
    case "DAYOF_REACT": {
      const plan = next.plans[action.planId];
      plan.dayOfReactions = plan.dayOfReactions || {};
      plan.dayOfReactions[action.userId] = {emoji:action.emoji, ts:now()};
      return next;
    }
    case "SEND_FALLBACK": {
      next.plans[action.planId].fallbackSent = true; next.plans[action.planId].fallbackText = action.text;
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:action.planId, message:`${actorName(next)} proposed a smaller version of ${next.activities[next.plans[action.planId].activityId].title}`, createdAt:now(), read:false});
      return next;
    }
    case "DISMISS_FALLBACK": { next.plans[action.planId].fallbackOffered = false; return next; }
    case "RESTORE": {
      const plan = next.plans[action.planId];
      if(plan.responses[ME] && ["no","backed_out"].includes(plan.responses[ME].type)) delete plan.responses[ME];
      recomputePlanState(next, plan);
      return next;
    }
    case "MARK_ALL_READ": { next.notifications.forEach(n=>n.read=true); return next; }
    case "CREATE_PLAN": {
      const id = "p_"+now(); const actId = "a_"+now();
      next.activities[actId] = {id:actId, title:action.title, category:action.category, location:"TBD"};
      const primaryGroup = action.groupIds[0];
      next.plans[id] = {
        id, activityId:actId, groupId:primaryGroup, extraGroupIds:action.groupIds.slice(1), extraMemberIds:action.extraMemberIds||[],
        creatorId:ME, plannerIds:[ME], dateTime: now() + 3*DAY, minPeople:action.minPeople, priority:"Your idea",
        note:action.note, groupTravelPlan:(action.travelPlan||"").trim(), state:"shared", createdAt:now(), pinnedToTop:false, seenByMe:true, finalized:false,
        responses:{ [ME]:{type:"yes", ts:now()} }, suggestionNotes:{}, coplannerRequests:[],
      };
      return next;
    }
    case "CREATE_GROUP": { const id = action.id || "g_"+now(); next.groups[id] = {id, name:action.name, emoji:action.emoji, memberIds:action.memberIds, color:GROUP_PALETTE[Object.keys(next.groups).length % GROUP_PALETTE.length]}; return next; }
    case "CREATE_USER_FROM_CONTACT": {
      const contact = next.contacts.find(c=>c.id===action.contactId);
      if(contact && !next.users[action.uid]){
        next.users[action.uid] = {id:action.uid, name:contact.name, handle:"@"+contact.name.toLowerCase(), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
        next.contacts = next.contacts.filter(c=>c.id!==action.contactId);
      }
      return next;
    }
    case "CREATE_USER_FREEFORM": {
      if(!next.users[action.uid]){
        next.users[action.uid] = {id:action.uid, name:action.name, handle:"@"+action.name.toLowerCase().replace(/\s+/g,""), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
      }
      return next;
    }
    case "RENAME_GROUP": { next.groups[action.groupId].name = action.name; return next; }
    case "UPDATE_GROUP_MEMBERS": {
      const group = next.groups[action.groupId];
      if(action.action==="add") group.memberIds = Array.from(new Set([...group.memberIds, action.userId]));
      else group.memberIds = group.memberIds.filter(id=>id!==action.userId);
      return next;
    }
    case "ADD_CONTACT_TO_GROUP": {
      const contact = next.contacts.find(c=>c.id===action.contactId);
      if(contact){
        const uid = "u_"+contact.id;
        next.users[uid] = {id:uid, name:contact.name, handle:"@"+contact.name.toLowerCase(), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
        next.groups[action.groupId].memberIds = Array.from(new Set([...next.groups[action.groupId].memberIds, uid]));
        next.contacts = next.contacts.filter(c=>c.id!==action.contactId);
      }
      return next;
    }
    case "CREATE_USER_AND_ADD_TO_GROUP": {
      const uid = "u_"+now();
      next.users[uid] = {id:uid, name:action.name, handle:"@"+action.name.toLowerCase().replace(/\s+/g,""), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
      next.groups[action.groupId].memberIds = Array.from(new Set([...next.groups[action.groupId].memberIds, uid]));
      return next;
    }
    default: return db;
  }
}

/* ======================================================================
   APP SHELL
====================================================================== */
function App(){
  const [authedUserId, setAuthedUserId] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [cloudStatus, setCloudStatus] = useState("checking"); // checking | connected | unavailable
  const [writeBlocked, setWriteBlocked] = useState(false);
  const [lastWriteError, setLastWriteError] = useState(null);
  const [retryKey, setRetryKey] = useState(0);
  const [tab, setTab] = useState("home");
  const [openPlanId, setOpenPlanId] = useState(null);
  const [dayOfId, setDayOfId] = useState(null);
  const [newPlanOpen, setNewPlanOpen] = useState(false);
  const [showUninterested, setShowUninterested] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showNotifications, setShowNotifications] = useState(false);
  const [openGroupId, setOpenGroupId] = useState(null);
  const [newGroupOpen, setNewGroupOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const [notifBanner, setNotifBanner] = useState(null);
  const [bellWiggle, setBellWiggle] = useState(false);
  const prevTopNotifRef = useRef(null);
  const notifBannerTimerRef = useRef(null);
  const [theme, setThemeState] = useState("system");
  const toastTimer = useRef(null);
  const cloudDocRef = useRef(null);
  const pendingWriteRef = useRef(null);
  const writingRef = useRef(false);
  const applyingRemoteRef = useRef(false);
  const hasSeededRef = useRef(false);

  // Restore a remembered session + theme once, on first load.
  useEffect(()=>{
    unlockAudioOnce();
    const savedUserId = safeGet(SESSION_KEY);
    if(savedUserId && Object.values(CREDENTIALS).some(c=>c.userId===savedUserId)){
      ME = savedUserId;
      setAuthedUserId(savedUserId);
    }
    const savedTheme = safeGet(THEME_KEY);
    if(savedTheme) setThemeState(savedTheme);
    setCheckingSession(false);
  }, []);

  function handleLogin(userId){
    ME = userId;
    safeSet(SESSION_KEY, userId);
    setAuthedUserId(userId);
  }
  function handleLogout(){
    safeRemove(SESSION_KEY);
    ME = null;
    setDb(null);
    setLoading(true);
    setCloudStatus("checking");
    setAuthedUserId(null);
  }

  // Connect to the shared Firestore document once signed in; fall back to
  // this device only if Firebase isn't configured or reachable.
  useEffect(()=>{
    if(!authedUserId) return;
    let cancelled = false;
    let unsub = null;
    setWriteBlocked(false);
    setLastWriteError(null);

    (async () => {
      const ok = await ensureFirebaseAuth();
      if(cancelled) return;

      if(!ok || !fsDoc){
        setCloudStatus("unavailable");
        setDb(loadLocalFallback());
        setLoading(false);
        return;
      }

      setCloudStatus("connected");
      cloudDocRef.current = fsDoc;

      unsub = fsDoc.onSnapshot((snap)=>{
        if(cancelled) return;
        if(snap.exists){
          applyingRemoteRef.current = true;
          setDb(snap.data());
          setLoading(false);
        } else if(!hasSeededRef.current){
          hasSeededRef.current = true;
          setDb(seed());
          setLoading(false);
        }
      }, (err)=>{
        if(cancelled) return;
        setCloudStatus("unavailable");
        setDb(loadLocalFallback());
        setLoading(false);
      });
    })();

    return ()=>{ cancelled = true; if(unsub) unsub(); cloudDocRef.current = null; hasSeededRef.current = false; };
  }, [authedUserId, retryKey]);

  async function flushCloudWrite(){
    if(writingRef.current) return;
    if(pendingWriteRef.current===null || !cloudDocRef.current) return;
    writingRef.current = true;
    const data = pendingWriteRef.current;
    pendingWriteRef.current = null;
    try{
      await cloudDocRef.current.set(data);
      if(writeBlocked) setWriteBlocked(false);
    }catch(e){
      // A well-formed set() rejecting almost always means this viewer only
      // has read (not write/interact) access to the artifact — surface it
      // rather than pretending the change saved.
      setWriteBlocked(true);
      setLastWriteError((e && e.code) || "unknown");
      saveLocalFallback(data); // don't lose the change locally even if the group never sees it
    }
    writingRef.current = false;
    if(pendingWriteRef.current!==null) flushCloudWrite();
  }

  // Any LOCAL change to db gets persisted — to the shared store when
  // connected, to this device only otherwise. Changes arriving FROM the
  // store (the snapshot handler above) are flagged so they don't bounce
  // straight back out as a write.
  useEffect(()=>{
    if(!db) return;
    if(applyingRemoteRef.current){ applyingRemoteRef.current = false; return; }
    if(cloudStatus==="connected" && cloudDocRef.current){
      pendingWriteRef.current = db;
      flushCloudWrite();
    } else {
      saveLocalFallback(db);
    }
  }, [db]);

  useEffect(()=>{ document.documentElement.setAttribute("data-theme", theme==="system" ? "" : theme); }, [theme]);

  // Fires the bell wiggle + top banner whenever a genuinely new notification
  // shows up at the front of the list AND it's from someone else's action —
  // no need to alert yourself about something you just did.
  useEffect(()=>{
    if(!db || !db.notifications || db.notifications.length===0) return;
    const top = db.notifications[0];
    if(prevTopNotifRef.current !== null && top.id !== prevTopNotifRef.current && top.actorId !== ME){
      setNotifBanner(top);
      setBellWiggle(true);
      playNotifSound();
      setTimeout(()=>setBellWiggle(false), 550);
      clearTimeout(notifBannerTimerRef.current);
      notifBannerTimerRef.current = setTimeout(()=>setNotifBanner(n => (n && n.id===top.id) ? null : n), 4500);
    }
    prevTopNotifRef.current = top.id;
  }, [db && db.notifications && db.notifications[0] && db.notifications[0].id]);
  function setTheme(t){ setThemeState(t); safeSet(THEME_KEY, t); }

  function dispatch(action){
    if(action.type==="TOAST"){
      setToast({message:action.message, onUndo:action.onUndo});
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(()=>setToast(null), 4200);
      return;
    }
    setDb(d => reducer(d, action));
  }

  function openPlan(id){ if(showNotifications) dispatch({type:"MARK_ALL_READ"}); setShowUninterested(false); setShowHistory(false); setShowNotifications(false); setOpenGroupId(null); setOpenPlanId(id); }
  function closeNotifications(){ dispatch({type:"MARK_ALL_READ"}); setShowNotifications(false); }
  function closePlan(){ setOpenPlanId(null); }
  function openDayOf(id){ setOpenPlanId(null); setDayOfId(id); }
  function closeDayOf(){ setDayOfId(null); }

  useEffect(()=>{
    function onScroll(){ setScrolled(window.scrollY>4); }
    window.addEventListener("scroll", onScroll);
    return ()=>window.removeEventListener("scroll", onScroll);
  },[]);

  if(checkingSession) return null;
  if(!authedUserId) return <LoginScreen onLogin={handleLogin}/>;

  const unreadCount = db ? db.notifications.filter(n=>!n.read && n.actorId!==ME).length : 0;
  const currentUserName = (db && db.users[ME] && db.users[ME].name) || (CREDENTIALS[Object.keys(CREDENTIALS).find(k=>CREDENTIALS[k].userId===ME)]||{}).name || "you";

  return (
    <React.Fragment>
      <div className={`app-header ${scrolled?"scrolled":""}`}>
        <span className="brand">who's in<span className="qmark">?</span></span>
        <div className="header-icons">
          <button className={`icon-btn ${unreadCount>0?"has-unread":""} ${bellWiggle?"bell-wiggle":""}`} aria-label="Updates" onClick={()=>setShowNotifications(true)}><IconBell/>{unreadCount>0 && <span className="badge-dot"/>}</button>
        </div>
      </div>

      {notifBanner && (
        <div className="notif-toast" onClick={()=>{ setNotifBanner(null); if(notifBanner.planId && db.plans[notifBanner.planId]) openPlan(notifBanner.planId); }}>
          <span className="nt-emoji">{NOTIF_EMOJI[notifBanner.type]||"🔔"}</span>
          <span className="nt-text">{notifBanner.message}</span>
        </div>
      )}

      {cloudStatus==="unavailable" && !loading && (
        <div className="sync-banner">Syncing on this device only — check that the Firebase config at the top of the file has been filled in, and that you're online.</div>
      )}
      {cloudStatus==="connected" && writeBlocked && !loading && (
        <div className="sync-banner">Connected, but changes aren't saving to the shared copy — check the Firestore security rules match the ones in the setup comment at the top of the file.</div>
      )}

      <div className="main-content">
        {loading || !db ? (
          <HomeScreen loading={true} />
        ) : (
          <>
            {tab==="home" && <HomeScreen db={db} onOpen={openPlan} openDayOf={openDayOf} loading={false}/>}
            {tab==="all" && <AllPlansScreen db={db} onOpen={openPlan} openDayOf={openDayOf}/>}
            {tab==="calendar" && <CalendarScreen db={db} onOpen={openPlan}/>}
            {tab==="profile" && <ProfileScreen db={db} theme={theme} setTheme={setTheme} onOpenUninterested={()=>setShowUninterested(true)} onOpenHistory={()=>setShowHistory(true)} onOpenGroup={(id)=>setOpenGroupId(id)} onNewGroup={()=>setNewGroupOpen(true)} onLogout={handleLogout} currentUserName={currentUserName} cloudStatus={cloudStatus} writeBlocked={writeBlocked} onRetrySync={()=>setRetryKey(k=>k+1)} onResetData={(mode)=>{ hasSeededRef.current = true; setDb(mode==="blank" ? seedEmpty() : seed()); dispatch({type:"TOAST", message: mode==="blank" ? "Wiped — ready for a new group" : "Demo data restored for everyone"}); }}/>}
          </>
        )}
      </div>

      {!loading && db && <button className="fab" aria-label="Share a new idea" onClick={()=>setNewPlanOpen(true)}>+</button>}

      <div className="bottom-nav">
        <button className={`nav-item ${tab==="home"?"active":""}`} onClick={()=>setTab("home")}><IconHome/><span className="nlabel">Home</span></button>
        <button className={`nav-item ${tab==="all"?"active":""}`} onClick={()=>setTab("all")}><IconCompass/><span className="nlabel">All plans</span></button>
        <button className={`nav-item ${tab==="calendar"?"active":""}`} onClick={()=>setTab("calendar")}><IconCal/><span className="nlabel">Calendar</span></button>
        <button className={`nav-item ${tab==="profile"?"active":""}`} onClick={()=>setTab("profile")}><IconUser/><span className="nlabel">Profile</span></button>
      </div>

      {db && openPlanId && db.plans[openPlanId] && (<><div className="scrim" onClick={closePlan}/><PlanDetail db={db} planId={openPlanId} onClose={closePlan} dispatch={dispatch} openDayOf={openDayOf}/></>)}
      {db && dayOfId && db.plans[dayOfId] && (
        <div style={{position:"fixed", inset:0, zIndex:60, maxWidth:520, margin:"0 auto", left:0, right:0}}>
          <DayOfScreen db={db} planId={dayOfId} onClose={closeDayOf} dispatch={dispatch}/>
        </div>
      )}
      {db && newPlanOpen && (<><div className="scrim" onClick={()=>setNewPlanOpen(false)}/><NewPlanSheet db={db} onClose={()=>setNewPlanOpen(false)} dispatch={dispatch}/></>)}
      {db && newGroupOpen && (<><div className="scrim" onClick={()=>setNewGroupOpen(false)}/><NewGroupSheet db={db} onClose={()=>setNewGroupOpen(false)} dispatch={dispatch}/></>)}
      {db && openGroupId && db.groups[openGroupId] && (<><div className="scrim" onClick={()=>setOpenGroupId(null)}/><GroupDetailSheet db={db} groupId={openGroupId} onClose={()=>setOpenGroupId(null)} dispatch={dispatch}/></>)}

      {db && showUninterested && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={()=>setShowUninterested(false)}><IconClose/></button>
          <SimplePlanListScreen db={db} plans={Object.values(db.plans).filter(isPutAsideForMe).sort((a,b)=>putAsideAt(b)-putAsideAt(a))}
            title="Put aside" sub="nothing's deleted — drag it back whenever" emptyEmoji="🧺" emptyTitle="Nothing set aside" emptySub="Everything you're part of is still alive and kicking."
            showRestore dispatch={dispatch} onOpen={openPlan}/>
        </div>
      )}
      {db && showHistory && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={()=>setShowHistory(false)}><IconClose/></button>
          <SimplePlanListScreen db={db} plans={Object.values(db.plans).filter(p=>p.state==="happened").sort((a,b)=>b.dateTime-a.dateTime)}
            title="Plan history" sub="everything you've actually done" emptyEmoji="📖" emptyTitle="No history yet" emptySub="Plans move here once they've happened."
            showRestore={false} dispatch={dispatch} onOpen={openPlan}/>
        </div>
      )}
      {db && showNotifications && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={closeNotifications}><IconClose/></button>
          <NotificationsScreen db={db} onOpen={openPlan} dispatch={dispatch}/>
        </div>
      )}

      <Toast toast={toast} onDismiss={()=>setToast(null)}/>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
