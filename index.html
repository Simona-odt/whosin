<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>who's in?</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#141414">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --text:#17140F;
  --text-soft:#726F6A;
  --line: rgba(20,20,20,0.09);
  --accent-ink:#141414;
  --c-coral:#F2745E;
  --c-amber:#F3B94D;
  --c-olive:#C3D65C;
  --c-lavender:#ACA2EA;
  --c-mint:#8FD6C0;
  --c-sky:#8CC1EA;
  --c-rose:#EA9AB2;
  --c-teal:#6FC3B4;
  --danger:#E1573E;
  --muted:#9A968F;
  --chrome:#141414;
  --chrome-text:#F5F3EE;
  --chrome-soft:#77746D;
  --radius-card:28px;
  --radius-sm:16px;
  --font-ui:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1E1E1E; --text:#F2F0EA; --text-soft:#A5A19B; --line: rgba(255,255,255,0.09);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1E1E; --text:#F2F0EA; --text-soft:#A5A19B; --line: rgba(255,255,255,0.09);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;
  font-feature-settings:"tnum" 1;
}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg); display:flex; flex-direction:column;}
.main-content{flex:1 0 auto; display:flex; flex-direction:column;}
.main-content > *{flex:1 0 auto;}
button{font-family:inherit;}
::selection{background:var(--c-amber);color:var(--accent-ink);}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}
.hscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
h1,h2,h3,h4,p{margin:0;}
input,textarea{font-family:inherit;}
.qmark, .excl{color:var(--c-coral);}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:30; background:var(--bg);
  padding:26px 24px 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent; transition:border-color .2s ease;
}
.app-header.scrolled{border-color:var(--line);}
.brand{font-weight:700; font-size:19px; letter-spacing:-0.01em; color:var(--text);}
.header-icons{display:flex; gap:10px; align-items:center;}
.icon-btn{
  width:42px;height:42px;border-radius:50%; border:none; background:var(--surface);
  display:flex;align-items:center;justify-content:center; cursor:pointer; position:relative; color:var(--text); flex:none;
  transition:opacity .1s ease;
}
.icon-btn:active{opacity:.6;}
.badge-dot{position:absolute; top:2px; right:3px; width:9px;height:9px;border-radius:50%; background:var(--c-coral); border:2px solid var(--bg);}
.icon-btn.has-unread{background:rgba(242,116,94,0.18); color:var(--c-coral);}
.icon-btn.bell-wiggle{animation:bellWiggle .5s ease;}
@keyframes bellWiggle{0%,100%{transform:rotate(0);} 20%{transform:rotate(-16deg);} 40%{transform:rotate(14deg);} 60%{transform:rotate(-10deg);} 80%{transform:rotate(6deg);}}

.notif-toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:90;
  width:calc(100% - 48px); max-width:472px; background:var(--chrome); color:var(--chrome-text);
  border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); animation:notifIn .25s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}
@keyframes notifIn{from{opacity:0; transform:translateX(-50%) translateY(-16px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
.notif-toast .nt-emoji{font-size:18px; flex:none;}
.notif-toast .nt-text{font-size:13px; font-weight:600; line-height:1.4;}

/* ============ SECTIONS ============ */
.section{padding:32px 24px 4px;}
.section-title{font-size:20px; font-weight:700; margin:0 0 5px 0; color:var(--text); letter-spacing:-0.01em;}
.section-sub{font-size:14px; color:var(--text-soft); margin:0 0 20px 0; font-weight:500;}
.hairline{height:1px; background:var(--line); margin:8px 24px 0;}

/* ============ TODAY / IN THE WORKS ROW ============ */
.works-row{display:flex; gap:16px; padding:2px 24px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.works-row::-webkit-scrollbar{display:none;}
.works-card{
  flex:none; width:196px; border-radius:26px; padding:20px; color:var(--text);
  background:var(--surface);
  position:relative; overflow:hidden; cursor:pointer; min-height:164px;
  display:flex; flex-direction:column; justify-content:space-between; transition:opacity .1s ease;
}
.works-card:active{opacity:.85;}
.works-card .glyph{position:absolute; right:-10px; bottom:-16px; font-size:78px; opacity:0.5; line-height:1;}
.works-card .p-title{font-weight:700; font-size:16px; line-height:1.25; position:relative; z-index:1;}
.works-card .p-when{font-size:12.5px; opacity:0.75; font-weight:600; margin-top:8px; position:relative; z-index:1;}
.works-card .p-status{display:none;}
.works-card.today-card{background:linear-gradient(135deg, var(--c-amber), var(--c-coral)) !important; color:var(--accent-ink);}

.works-card .p-date-badge{display:inline-block; margin-bottom:8px; font-size:11px; font-weight:800; background:rgba(128,128,128,0.25); padding:4px 10px; border-radius:20px; position:relative; z-index:1; align-self:flex-start;}
.works-card.new-arrival{animation:cardPop .6s cubic-bezier(.2,.8,.2,1);}
@keyframes cardPop{0%{transform:scale(0.85); box-shadow:0 0 0 0 rgba(243,185,77,0);} 60%{transform:scale(1.04); box-shadow:0 0 0 14px rgba(243,185,77,0.25);} 100%{transform:scale(1); box-shadow:0 0 0 0 rgba(243,185,77,0);}}

/* ============ FEED CARD (unified list) ============ */
.pool-label{font-size:13.5px; font-weight:700; color:var(--text); padding:20px 24px 12px;}
.plan-list{padding:0 24px; display:flex; flex-direction:column; gap:18px;}
.feed-card{background:var(--surface); border-radius:var(--radius-card); overflow:hidden; cursor:pointer; position:relative; transition:opacity .1s ease; border:none; outline:none;}
.feed-card:active{opacity:.9;}
.feed-card.muted{opacity:.45;}
.feed-card .fc-hero{height:112px; position:relative; display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px; color:var(--accent-ink);}
.feed-card .fc-hero .dg{position:absolute; right:-6px; bottom:-16px; font-size:80px; opacity:0.32;}
.feed-card .fc-chip{display:none;}
.feed-card .fc-pin{font-size:13px; position:relative; z-index:1;}
.feed-card .unseen-flag{font-size:10px; font-weight:700; background:var(--chrome); color:var(--chrome-text); padding:5px 9px; border-radius:20px; position:relative; z-index:1;}
.feed-card .fc-body{padding:16px 18px 18px;}
.feed-card .fc-title{font-weight:700; font-size:16px; color:var(--text); line-height:1.3; margin-bottom:5px;}
.feed-card .fc-meta{font-size:12.5px; color:var(--text-soft); font-weight:500;}
.feed-card .fc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.resp-tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;}
.resp-tag.yes{background:var(--c-olive); color:var(--accent-ink);}
.resp-tag.yesbut{background:var(--c-sky); color:var(--accent-ink);}
.reason-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; background:var(--bg); padding:4px 10px; border-radius:20px; color:var(--text-soft);}
.feed-card .fc-foot{display:none;}
.fc-group-tag,.works-group-tag{position:absolute;right:12px;bottom:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 24px);padding:7px 10px;border-radius:999px;background:rgba(20,20,20,.72);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:#fff;font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 6px rgba(0,0,0,.18);}
.avatars{display:flex; align-items:center;}
.avatar{width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700; border:2px solid var(--surface); margin-left:-9px; flex:none;}
.avatar:first-child{margin-left:0;}
.avatar-plus{background:var(--bg); color:var(--text-soft); border:2px solid var(--surface);}

/* ============ EMPTY / LOADING ============ */
.empty-state{padding:60px 32px; text-align:center;}
.empty-state .em-emoji{font-size:38px; margin-bottom:16px;}
.empty-state h3{font-size:17px; font-weight:700; margin:0 0 8px;}
.empty-state p{font-size:14px; color:var(--text-soft); max-width:260px; margin:0 auto; font-weight:500;}
.skeleton{background:linear-gradient(90deg, var(--line) 25%, transparent 37%, var(--line) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:24px;}
@keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}

/* ============ BOTTOM NAV / FAB ============ */
.bottom-nav{position:sticky; bottom:0; left:0; right:0; z-index:40; background:var(--chrome); display:flex; padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px); padding-top:14px;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; color:var(--chrome-soft); cursor:pointer; padding:4px 2px;}
.nav-item.active{color:var(--c-amber);}
.nav-item .nlabel{font-size:10.5px; font-weight:600;}
.fab{position:fixed; z-index:35; right:calc(50% - 260px + 24px); bottom:96px; width:58px; height:58px; border-radius:50%; background:var(--c-amber); color:var(--accent-ink); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,0.18); cursor:pointer; font-size:26px; font-weight:400; line-height:1;}
@media (max-width:600px){ .fab{ right:24px; } }
.fab:active{opacity:.85;}

/* ============ SHEET / MODAL ============ */
.scrim{position:fixed; inset:0; background:rgba(10,10,10,0.5); z-index:50; opacity:0; animation:scrimIn .2s ease forwards;}
@keyframes scrimIn{to{opacity:1}}
.sheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:51; width:100%; max-width:520px; height:75vh; max-height:75vh; background:var(--bg); border-radius:32px 32px 0 0; overflow:hidden; display:flex; flex-direction:column; animation:sheetUp .25s cubic-bezier(.2,.8,.2,1) forwards; box-shadow:0 -8px 30px rgba(0,0,0,0.18); overscroll-behavior:contain;}
@keyframes sheetUp{from{transform:translateX(-50%) translateY(100%)} to{transform:translateX(-50%) translateY(0)}}
.sheet-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; min-height:0;}
.sheet-handle{width:40px;height:4px;border-radius:4px;background:var(--line); margin:12px auto 2px;}
.sheet-close{position:absolute; top:18px; right:18px; width:36px;height:36px;border-radius:50%; background:rgba(20,20,20,0.32); backdrop-filter:blur(6px); color:#fff; border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:5;}
.pin-toggle{position:absolute; top:18px; left:18px; width:36px;height:36px;border-radius:50%; background:rgba(20,20,20,0.32); backdrop-filter:blur(6px); color:#fff; border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:5;}
.pin-toggle.on{background:var(--c-amber); color:var(--accent-ink);}
.fullscreen{position:relative; min-height:100vh; background:var(--bg); animation:fadeIn .16s ease;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}

/* ============ PLAN HERO ============ */
.plan-hero{min-height:210px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:24px; color:var(--accent-ink); overflow:hidden;}
.plan-hero .glyph-big{position:absolute; right:-16px; top:-16px; font-size:150px; opacity:0.3;}
.plan-hero .hcat{font-size:12px; font-weight:700; opacity:0.75; background:rgba(20,20,20,0.14); display:inline-block; padding:5px 10px; border-radius:20px; position:relative; z-index:1;}
.plan-hero .htitle{font-weight:700; font-size:23px; line-height:1.2; margin-top:12px; letter-spacing:-0.01em; position:relative; z-index:1;}
.notch-dot{position:relative; z-index:2; width:26px; height:26px; border-radius:50%; background:var(--bg); margin:-13px auto 0;}

.plan-body{padding:22px 24px 16px;}
.meta-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.meta-list{display:flex; flex-direction:column; gap:14px; margin:4px 0 20px; flex:1;}
.meta-row{display:flex; align-items:center; gap:14px; font-size:14.5px; color:var(--text); font-weight:500;}
.meta-row .mi{width:20px; text-align:center; flex:none; opacity:0.7; display:flex; align-items:center; justify-content:center;}
.meta-row b{font-weight:700;}
.pencil-btn{width:34px;height:34px;border-radius:50%; background:var(--surface); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none;}
.pencil-btn:active{opacity:.7;}

.status-banner{border-radius:18px; padding:16px 18px; display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.status-banner .sb-title{font-weight:700; font-size:15px;}
.status-banner .sb-sub{font-size:12.5px; opacity:0.85; margin-top:3px; font-weight:500;}

.note-box{background:var(--surface); border-radius:18px; padding:14px 16px; font-size:13.5px; color:var(--text); margin-bottom:18px; font-weight:500; line-height:1.5;}
.section-mini-title{font-size:13px; font-weight:700; color:var(--text); margin:22px 0 12px;}

.people-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.people-summary{font-size:14.5px; font-weight:600;}
.people-avatars{display:flex; flex-direction:column; gap:4px; margin-top:12px;}
.person-chip-wrap{border-radius:14px; overflow:hidden;}
.person-chip{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:500; color:var(--text); padding:8px 6px; cursor:pointer; border-radius:14px; background:none; border:none; width:100%; text-align:left;}
.person-chip:active{background:var(--surface);}
.person-chip .sm-av{width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700; flex:none;}
 .person-chip .pc-note{
  display:inline-block;
  position:relative;
  margin-left:8px;
  padding:6px 10px;
  border-radius:14px;
  background:var(--surface);
  color:var(--text);
  font-style:normal;
  font-size:12px;
  font-weight:500;
  line-height:1.3;
  vertical-align:middle;
}
.person-chip .pc-note::before{
  content:"";
  position:absolute;
  left:-5px;
  top:9px;
  width:9px;
  height:9px;
  background:var(--surface);
  transform:rotate(45deg);
  border-radius:2px;
}
.role-tag{font-size:10.5px; font-weight:700; color:var(--c-lavender); margin-left:4px;}
.person-actions{padding:2px 6px 12px 42px; display:flex; gap:8px; flex-wrap:wrap;}
.nudge-row{margin-top:6px;}
.poke-mini{background:var(--c-amber); color:var(--accent-ink); border:none; border-radius:14px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex:none; white-space:nowrap;}
.poke-mini:active{opacity:.8;}
.nudge-btn{width:100%; background:var(--c-amber); color:var(--accent-ink); border:none; border-radius:18px; font-weight:700; font-size:13.5px; padding:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
.nudge-btn:active{opacity:.8;}

/* ============ RESPONSE ============ */
.resp-block{background:rgba(243,185,77,0.14); border-radius:22px; padding:18px; margin:18px 0;}
.resp-summary{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.resp-summary .rs-text{font-size:14.5px; font-weight:600;}
.resp-summary .rs-note{font-size:12.5px; color:var(--text-soft); margin-top:4px; font-weight:500;}
.resp-summary .rs-sub{margin-top:6px;}
.rs-link{background:none; border:none; color:var(--c-coral); font-size:12.5px; font-weight:700; cursor:pointer; padding:0;}
.resp-current .rc-label{font-size:12px; font-weight:600; color:var(--text-soft);}
.resp-buttons{display:flex; gap:10px; margin-top:14px;}
.resp-btn{flex:1; min-width:0; border-radius:18px; border:none; background:var(--bg); padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; font-weight:600; font-size:12px; color:var(--text); white-space:nowrap;}
.resp-btn .rb-emoji{font-size:19px;}
.resp-btn:active{opacity:.8;}
.resp-btn.selected.yes{background:var(--c-olive); color:var(--accent-ink);}
.resp-btn.selected.yesbut{background:var(--c-amber); color:var(--accent-ink);}
.resp-btn.selected.no{background:var(--chrome); color:var(--chrome-text);}
.yesbut-field{margin-top:14px;}
.yesbut-field textarea{width:100%; border-radius:16px; border:none; background:var(--bg); padding:13px 15px; font-size:13.5px; color:var(--text); resize:none; min-height:50px; font-family:inherit;}
.yesbut-field textarea:focus{outline:2px solid var(--c-amber);}
.yesbut-hint{font-size:11.5px; color:var(--text-soft); margin-top:6px; font-weight:500;}
.no-reason-field{margin-top:14px;}
.no-reason-field textarea{width:100%; border-radius:16px; border:none; background:var(--bg); padding:13px 15px; font-size:13.5px; color:var(--text); resize:none; min-height:68px; font-family:inherit;}
.no-reason-field textarea:focus{outline:2px solid var(--c-coral);}
.no-reason-hint{font-size:11.5px; color:var(--text-soft); margin-top:6px; font-weight:500;}
.no-reason-actions{display:flex; gap:8px; margin-top:10px;}
.no-reason-actions .primary-btn{flex:1; margin-top:0;}
.no-reason-actions .small-btn{flex:none;}
.backout-link{margin-top:16px; text-align:center; font-size:13px; font-weight:600; color:var(--c-coral); background:none; border:none; cursor:pointer; width:100%; padding:6px;}

.primary-btn{width:100%; background:var(--chrome); color:var(--chrome-text); border:none; border-radius:20px; padding:16px; font-weight:600; font-size:14.5px; cursor:pointer; margin-top:8px;}
.primary-btn:active{opacity:.85;}
.primary-btn.ghost{background:var(--surface); color:var(--text);}
.primary-btn.accent{background:var(--c-amber); color:var(--accent-ink);}
.primary-btn.danger{background:var(--c-coral); color:var(--accent-ink);}
.primary-btn:disabled{opacity:.4; cursor:not-allowed;}
.small-btn{background:var(--bg); border:none; border-radius:14px; padding:10px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text);}
.small-btn.accent{background:var(--c-amber); color:var(--accent-ink);}

.hype-note-btn{width:100%; text-align:left; background:var(--surface); border:none; border-radius:16px; padding:13px 15px; font-size:13px; color:var(--text-soft); cursor:pointer; margin-top:8px; font-weight:500;}

/* ============ TOAST ============ */
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); z-index:80; background:var(--chrome); color:var(--chrome-text); padding:14px 18px; border-radius:20px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:16px; box-shadow:0 8px 24px rgba(0,0,0,0.25); max-width:calc(100% - 48px); animation:toastIn .2s cubic-bezier(.2,.8,.2,1);}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(10px)} to{opacity:1; transform:translateX(-50%) translateY(0)}}
.toast button{background:none; border:none; color:var(--c-amber); font-weight:700; font-size:13px; cursor:pointer; flex:none;}

/* ============ DAY-OF ============ */
.dayof-screen{min-height:100vh; display:flex; flex-direction:column;}
.dayof-hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 34px; color:var(--accent-ink); position:relative;}
.dayof-hero .dglyph{font-size:56px; margin-bottom:20px;}
.dayof-hero h1{font-size:24px; font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
.dayof-hero p{font-size:13.5px; opacity:0.8; margin:0; font-weight:500;}
.dayof-hero .countdown{font-size:12.5px; font-weight:700; margin-top:20px; background:rgba(20,20,20,0.14); padding:9px 18px; border-radius:20px;}
.dayof-actions{padding:26px 26px calc(env(safe-area-inset-bottom,0px) + 26px); background:var(--bg); display:flex; flex-direction:column; gap:12px;}
.dayof-reactions{display:flex; gap:12px; justify-content:center; margin-bottom:6px;}
.dayof-react{font-size:22px; background:var(--surface); border:none; width:54px;height:54px;border-radius:50%; display:flex;align-items:center;justify-content:center; cursor:pointer;}
.dayof-react.picked{background:var(--c-amber);}
.dayof-react.custom-input{padding:0;}
.custom-emoji-input{width:54px; height:54px; border-radius:50%; border:none; background:var(--surface); text-align:center; font-size:20px; font-family:inherit;}
.custom-emoji-input:focus{outline:2px solid var(--c-amber);}
.snap-btn{background:var(--chrome); color:var(--chrome-text); border:none; border-radius:20px; padding:14px; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
.snap-strip{display:flex; gap:10px; justify-content:center; margin-top:4px; flex-wrap:wrap;}
.snap-photo{width:52px; height:68px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;}
.quiet-out{text-align:center; font-size:13px; color:var(--text-soft); background:none; border:none; cursor:pointer; padding:6px; font-weight:500;}

/* ============ FALLBACK ============ */
.fallback-card{background:var(--c-lavender); color:var(--accent-ink); border-radius:20px; padding:18px; margin:18px 0;}
.fallback-card .fb-eyebrow{font-size:11px; font-weight:700; opacity:0.8;}
.fallback-card h4{font-size:16.5px; margin:8px 0 6px; font-weight:700;}
.fallback-card textarea{width:100%; border-radius:14px; border:none; background:rgba(255,255,255,0.5); padding:12px 14px; font-size:13px; color:var(--accent-ink); font-weight:500; resize:none; min-height:70px; font-family:inherit; margin-bottom:12px;}
.fallback-card .fb-actions{display:flex; gap:10px;}
.fallback-card button{border:none; border-radius:14px; padding:11px 14px; font-weight:600; font-size:12.5px; cursor:pointer;}
.fallback-card .fb-yes{background:var(--accent-ink); color:#fff; flex:1;}
.fallback-card .fb-no{background:rgba(20,20,20,0.14); color:var(--accent-ink);}
.generate-btn{width:100%; background:rgba(255,255,255,0.55); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px; font-weight:700;}
.spark-icon{display:inline-flex;}

/* ============ PLANNER CONTROLS ============ */
.planner-box{background:var(--surface); border-radius:20px; padding:18px; margin:18px 0;}
.planner-box .pb-title{font-size:13px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:7px;}
.planner-actions{display:flex; flex-direction:column; gap:10px;}
.suggestion-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line);}
.suggestion-row:first-child{border-top:none; padding-top:0;}
.suggestion-text{font-size:13px; font-weight:500; color:var(--text);}
.suggestion-author{font-size:11.5px; color:var(--text-soft); margin-top:2px; text-align:right;}
.request-row{display:flex; align-items:center; gap:10px; padding:8px 0;}

/* ============ SIMPLE LIST SCREEN (put aside / history) ============ */
.simple-card{background:var(--surface); border-radius:22px; padding:16px; display:flex; gap:14px; align-items:center; margin-bottom:14px;}
.simple-card .ui-glyph{width:46px;height:46px;border-radius:14px; display:flex;align-items:center;justify-content:center; font-size:20px; flex:none;}
.simple-card .ui-title{font-weight:700; font-size:14.5px;}
.simple-card .ui-reason{font-size:11.5px; color:var(--text-soft); margin-top:3px; font-weight:500;}
.restore-btn{background:var(--bg); border:none; border-radius:14px; padding:9px 13px; font-size:12px; font-weight:600; cursor:pointer; flex:none;}
.restore-btn:active{opacity:.7;}

/* ============ DISCOVER FILTER / MAP ============ */
.chip-row{display:flex; gap:10px; overflow-x:auto; padding:2px 24px 4px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.chip-row-with-filter{display:flex; align-items:center; gap:8px; padding:2px 24px 4px;}
.chip-row-with-filter .chip-row{overflow-x:auto; flex:1; padding:0;}
.filter-icon-btn{position:relative; flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.filter-icon-btn.active{background:var(--c-amber); color:var(--accent-ink);}
.filter-count{position:absolute; top:-3px; right:-3px; background:var(--c-coral); color:#fff; font-size:9.5px; font-weight:800; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{flex:none; padding:10px 16px; border-radius:20px; border:none; background:var(--surface); font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text);}
.chip.active{background:var(--c-amber); color:var(--accent-ink);}
.map-toggle{margin:4px 24px 8px; display:flex; background:var(--surface); border-radius:18px; padding:5px;}
.map-toggle button{flex:1; border:none; background:none; padding:10px; border-radius:14px; font-weight:600; font-size:13px; cursor:pointer; color:var(--text-soft);}
.map-toggle button.on{background:var(--chrome); color:var(--chrome-text);}
.map-visual{margin:8px 24px 24px; border-radius:24px; height:270px; position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line);}
.map-pin{position:absolute; transform:translate(-50%,-100%); display:flex; flex-direction:column; align-items:center; cursor:pointer;}
.map-pin .pin-dot{width:34px;height:34px;border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:flex;align-items:center;justify-content:center; color:var(--accent-ink); font-weight:800; font-size:14px;}
.map-pin .pin-dot span{transform:rotate(45deg);}
.map-pin .pin-label{margin-top:6px; font-size:10.5px; font-weight:600; background:var(--surface); padding:3px 8px; border-radius:8px; white-space:nowrap;}

/* ============ CALENDAR ============ */
.cal-grid-head{display:flex; align-items:center; justify-content:space-between; padding:0 24px 14px;}
.cal-nav-btn{width:36px;height:36px;border-radius:50%; background:var(--surface); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer;}
.cal-month-label{font-size:16px; font-weight:700;}
.cal-view-toggle{margin:0 24px 18px; display:flex; background:var(--surface); border-radius:18px; padding:5px;}
.cal-view-toggle button{flex:1; border:none; background:none; padding:10px; border-radius:14px; font-weight:600; font-size:13px; cursor:pointer; color:var(--text-soft);}
.cal-view-toggle button.on{background:var(--chrome); color:var(--chrome-text);}

.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; padding:0 24px 8px; overflow:hidden;}
.cal-dow{text-align:center; font-size:10.5px; font-weight:700; color:var(--text-soft); padding-bottom:6px;}
.cal-day{min-width:0; min-height:58px; border-radius:14px; display:flex; flex-direction:column; align-items:center; padding:6px 2px; cursor:pointer; background:transparent; border:2px solid transparent; font-size:12px; font-weight:600; color:var(--text); gap:2px; overflow:hidden;}
.cal-day.today{background:var(--surface);}
.cal-day.selected{border-color:var(--chrome);}
.cal-day.empty{cursor:default; visibility:hidden;}
.cal-day-chip{font-size:7.5px; font-weight:700; padding:2px 3px; border-radius:4px; width:100%; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--accent-ink); box-sizing:border-box;}
.cal-more{font-size:7.5px; color:var(--text-soft); font-weight:700;}

.week-list{padding:0 24px 8px; display:flex; flex-direction:column; gap:10px;}
.week-day-row{display:flex; gap:14px; border-radius:20px; padding:14px; background:var(--surface); border:2px solid transparent;}
.week-day-row.today{border-color:var(--c-amber);}
.week-day-row.selected{border-color:var(--chrome);}
.week-day-num{flex:none; width:44px; text-align:center; cursor:pointer;}
.week-day-num .wd-dow{font-size:10px; font-weight:700; color:var(--text-soft);}
.week-day-num .wd-num{font-size:18px; font-weight:700; margin-top:2px;}
.week-day-events{flex:1; display:flex; flex-direction:column; gap:6px; min-width:0;}
.week-event-chip{display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; cursor:pointer; color:var(--accent-ink); font-size:12.5px; font-weight:700;}
.week-event-empty{font-size:12px; color:var(--text-soft); font-weight:500; padding:8px 2px;}

.agenda-date{font-size:13px; font-weight:700; color:var(--text-soft); padding:20px 24px 10px;}
.agenda-row{display:flex; align-items:center; gap:14px; padding:12px 24px; cursor:pointer;}
.agenda-row .ar-glyph{width:44px;height:44px;border-radius:14px; display:flex;align-items:center;justify-content:center; font-size:19px; flex:none;}
.agenda-row .ar-title{font-weight:700; font-size:14px;}
.agenda-row .ar-meta{font-size:12px; color:var(--text-soft); margin-top:2px; font-weight:500;}
.agenda-row .ar-check{font-size:15px;}

/* ============ PROFILE / GROUPS ============ */
.group-row{display:flex; align-items:center; gap:14px; padding:16px 24px; cursor:pointer;}
.group-row .g-emoji{width:46px;height:46px;border-radius:16px; background:var(--surface); display:flex;align-items:center;justify-content:center; font-size:19px;}
.group-row .g-name{font-weight:700; font-size:14.5px;}
.group-row .g-sub{font-size:12px; color:var(--text-soft); margin-top:2px; font-weight:500;}
.new-group-btn{display:flex; align-items:center; gap:14px; padding:16px 24px; cursor:pointer; background:none; border:none; width:100%; text-align:left;}
.new-group-btn .g-plus{width:46px;height:46px;border-radius:16px; background:var(--surface); display:flex;align-items:center;justify-content:center; font-size:19px; color:var(--text-soft);}
.nav-card{display:flex; align-items:center; gap:16px; padding:20px; background:var(--surface); border-radius:22px; margin:0 24px 14px; cursor:pointer; text-align:left; border:none; width:calc(100% - 48px);}
.nav-card .nc-emoji{width:46px;height:46px;border-radius:16px; background:var(--bg); display:flex;align-items:center;justify-content:center; font-size:19px; flex:none;}
.nav-card .nc-body{flex:1; min-width:0;}
.nav-card .nc-title{font-weight:700; font-size:15px;}
.nav-card .nc-sub{font-size:12.5px; color:var(--text-soft); margin-top:3px; font-weight:500;}
.nav-card .nc-arrow{font-size:18px; color:var(--text-soft); flex:none;}
.theme-row{display:flex; gap:10px; padding:16px 24px;}
.theme-btn{flex:1; padding:11px; border-radius:16px; border:none; background:var(--surface); font-weight:600; font-size:12.5px; cursor:pointer; color:var(--text);}
.theme-btn.on{background:var(--c-amber); color:var(--accent-ink);}
.member-row{display:flex; align-items:center; gap:14px; padding:12px 0;}
.member-row .m-name{font-weight:600; font-size:14px; flex:1;}
.member-row .m-role{font-size:11.5px; color:var(--text-soft); font-weight:500;}
.small-action-btn{background:var(--bg); border:none; border-radius:12px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer; color:var(--text);}
.small-action-btn.danger{color:var(--c-coral);}
.group-name-row{display:flex; align-items:center; gap:10px;}
.group-name-input{font-size:19px; font-weight:700; border:none; border-bottom:2px solid var(--line); background:transparent; padding:2px 0; font-family:inherit; color:var(--text); flex:1;}

/* ============ NOTIFICATIONS ============ */
.notif-group-label{font-size:12.5px; font-weight:700; color:var(--text-soft); padding:22px 24px 6px; display:flex; align-items:center; gap:8px;}
.notif-row{display:flex; gap:14px; padding:14px 24px; align-items:flex-start; cursor:pointer;}
.notif-row.unread{background:rgba(128,128,128,0.16);}
.notif-emoji{width:40px;height:40px;border-radius:50%; background:var(--bg); display:flex;align-items:center;justify-content:center; font-size:16px; flex:none;}
.notif-text{font-size:13.5px; line-height:1.5; font-weight:500;}
.notif-time{font-size:11.5px; color:var(--text-soft); margin-top:4px; font-weight:500;}

/* ============ FORMS ============ */
.form-field{margin-bottom:18px;}
.form-label{font-size:12px; font-weight:600; color:var(--text-soft); margin-bottom:9px; display:block;}
.form-input, .form-textarea{width:100%; border-radius:16px; border:none; background:var(--surface); padding:13px 15px; font-size:14.5px; color:var(--text); font-family:inherit;}
.form-textarea{resize:none; min-height:60px;}
.pill-select{display:flex; gap:9px; flex-wrap:wrap;}
.pill-select .ps-opt{padding:10px 15px; border-radius:18px; background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; color:var(--text);}
.pill-select .ps-opt.on{background:var(--c-amber); color:var(--accent-ink);}
.inline-add-row{display:flex; gap:8px; align-items:center;}
.inline-add-row input{flex:1;}
.visually-hidden{position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0 0 0 0);}

/* ============ LOGIN ============ */
.login-screen{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:32px 28px; background:var(--bg);}
.login-brand{font-size:26px; font-weight:700; text-align:center; margin-bottom:8px;}
.login-sub{font-size:14px; color:var(--text-soft); text-align:center; margin-bottom:36px; font-weight:500;}
.login-field{margin-bottom:16px;}
.login-error{color:var(--c-coral); font-size:13px; font-weight:600; text-align:center; margin-top:4px; margin-bottom:8px;}
.sync-banner{margin:0 24px 4px; padding:12px 16px; border-radius:16px; background:var(--surface); font-size:12.5px; color:var(--text-soft); font-weight:500; text-align:center;}

/* ============ TRAVEL ESTIMATE ============ */
.travel-card{background:var(--surface); border-radius:20px; padding:18px; margin-top:12px;}
.travel-placeholder{margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
.tp-row{display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600;}
.tp-note{font-size:11px; color:var(--text-soft); font-weight:500; font-style:italic; margin-top:2px;}
.travel-row{display:flex; gap:10px; margin-bottom:10px;}
.travel-row .form-input{flex:1; margin-bottom:0;}
.travel-result{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
.travel-stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.travel-stat{background:var(--bg); border-radius:14px; padding:10px 14px; flex:1; min-width:90px;}
.travel-stat .ts-label{font-size:10.5px; color:var(--text-soft); font-weight:600; margin-bottom:3px;}
.travel-stat .ts-value{font-size:15px; font-weight:700;}
.travel-note{font-size:12.5px; color:var(--text-soft); font-weight:500; line-height:1.5;}
.travel-caveat{font-size:11px; color:var(--text-soft); font-weight:500; margin-top:10px; font-style:italic;}
.travel-error{font-size:12.5px; color:var(--c-coral); font-weight:600; margin-top:10px;}
.maps-link{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--text); text-decoration:none; margin-top:12px;}

.plan-progress{margin-top:12px;}
.plan-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:6px;}
.plan-progress-head strong{color:var(--text);font-weight:800;}
.plan-progress-track{height:7px;border-radius:999px;background:rgba(20,20,20,.09);overflow:hidden;}
.plan-progress-fill{height:100%;border-radius:999px;background:var(--c-teal);transition:width .25s ease;}
.plan-progress-fill.complete{background:var(--c-amber);}
.plan-progress-note{font-size:10.5px;color:var(--text-soft);font-weight:600;margin-top:5px;}
@media (prefers-color-scheme:dark){.plan-progress-track{background:rgba(255,255,255,.1);}}
.swipe-card-wrap{position:relative;overflow:hidden;border-radius:var(--radius-card);margin:0;}
.swipe-card-wrap .feed-card{position:relative;z-index:2;touch-action:pan-y;will-change:transform;}
.swipe-no-action{position:absolute;inset:0;z-index:1;background:#D84A3A;display:flex;align-items:center;gap:7px;padding:0 22px;color:#fff;font-weight:800;font-size:11px;opacity:.95;}
.swipe-no-action.right{justify-content:flex-start;}
.swipe-no-action.left{justify-content:flex-end;}
.swipe-no-icon{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:27px;line-height:1;}
.swipe-no-label{font-size:10px;letter-spacing:.08em;}
/* ============ UPDATED INTERACTION STYLES ============ */
.works-card{height:164px;min-height:164px; border:none; outline:none;}
.works-card .p-title{max-width:145px;}
.directions-card{background:var(--surface);border-radius:18px;padding:14px 15px;margin:4px 0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.directions-card .dir-copy{display:flex;align-items:center;gap:10px;min-width:0;}
.directions-card .dir-icon{width:34px;height:34px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;}
.directions-card .dir-label{font-size:11px;color:var(--text-soft);font-weight:600;margin-bottom:2px;}
.directions-card .dir-location{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.directions-card .dir-btn{flex:none;text-decoration:none;background:var(--chrome);color:var(--chrome-text);border-radius:13px;padding:9px 12px;font-size:11.5px;font-weight:700;}
.directions-card .dir-btn:active{opacity:.8;}
.mini-calendar-wrap{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;}
.mini-calendar-modal{width:min(100%,420px);background:var(--bg);border-radius:28px;box-shadow:0 18px 60px rgba(0,0,0,.28);overflow:hidden;}
.mini-calendar-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 12px;}
.mini-calendar-head h3{font-size:16px;font-weight:700;}
.mini-calendar-body{padding:0 18px 18px;}
.mini-cal-hero{background:var(--surface);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;margin-bottom:12px;}
.mini-cal-hero .mc-icon{width:42px;height:42px;border-radius:14px;background:var(--c-amber);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.mini-cal-line{font-size:12px;color:var(--text-soft);font-weight:600;}
.mini-cal-date{font-size:15px;font-weight:700;margin-top:3px;}
.mini-cal-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.mini-cal-item{background:var(--surface);border-radius:15px;padding:11px 12px;display:flex;align-items:center;gap:10px;}
.mini-cal-item .mci-dot{width:10px;height:10px;border-radius:50%;flex:none;}
.mini-cal-item .mci-title{font-size:12.5px;font-weight:700;flex:1;min-width:0;}
.mini-cal-item .mci-when{font-size:10.5px;color:var(--text-soft);font-weight:600;}
.notif-category-label{display:none;}
.notif-row{border-left:4px solid transparent;border-radius:0 16px 16px 0;margin:2px 0;padding-left:20px;transition:background .15s ease,border-color .15s ease;}
.notif-row .notif-emoji{width:40px;height:40px;background:var(--bg);}
.notif-row.notif-poked{border-left-color:var(--c-amber);background:rgba(243,185,77,0.12);}
.notif-row.notif-slipping{border-left-color:var(--c-coral);background:rgba(242,116,94,0.10);}
.notif-row.notif-calendar-reminder{border-left-color:var(--c-sky);background:rgba(140,193,234,0.10);}
.notif-row.notif-slipping.urgent{box-shadow:inset 0 0 0 1px rgba(225,87,62,0.22);}
.notif-row.unread{filter:saturate(1.04);}
.notif-row.unread .notif-emoji{box-shadow:0 0 0 2px var(--surface),0 0 0 4px currentColor;}
.notif-row.notif-poked .notif-emoji{background:rgba(243,185,77,0.28);}
.notif-row.notif-slipping .notif-emoji{background:rgba(242,116,94,0.22);}
.notif-row.notif-calendar-reminder .notif-emoji{background:rgba(140,193,234,0.22);}
.notif-row .notif-badge{display:inline-flex;margin-top:6px;font-size:10px;font-weight:700;padding:4px 8px;border-radius:10px;background:var(--bg);color:var(--text-soft);}
.notif-row .notif-flag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:10px;font-weight:800;padding:4px 8px;border-radius:10px;background:rgba(225,87,62,0.15);color:var(--c-coral);}
.notif-swipe-wrap{position:relative;overflow:hidden;margin:2px 0;border-radius:0 16px 16px 0;touch-action:pan-y;}
.notif-hide-action{position:absolute;inset:0;background:var(--c-coral);color:var(--accent-ink);display:flex;align-items:center;font-size:11px;font-weight:800;letter-spacing:.04em;padding:0 20px;z-index:0;}
.notif-hide-action.left{justify-content:flex-start;}
.notif-hide-action.right{justify-content:flex-end;}
.notif-swipeable{position:relative;z-index:1;will-change:transform;transition:transform .18s ease;}
.notif-swipeable.dragging{transition:none;}
.calendar-add-hint{font-size:10.5px;color:var(--text-soft);font-weight:600;text-align:right;margin-top:2px;}

function getAudioCtx(){

    if(!AudioCtxClass) return null;
    if(!sharedAudioCtx) sharedAudioCtx = new AudioCtxClass();

function playChime(freqs, durations, volume){
  if(!isSoundOn()) return;
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    let t = ctx.currentTime;
    freqs.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + durations[i]);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + durations[i]);
      t += durations[i]*0.82;
    });
  }catch(e){}
}

// Heuristic caption parser — since a static site can't fetch anything from
// Instagram directly (no CORS access, no API without a backend), this works
// on caption text the user pastes in themselves. It's pattern-matching, not
// real language understanding: it catches obvious signals (a 📍 line, a few
// vibe keywords) and leaves everything else for the person to fill in.
function parseReelCaption(text){
  const result = {title:null, location:null, category:null};
  if(!text || !text.trim()) return result;
  const lines = text.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(lines.length) result.title = lines[0].replace(/^[✨🔥🎉📍@#\s]+/, "").slice(0,60) || null;

  const locLine = lines.find(l => /📍/.test(l) || /^(at|@)\s+/i.test(l));
  if(locLine) result.location = locLine.replace(/📍/g,"").replace(/^(at|@)\s+/i,"").trim().slice(0,60);

  const lower = text.toLowerCase();
  const vibeMap = [
    ["music", ["concert","gig","live music","dj set","festival","band"]],
    ["food", ["brunch","dinner","tacos","food","restaurant","cafe","pop-up","menu"]],
    ["outdoors", ["hike","trail","beach","camping","sunrise","outdoor"]],
    ["night", ["club","party","bar crawl","nightlife","rooftop bar","karaoke"]],
    ["chill", ["movie night","board game","cozy","chill","hangout"]],
  ];
  for(const [cat, words] of vibeMap){
    if(words.some(w=>lower.includes(w))){ result.category = cat; break; }
  }
  return result;
}
// Since a static site can't pull an image from Instagram either (same CORS/
// API wall as the caption), a cover photo has to be uploaded by hand — e.g.
// a screenshot of the Reel. This resizes + compresses it client-side before
// it goes anywhere near the shared database, since everything still lives
// in one shared document with real size limits.
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("bad image"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

function planMembers(db, plan){
  const g = db.groups[plan.groupId];
  let ids = g ? [...g.memberIds] : [];
  (plan.extraGroupIds||[]).forEach(gid=>{ if(db.groups[gid]) ids.push(...db.groups[gid].memberIds); });
  ids.push(...(plan.extraMemberIds||[]));
  const excluded = new Set(plan.excludedMemberIds||[]);
  return Array.from(new Set(ids)).filter(id=>!excluded.has(id));
}
function responseCounts(db, plan){
  const members = planMembers(db, plan);
  let yes=0, yesBut=0, no=0, pending=0, backedOut=0;
  members.forEach(id=>{
    const r = plan.responses[id];
    if(!r) pending++;
    else if(r.type==="yes") yes++;
    else if(r.type==="yes_but") yesBut++;
    else if(r.type==="no") no++;
    else if(r.type==="backed_out") backedOut++;
  });
  return {yes, yesBut, no, pending, backedOut, total: members.length, in: yes+yesBut};
}
function isSameDay(ts, ref){
  const a = new Date(ts), b = new Date(ref===undefined?now():ref);
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtWhen(ts){
  const d = new Date(ts);
  const diffDays = Math.round((ts - new Date().setHours(0,0,0,0)) / DAY);
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", hour12:true});
  const weekday = d.toLocaleDateString([], {weekday:"short"});
  const monthDay = d.toLocaleDateString([], {month:"short", day:"numeric"});
  let dateLabel;
  if(diffDays===0) dateLabel = `Today (${weekday})`;
  else if(diffDays===1) dateLabel = `Tomorrow (${weekday})`;
  else if(diffDays===-1) dateLabel = `Yesterday (${weekday})`;
  else dateLabel = `${weekday}, ${monthDay}`;
  return `${dateLabel} · ${time}`;
}
function fmtDateOnly(ts){ return new Date(ts).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
function fmtTimeOnly(ts){ return new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit", hour12:true}); }
function timeAgo(ts){
  const diff = now() - ts;
  if(diff < 60000) return "just now";
  if(diff < HOUR) return Math.round(diff/60000)+"m ago";
  if(diff < DAY) return Math.round(diff/HOUR)+"h ago";
  return Math.round(diff/DAY)+"d ago";
}
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function isPlanner(plan, userId){ return (plan.plannerIds||[]).includes(userId); }
function plannerTagFor(plan){ return (plan.plannerIds||[]).length>1 ? "co-planner" : "planner"; }

// Put-aside is PERSONAL: my own "no" or "backed out" hides a plan from my
// view without touching the shared plan for everyone else in the group.
function isPutAsideForMe(plan){
  const mine = plan.responses && plan.responses[ME];
  return !!mine && (mine.type==="no" || mine.type==="backed_out");
}
function putAsideReason(plan){
  const mine = plan.responses && plan.responses[ME];
  if(!mine) return null;
  if(mine.type==="no") return "you said no";
  if(mine.type==="backed_out") return "you backed out";
  return null;
}
function putAsideAt(plan){ const mine = plan.responses && plan.responses[ME]; return mine ? mine.ts : plan.createdAt; }
function agreedByMe(plan){
  const mine = plan.responses && plan.responses[ME];
  return !!mine && ["yes","yes_but"].includes(mine.type);
}
function formatCountdown(ms){
  if(ms<=0) return "now";
  const mins = Math.ceil(ms/60000);
  if(mins < 60) return `${mins}m`;
  const hrs = Math.ceil(mins/60);
  if(hrs < 24) return `${hrs}h`;
  return `${Math.ceil(hrs/24)}d`;
}

function FeedCard({db, plan, onOpen, onSwipeNo, muted, variant, weekBadge}){
  const activity = db.activities[plan.activityId];
  const group = db.groups[plan.groupId];
  const counts = responseCounts(db, plan);
  const allMemberIds = planMembers(db, plan);
  const memberIds = allMemberIds.filter(id => plan.responses[id] && ["yes","yes_but"].includes(plan.responses[id].type));
  const dropoutCount = allMemberIds.filter(id => plan.responses[id] && ["no","backed_out"].includes(plan.responses[id].type)).length;
  const isSlipping = plan.state === "at_risk" || (dropoutCount >= 2 && dropoutCount >= Math.ceil(Math.max(3, allMemberIds.length) * 0.4));
  const isNew = !plan.seenByMe;
  const mine = plan.responses[ME];
  const latestPoke = (db.notifications||[])
    .filter(n => n && (n.type === "poked" || n.type === "nudge") && n.planId === plan.id && n.actorId !== ME)
    .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
  const hasPokeAttention = !mine && plan.state!=="happened" && (
    (latestPoke && (!mine || (mine.ts||0) < (latestPoke.createdAt||0))) ||
    (plan.lastPokedAt && !mine)
  );
  const attentionLabel = isSlipping ? "This one is slipping" : isNew ? "NEW" : null;
  const isToday = isSameDay(plan.dateTime);
  const coverImage = plan.coverImage || planPlaceholderImage(activity);
  const coverStyle = {
    backgroundImage: `linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.56)), url("${coverImage}")`,
    backgroundSize: "cover", backgroundPosition: "center", color: "#fff"
  };
  const swipeStartRef = useRef(null);
  const swipeXRef = useRef(0);
  const [swipeX, setSwipeX] = useState(0);
  const [swipeReady, setSwipeReady] = useState(false);

  function onTouchStart(e){
    if(variant==="works" || !onSwipeNo) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    swipeStartRef.current = {x:t.clientX, y:t.clientY, horizontal:false};
    swipeXRef.current = 0;
  }
  function onTouchMove(e){
    if(!swipeStartRef.current) return;
    const t = e.touches && e.touches[0];
    if(!t) return;
    const dx = t.clientX - swipeStartRef.current.x;
    const dy = t.clientY - swipeStartRef.current.y;
    if(!swipeStartRef.current.horizontal){
      if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8){
        swipeStartRef.current = null;
        setSwipeX(0);
        setSwipeReady(false);
        return;
      }
      if(Math.abs(dx) > 8) swipeStartRef.current.horizontal = true;
    }
    if(swipeStartRef.current && swipeStartRef.current.horizontal){
      e.preventDefault();
      const clamped = Math.max(-120, Math.min(120, dx));
      swipeXRef.current = clamped;
      setSwipeX(clamped);
      setSwipeReady(Math.abs(clamped) >= 72);
    }
  }
  function onTouchEnd(){
    if(!swipeStartRef.current) return;
    const didSwipe = Math.abs(swipeXRef.current) >= 72;
    swipeStartRef.current = null;
    if(didSwipe){
      const dir = swipeXRef.current >= 0 ? 1 : -1;
      setSwipeX(dir * 520);
      setSwipeReady(false);
      setTimeout(()=>onSwipeNo(plan.id), 120);
    } else {
      setSwipeX(0);
      setSwipeReady(false);
    }
  }

  if(variant==="works"){
    const dateLabel = isToday ? "Today" : new Date(plan.dateTime).toLocaleDateString([], {weekday:"short", day:"numeric"});
    return (
      <div className={`works-card ${isNew?"new-arrival":""} ${hasPokeAttention?"poked-attention":""}`} style={coverStyle} onClick={()=>onOpen(plan.id)}>
        {attentionLabel && (
          <div className="card-attention-slot">
            <span className={`plan-attention-tag ${isSlipping?"slipping":"new"}`}>{attentionLabel}</span>
          </div>
        )}
        <div style={attentionLabel ? {paddingTop:44} : undefined}>
          {weekBadge && <span className="p-date-badge">{dateLabel}</span>}
          <div className="p-title">{activity.title}</div>
          <div className="p-when">{plan.dateIsProposed ? "Proposed · " : ""}{fmtWhen(plan.dateTime)}</div>
        </div>
        {group && (
          <div className="works-group-tag" aria-label={`Group: ${group.name}`}>
            <span>{group.emoji || "👥"}</span><span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{group.name}</span>
          </div>
        )}
        <div className="plan-progress" aria-label={`${counts.in} of ${plan.minPeople} people agreed`}>
          <div className="plan-progress-head"><span><strong>{counts.in}</strong> / {plan.minPeople} agreed</span><span>{Math.min(100, Math.round((counts.in / Math.max(1, plan.minPeople)) * 100))}%</span></div>
          <div className="plan-progress-track"><div className={`plan-progress-fill ${counts.in >= plan.minPeople ? "complete" : ""}`} style={{width:`${Math.min(100, (counts.in / Math.max(1, plan.minPeople)) * 100)}%`}}/></div>
        </div>
      </div>
    );
  }

  return (
    <div className={`swipe-card-wrap ${hasPokeAttention?"poked-attention":""}`}>
      <div className={`swipe-no-action ${swipeReady?"ready":""} ${swipeX>=0?"right":"left"}`} aria-hidden="true">
        <div className="swipe-no-icon">×</div>
        <div className="swipe-no-label">NO</div>
      </div>
      <div
        className={`feed-card ${muted?"muted":""}`}
        style={{transform:`translateX(${swipeX}px)`, transition:swipeX===0?"transform .18s ease":(Math.abs(swipeX)>=120?"transform .12s ease":"none")}}
        onClick={()=>{ if(Math.abs(swipeX)<8) onOpen(plan.id); }}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onTouchCancel={onTouchEnd}
      >
        <div className="fc-hero" style={coverStyle}>
          {attentionLabel && (
            <div className="card-attention-slot">
              <span className={`plan-attention-tag ${isSlipping?"slipping":"new"}`}>{attentionLabel}</span>
            </div>
          )}
          <span style={{position:"absolute",top:14,right:14,zIndex:4}}>{plan.pinnedToTop && <span className="fc-pin">📌</span>}</span>
          {group && (
            <div className="fc-group-tag" aria-label={`Group: ${group.name}`}>
              <span>{group.emoji || "👥"}</span><span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{group.name}</span>
            </div>
          )}
        </div>
        <div className="fc-body">
          <div className="fc-title">{activity.title}</div>
          <div className="fc-meta">{plan.dateIsProposed ? "Proposed · " : ""}{fmtWhen(plan.dateTime)}</div>
          <div className="plan-progress" aria-label={`${counts.in} of ${plan.minPeople} people agreed`}>
            <div className="plan-progress-head"><span><strong>{counts.in}</strong> / {plan.minPeople} agreed</span><span>{Math.min(100, Math.round((counts.in / Math.max(1, plan.minPeople)) * 100))}%</span></div>
            <div className="plan-progress-track"><div className={`plan-progress-fill ${counts.in >= plan.minPeople ? "complete" : ""}`} style={{width:`${Math.min(100, (counts.in / Math.max(1, plan.minPeople)) * 100)}%`}}/></div>
          </div>
          {(mine || isPutAsideForMe(plan)) && (
            <div className="fc-tags">
              {mine && mine.type==="yes" && <span className="resp-tag yes">✅ You're in</span>}
              {mine && mine.type==="yes_but" && <span className="resp-tag yesbut">🤏 Yes, but</span>}
              {isPutAsideForMe(plan) && <span className="reason-tag">{putAsideReason(plan)}</span>}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

const FILTERS = [
  {id:"tonight", label:"Tonight", test:(a,p)=>p.dateTime - now() < DAY && p.dateTime - now() > -HOUR},
  {id:"music", label:"Music", test:(a)=>a.category==="music"},
  {id:"food", label:"Food", test:(a)=>a.category==="food"},
  {id:"outdoors", label:"Outdoors", test:(a)=>a.category==="outdoors"},
  {id:"night", label:"Nightlife", test:(a)=>a.category==="night"},
  {id:"chill", label:"Chill", test:(a)=>a.category==="chill"},
];
const MAP_POS = {a_rolling:[70,30], a_hike:[20,20], a_taco:[45,55], a_movie:[55,40], a_bonfire:[25,70], a_trivia:[65,62], a_karaoke:[80,50], a_pottery:[35,35], a_market:[50,75]};

function feedSortKey(p){
  if(p.pinnedToTop) return 0;
  if(p.state==="needs_nudge") return 1;
  if(!p.responses[ME]) return 2;
  return 3;
}

function isThisWeek(ts){ const s = startOfWeek(new Date()).getTime(); return ts>=s && ts<s+7*DAY; }

function HomeScreen({db, onOpen, openDayOf, loading}){
  const plans = db ? Object.values(db.plans) : [];
  // Reel demo proposals live exclusively in Shared plans. They are not
  // treated as accepted/"Your plans" content on Home.
  const active = plans.filter(p => p.state!=="happened" && !isPutAsideForMe(p) && !p.demoSharedOnly);
  const pinFirst = (a,b,rest=()=>0) => ((b.pinnedToTop?1:0) - (a.pinnedToTop?1:0)) || rest(a,b);
  const finalizedThisWeek = active
    .filter(p => p.finalized && isThisWeek(p.dateTime) && agreedByMe(p))
    .sort((a,b)=>pinFirst(a,b,()=>a.dateTime-b.dateTime));
  const inPlans = active
    .filter(p => agreedByMe(p) && !finalizedThisWeek.some(x=>x.id===p.id))
    .sort((a,b)=>pinFirst(a,b,()=>{
      const peopleDiff = responseCounts(db,b).in - responseCounts(db,a).in;
      return peopleDiff || a.dateTime-b.dateTime;
    }));

  if(loading || !db){
    return (
      <div className="section">
        <div className="skeleton" style={{height:164, marginBottom:20}}/>
        <div className="skeleton" style={{height:164, marginBottom:20}}/>
      </div>
    );
  }

  function cardOpen(id){
    const p = db.plans[id];
    if(p && p.finalized && isSameDay(p.dateTime)) openDayOf(id); else onOpen(id);
  }

  return (
    <div style={{paddingBottom:18}}>
      {finalizedThisWeek.length>0 && (
        <>
          <div className="section" style={{paddingBottom:0}}>
            <h2 className="section-title">Finalised this week</h2>
            <p className="section-sub">the ones that are actually happening</p>
          </div>
          <div className="works-row">
            {finalizedThisWeek.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen} variant="works" weekBadge/>)}
          </div>
        </>
      )}

      {inPlans.length>0 && (
        <>
          <div className="section" style={{paddingBottom:0}}>
            <h2 className="section-title">{finalizedThisWeek.length>0 ? "You're in" : "Your plans"}</h2>
            <p className="section-sub">biggest crews first</p>
          </div>
          <div className="works-row">
            {inPlans.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen} variant="works" />)}
          </div>
        </>
      )}

      {finalizedThisWeek.length===0 && inPlans.length===0 && (
        <div className="empty-state">
          <div className="em-emoji">🫶</div>
          <h3>Nothing booked yet</h3>
          <p>Head to Shared plans and find something that sounds like you.</p>
        </div>
      )}
    </div>
  );
}

function AllPlansScreen({db, onOpen, openDayOf, dispatch}){
  const [detailFilters, setDetailFilters] = useState([]);
  const [browseView, setBrowseView] = useState("list");
  const [showFilterPopup, setShowFilterPopup] = useState(false);

  const active = Object.values(db.plans).filter(p => p.state!=="happened" && !isPutAsideForMe(p));
  const discoverPlans = active.filter(p => !agreedByMe(p));

  function toggleDetailFilter(id){
    setDetailFilters(a=> a.includes(id) ? a.filter(x=>x!==id) : [...a,id]);
  }

  const browsePlans = discoverPlans.filter(p=>{
    const a = db.activities[p.activityId];
    if(detailFilters.length>0){
      return detailFilters.every(fid => {
        const filter = FILTERS.find(f=>f.id===fid);
        return filter ? filter.test(a,p) : true;
      });
    }
    return true;
  });

  const grouped = {};
  browsePlans.forEach(p=>{
    const key = p.groupId || "other";
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(p);
  });
  const groupOrder = Object.keys(grouped).sort((a,b)=>{
    const ga = db.groups[a], gb = db.groups[b];
    return (ga?.name || "Other").localeCompare(gb?.name || "Other");
  });

  function cardOpen(id){
    const p = db.plans[id];
    if(p && p.finalized && isSameDay(p.dateTime)) openDayOf(id); else onOpen(id);
  }

  function swipeNo(id){
    dispatch({type:"RESPOND", planId:id, userId:ME, response:{type:"no", ts:now()}});
    dispatch({
      type:"TOAST",
      message:"Said no to this one",
      onUndo:()=>dispatch({type:"RESTORE", planId:id})
    });
  }

  return (
    <div style={{paddingBottom:12}}>
      <div className="section">
        <h2 className="section-title">Shared plans</h2>
        <p className="section-sub">plans your crew hasn't said yes to yet</p>

      <div className="chip-row-with-filter" style={{justifyContent:"flex-end"}}>
        <button className={`filter-icon-btn ${detailFilters.length>0?"active":""}`} onClick={()=>setShowFilterPopup(true)} aria-label="More filters">
          <IconFilter/>{detailFilters.length>0 && <span className="filter-count">{detailFilters.length}</span>}
        </button>
      </div>

      <div className="map-toggle" style={{marginTop:16}}>
        <button className={browseView==="list"?"on":""} onClick={()=>setBrowseView("list")}>List</button>
        <button className={browseView==="map"?"on":""} data-tour="map-button" onClick={()=>setBrowseView("map")}>Map</button>
      </div>

      {browseView==="list" ? (
        <div style={{marginTop:8}}>
          {browsePlans.length===0 && (
            <div className="empty-state">
              <div className="em-emoji">🎉</div>
              <h3>You're caught up</h3>
              <p>No unanswered plans right now. Someone has to make the next move.</p>
            </div>
          )}
          {groupOrder.map(gid=>{
            const group = db.groups[gid];
            const groupPlans = grouped[gid].sort((a,b)=>((b.pinnedToTop?1:0) - (a.pinnedToTop?1:0)) || (a.dateTime-b.dateTime));
            return (
              <div key={gid} style={{marginBottom:10}}>
                <div className="pool-label" style={{paddingTop:18}}>
                  {group ? `${group.emoji} ${group.name}` : "👥 Other"}
                </div>
                <div className="plan-list">
                  {groupPlans.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen} onSwipeNo={swipeNo}/>)}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div className="map-visual">
          {browsePlans.map(p=>{
            const group = db.groups[p.groupId];
            const gcolor = group ? group.color : GROUP_PALETTE[0];
            const pos = MAP_POS[p.activityId] || [50,50];
            return (
              <div className="map-pin" key={p.id} style={{left:pos[0]+"%", top:pos[1]+"%"}} onClick={()=>cardOpen(p.id)}>
                <div className="pin-dot" style={{background:gcolor}}><span>{group?group.name[0]:"?"}</span></div>
                <div className="pin-label">{db.activities[p.activityId].title}</div>
              </div>
            );
          })}
          {browsePlans.length===0 && <div className="empty-state" style={{padding:"80px 20px"}}><div className="em-emoji">🗺️</div><h3>Nothing new</h3><p>You're all caught up.</p></div>}
        </div>
      )}

      {showFilterPopup && (
        <>
          <div className="scrim" onClick={()=>setShowFilterPopup(false)}/>
          <div className="sheet" role="dialog" aria-modal="true">
            <div className="sheet-handle"/>
            <button className="sheet-close" onClick={()=>setShowFilterPopup(false)} style={{background:"rgba(20,20,20,0.5)"}}><IconClose/></button>
            <div className="sheet-scroll" style={{padding:"22px 24px 34px"}}>
              <h2 style={{fontSize:19, fontWeight:700, marginBottom:18}}>Filter shared plans</h2>
              <div className="form-field"><label className="form-label">Type</label>
                <div className="pill-select">
                  {FILTERS.filter(f=>f.id!=="tonight").map(f=>(
                    <div key={f.id} className={`ps-opt ${detailFilters.includes(f.id)?"on":""}`} onClick={()=>toggleDetailFilter(f.id)}>{f.label}</div>

              </div>

                  <div className={`ps-opt ${detailFilters.includes("tonight")?"on":""}`} onClick={()=>toggleDetailFilter("tonight")}>Tonight</div>

          </div>
        </>
      )}
    </div>

}

function ResponseSection({db, plan, dispatch, planId}){
  const mine = plan.responses[ME];
  const [editing, setEditing] = useState(!mine);
  const [draftType, setDraftType] = useState(mine && mine.type!=="backed_out" ? mine.type : null);
  const [draftNote, setDraftNote] = useState(mine && mine.type==="yes_but" ? (mine.note||"") : "");
  const [draftNoReason, setDraftNoReason] = useState(mine && mine.type==="no" ? (mine.note||"") : "");
  const [calendarOpen, setCalendarOpen] = useState(false);

  if(plan.state==="happened") return null;

  function commit(type, note){
    dispatch({type:"RESPOND", planId, userId:ME, response:{type, note:note||"", ts:now()}});
    setEditing(false);
  }
  function startEdit(){
    setDraftType(mine && mine.type!=="backed_out" ? mine.type : null);
    setDraftNote(mine && mine.type==="yes_but" ? (mine.note||"") : "");
    setDraftNoReason(mine && mine.type==="no" ? (mine.note||"") : "");
    setEditing(true);
  }
  function backOut(){
    dispatch({type:"RESPOND", planId, userId:ME, response:{type:"backed_out", ts:now()}});
    dispatch({type:"TOAST", message:"Okay, we’ll keep your spot open. You can jump back in anytime.", onUndo:()=>dispatch({type:"RESPOND", planId, userId:ME, response:{type:"yes", ts:now()}})});
    setEditing(false);
  }

  if(!editing && mine){
    return (
      <>
        <div className="resp-block">
          <div className="resp-summary">
            <div>
              <div className="rs-text">{myResponseLabel(plan)}</div>
              {mine.type==="yes_but" && mine.note && <div className="rs-note">"{mine.note}"</div>}
              {mine.type==="no" && mine.note && <div className="rs-note">"{mine.note}"</div>}
              {mine.type==="backed_out" && (<div className="rs-sub"><button className="rs-link" onClick={()=>commit("yes","")}>Actually, I'm back in</button></div>)}
              {mine.type==="yes" && (
                <div className="rs-sub">
                  <button className="small-btn" style={{marginTop:8}} onClick={()=>setCalendarOpen(true)}>📅 View calendar</button>
                </div>
              )}
            </div>
            <button className="pencil-btn" data-tour="edit-response" onClick={startEdit} aria-label="Edit your response"><IconPencil/></button>
          </div>
        </div>
        {calendarOpen && <CalendarMiniPopup db={db} plan={plan} onClose={()=>setCalendarOpen(false)}/>}
      </>
    );
  }

  return (
    <div className="resp-block">
      <div className="resp-current"><span className="rc-label">{mine ? "Change your response" : <Q text="What do you think?"/>}</span></div>
      <div className="resp-buttons" data-tour="response-buttons">
        <button className={`resp-btn yes ${draftType==="yes"?"selected yes":""}`} onClick={()=>{ setDraftType("yes"); commit("yes",""); }}>
          <span className="rb-emoji">✅</span><Excl text="I'm in!"/>
        </button>
        <button className={`resp-btn yesbut ${draftType==="yes_but"?"selected yesbut":""}`} onClick={()=>setDraftType("yes_but")}>
          <span className="rb-emoji">🤏</span>Yes but…
        </button>
        <button className={`resp-btn no ${draftType==="no"?"selected no":""}`} onClick={()=>{ setDraftType("no"); }}>
          <span className="rb-emoji">😔</span>No
        </button>
      </div>
      {draftType==="no" && (
        <div className="no-reason-field">
          <textarea placeholder="Optional: want to tell the group why?" value={draftNoReason} onChange={e=>setDraftNoReason(e.target.value)} />
          <div className="no-reason-hint">You can just say no, or leave a quick reason so the group knows what happened.</div>
          <div className="no-reason-actions">
            <button className="primary-btn danger" onClick={()=>commit("no", draftNoReason.trim())}>Say no{draftNoReason.trim() ? " & send reason" : ""}</button>
            <button className="small-btn" onClick={()=>commit("no", "")}>Skip</button>
          </div>
        </div>
      )}
      {draftType==="yes_but" && (
        <div className="yesbut-field" data-tour="yesbut-field">
          <textarea placeholder="What's the tiny catch? “I'm in if we go after 7”" value={draftNote} onChange={e=>setDraftNote(e.target.value)} />
          <div className="yesbut-hint">{draftNote.trim() ? "Your crew will see the condition" : "Add a tiny note so nobody has to guess"}</div>
          <button className="primary-btn" style={{marginTop:10}} disabled={!draftNote.trim()} onClick={()=>commit("yes_but", draftNote.trim())}>Send response</button>
        </div>
      )}
      {mine && mine.type==="yes" && draftType!=="yes_but" && (<button className="backout-link" onClick={backOut}>I wanna back out</button>)}
      {mine && (<button className="rs-link" style={{marginTop:14, display:"block", marginLeft:"auto", marginRight:"auto"}} onClick={()=>setEditing(false)}>Cancel</button>)}
    </div>
  );
}

function fallbackCopy(activity){
  const smaller = {
    music:"Same crew, a laid-back gig night instead — lower cost, same energy.",
    food:"Same spot, just the ones still in — no need for a big table.",
    outdoors:"A shorter walk nearby instead of the full hike.",
    night:"Move it closer, keep it small — same vibe, less planning.",
    chill:"Push it to just the couch crew, same night.",
    water:"Smaller fire, closer spot, whoever's still down.",
    custom:"A smaller, closer version of the same plan.",
  };
  return smaller[activity.category] || smaller.custom;
}
const GENERATE_POOL = [
  "What if we just push it 2 hours later and see who's still around?",
  "Move it to whoever's place is closest and keep the guest list tight.",
  "Swap it for something 15 minutes away — same energy, way less friction.",
  "Cut it down to a smaller group dinner instead, same night.",
];
function FallbackCard({plan, activity, dispatch}){
  const [text, setText] = useState(fallbackCopy(activity));
  if(plan.fallbackSent){
    return (<div className="fallback-card"><div className="fb-eyebrow">Sent to the group</div><h4>Smaller plan proposed</h4><p style={{fontSize:13, fontWeight:500, opacity:.85}}>{plan.fallbackText || fallbackCopy(activity)}</p></div>);
  }
  return (
    <div className="fallback-card">
      <div className="fb-eyebrow">A few people can't make it</div>
      <h4>Want to try a smaller version?</h4>
      <button className="generate-btn" onClick={()=>setText(GENERATE_POOL[Math.floor(Math.random()*GENERATE_POOL.length)])}>
        <IconSparkle/> Suggest one for me
      </button>
      <textarea value={text} onChange={e=>setText(e.target.value)} />
      <div className="fb-actions">
        <button className="fb-yes" onClick={()=>{ dispatch({type:"SEND_FALLBACK", planId:plan.id, text}); dispatch({type:"TOAST", message:"Suggestion sent to the group"}); }}>Suggest it</button>
        <button className="fb-no" onClick={()=>dispatch({type:"DISMISS_FALLBACK", planId:plan.id})}>Not now</button>
      </div>
    </div>
  );
}
