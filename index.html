  const [coverImage, setCoverImage] = useState(plan.coverImage || null);
  const [coverBusy, setCoverBusy] = useState(false);

  async function handleCoverFile(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    setCoverBusy(true);
    try{ setCoverImage(await compressImageFile(file, 480, 0.55)); }
    catch(err){ dispatch({type:"TOAST", message:"Couldn't read that image — try a different one"}); }
    setCoverBusy(false);
    e.target.value = "";
  }

  function save(){
    dispatch({type:"UPDATE_PLAN_DETAILS", planId:plan.id, title, location, minPeople, budget, priority, note, travelPlan, coverImage});
    dispatch({type:"TOAST", message:"Updated — the group's been notified"});
    onDone();
  }
  return (
    <div className="planner-box">
      <div className="form-field"><label className="form-label">Title</label><input className="form-input" value={title} onChange={e=>setTitle(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">Location</label><input className="form-input" value={location} onChange={e=>setLocation(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">Minimum people</label>
        <div className="pill-select">
          {[2,3,4,5,6].map(n=>(<div key={n} className={`ps-opt ${minPeople===n && !customMinOpen?"on":""}`} onClick={()=>{ setMinPeople(n); setCustomMinOpen(false); }}>{n}+</div>))}
          {!customMinOpen ? (
            <div className={`ps-opt ${![2,3,4,5,6].includes(minPeople)?"on":""}`} onClick={()=>setCustomMinOpen(true)}>{![2,3,4,5,6].includes(minPeople) ? `${minPeople}+ (custom)` : "+ custom"}</div>
          ) : (
            <input className="form-input" type="number" min="1" style={{maxWidth:90}} autoFocus value={minPeople}
              onChange={e=>setMinPeople(Math.max(1, parseInt(e.target.value)||1))} onBlur={()=>setCustomMinOpen(false)}/>
          )}
        </div>
      </div>
      
      <div className="form-field">
        <label className="form-label">Budget per person (optional)</label>
        <input className="form-input" type="number" min="0" step="50" inputMode="numeric" placeholder="e.g. 1000" value={budget} onChange={e=>setBudget(e.target.value)}/>
      </div>
      <div className="form-field"><label className="form-label">Hype line</label><textarea className="form-textarea" value={note} onChange={e=>setNote(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">How's the group getting there? (optional)</label>
        <textarea className="form-textarea" placeholder="e.g. carpooling from Bandra, meet at the station…" value={travelPlan} onChange={e=>setTravelPlan(e.target.value)}/>
      </div>
      <div className="form-field">
        <label className="form-label">Cover photo (optional)</label>
        {coverImage ? (
          <div style={{position:"relative"}}>
            <img src={coverImage} alt="" style={{width:"100%", borderRadius:16, display:"block"}}/>
            <button className="small-btn" style={{position:"absolute", top:10, right:10}} onClick={()=>setCoverImage(null)}>Remove</button>
          </div>
        ) : (
          <label className="hype-note-btn" style={{display:"block", textAlign:"center", cursor:"pointer", margin:0}}>
            {coverBusy ? "Processing…" : "📷 Upload a cover photo"}
            <input type="file" accept="image/*" className="visually-hidden" onChange={handleCoverFile}/>
          </label>
        )}
      </div>
      <TravelEstimate activity={{...activity, location}} plan={plan}/>
      <button className="primary-btn accent" style={{marginTop:14}} onClick={save}>Save changes</button>
      <button className="primary-btn ghost" onClick={onDone}>Cancel</button>
    </div>
  );
}

/* ======================================================================
   PLANNER BOX (suggestions gated to negotiation phase + coplanner requests)
====================================================================== */
function suggestionEntries(plan){
  const notes = plan.suggestionNotes || {};
  if(Array.isArray(notes)){
    return notes.filter(s=>s && s.text).map((s,i)=>({
      id:s.id || `${s.userId || "u"}_${s.ts || i}`,
      userId:s.userId, text:s.text, ts:s.ts || now()
    }));
  }
  const out=[];
  Object.entries(notes).forEach(([uid, value])=>{
    if(Array.isArray(value)){
      value.forEach((s,i)=>{ if(s && s.text) out.push({id:s.id || `${uid}_${s.ts || i}`, userId:uid, text:s.text, ts:s.ts || now()}); });
    } else if(value && value.text){
      out.push({id:`${uid}_${value.ts || 0}`, userId:uid, text:value.text, ts:value.ts || now()});
    }
  });
  return out.sort((a,b)=>(a.ts||0)-(b.ts||0));
}

function PlannerBox({db, plan, dispatch}){
  const [myNote, setMyNote] = useState("");
  const iPlan = isPlanner(plan, ME);
  const canParticipate = plan.state!=="happened" && planMembers(db, plan).includes(ME);
  const suggestions = suggestionEntries(plan);
  const requests = (plan.coplannerRequests||[]).filter(id=>!isPlanner(plan,id));

  // Every active plan shows the suggestions area. Participants and planners can
  // add notes; everyone else can still read the notes without writing to the plan.
  if(plan.state==="happened") return null;

  function send(){
    const text = myNote.trim();
    if(!text) return;
    dispatch({type:"SUGGEST_NOTE", planId:plan.id, userId:ME, text});
    dispatch({type:"TOAST", message:"Suggestion shared with everyone in the plan"});
    setMyNote("");
  }

  return (
    <>
      <div className="planner-box">
        <div className="pb-title">💬 Suggestions &amp; notes</div>
        {suggestions.map((s)=>{
          const u = db.users[s.userId];
          if(!u) return null;
          const isMine = s.userId===ME;
          return (
            <div className="suggestion-row" key={s.id}>
              <Avatar user={u} size={26}/>
              <div style={{flex:1}}><div className="suggestion-text">{s.text}</div><div className="suggestion-author">{isMine?"You":u.name} · {timeAgo(s.ts)}</div></div>
            </div>
          );
        })}
        {suggestions.length===0 && <p style={{fontSize:12.5, color:"var(--text-soft)", fontWeight:500, marginBottom:10}}>No suggestions yet — be the first to add one.</p>}

        <div className="form-field" style={{marginTop:suggestions.length?12:0, marginBottom:0}}>
          <label className="form-label">Add a suggestion or note</label>
          {canParticipate || iPlan ? (
            <>
              <textarea className="form-textarea" placeholder="e.g. can we push it 30 min later?" value={myNote} onChange={e=>setMyNote(e.target.value)}/>
              <button className="primary-btn ghost" style={{marginTop:10}} onClick={send} disabled={!myNote.trim()}>Send suggestion</button>
            </>
          ) : (
            <div style={{fontSize:12.5, color:"var(--text-soft)", fontWeight:500, padding:"10px 0 2px"}}>You can read the crew's suggestions here, but you're not part of this plan.</div>
          )}
        </div>
      </div>

      {iPlan && requests.length>0 && (
        <div className="planner-box">
          <div className="pb-title">🙋 Wants to help plan</div>
          {requests.map(uid=>(
            <div className="request-row" key={uid}>
              <Avatar user={db.users[uid]} size={26}/>
              <span style={{flex:1, fontSize:13, fontWeight:600}}>{db.users[uid].name}</span>
              <button className="small-btn accent" onClick={()=>{ dispatch({type:"ADD_PLANNER", planId:plan.id, userId:uid}); dispatch({type:"TOAST", message:`${db.users[uid].name} is now a co-planner`}); }}>Approve</button>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

/* ======================================================================
   PERSON CHIP (click for ask/make co-planner)
====================================================================== */
function PersonRow({db, plan, userId, dispatch}){
  const u = db.users[userId];
  const [open, setOpen] = useState(false);
  if(!u) return null;
  const r = plan.responses[userId];
  let tag = "hasn't answered";
  if(r){
    if(r.type==="yes") tag = "yes"; else if(r.type==="yes_but") tag = "yes, but";
    else if(r.type==="no") tag = "no"; else if(r.type==="backed_out") tag = "backed out";
  }
  const amPlanner = isPlanner(plan, ME);
  const theyArePlanner = isPlanner(plan, userId);
  const alreadyRequested = (plan.coplannerRequests||[]).includes(ME);

  return (
    <div className="person-chip-wrap">
      <button className="person-chip" onClick={()=>setOpen(o=>!o)}>
        <span className="sm-av" style={{background:u.color, color:"var(--accent-ink)"}}>{initials(u.name)}</span>
        <span>
          {userId===ME?"You":u.name}
          {r && r.type==="yes_but" && r.note ? (
            <span className="pc-note">Yes, but — "{r.note}"</span>
          ) : r && r.type==="no" && r.note ? (
            <span className="pc-note">No — "{r.note}"</span>
          ) : (
            <> · {tag}</>
          )}
          {r && r.type==="yes_but" && !r.note && <> · {tag}</>}
          {theyArePlanner && <span className="role-tag">{plannerTagFor(plan)}</span>}
        </span>
      </button>
      {open && (
        <div className="person-actions">
          {userId===ME && !theyArePlanner && (
            alreadyRequested
              ? <span style={{fontSize:12, color:"var(--text-soft)", fontWeight:600}}>Request sent — waiting on the planner</span>
              : <button className="small-btn accent" onClick={()=>{ dispatch({type:"ASK_COPLANNER", planId:plan.id, userId:ME}); dispatch({type:"TOAST", message:"Asked to help plan this one"}); }}>Ask to be co-planner</button>
          )}
          {userId!==ME && amPlanner && !theyArePlanner && (
            <>
              <button className="small-btn accent" onClick={()=>{ dispatch({type:"ADD_PLANNER", planId:plan.id, userId}); dispatch({type:"TOAST", message:`${u.name} is now a co-planner`}); }}>Make {u.name} a planner</button>
              <button className="small-btn danger" onClick={()=>{ dispatch({type:"KICK_FROM_PLAN", planId:plan.id, userId}); dispatch({type:"TOAST", message:`${u.name} was removed from this plan`}); }}>Remove from plan</button>
            </>
          )}
          {(userId===ME && theyArePlanner) || (userId!==ME && (theyArePlanner || !amPlanner)) ? (
            <span style={{fontSize:12, color:"var(--text-soft)", fontWeight:500}}>{theyArePlanner ? `Already a ${plannerTagFor(plan)}` : "Nothing to do here"}</span>
          ) : null}
        </div>
      )}
    </div>
  );
}

function TravelEstimate({activity, plan}){

  function saveOrigin(v){ setOrigin(v); safeSet("planit.lastOrigin", v); }
  const mapsHref = "https://www.google.com/maps/dir/?api=1"
    + (origin.trim() ? "&origin=" + encodeURIComponent(origin.trim()) : "")
    + "&destination=" + encodeURIComponent(activity.location);

  return (
    <div className="travel-card">
      <div className="pb-title" style={{marginBottom:12}}>🧭 Getting there</div>
      <div className="travel-row">

function PlanDetail({db, planId, onClose, dispatch, openDayOf}){
  const plan = db.plans[planId];
  const activity = db.activities[plan.activityId];
  const group = db.groups[plan.groupId];
  const counts = responseCounts(db, plan);
  const color = catColor(activity.category);
  const [editingDetails, setEditingDetails] = useState(false);
  const [meetTimeOpen, setMeetTimeOpen] = useState(false);
  const [meetTime, setMeetTime] = useState("");
  const [dragY, setDragY] = useState(0);
  const amPlanner = isPlanner(plan, ME);
  const scrollRef = useRef(null);
  const dragRef = useRef({startY:0, dragging:false});
  const dragDistRef = useRef(0);
  const pokeRemaining = plan.lastPokedAt ? Math.max(0, POKE_COOLDOWN - (now()-plan.lastPokedAt)) : 0;
  const canPoke = amPlanner && plan.state!=="happened" && pokeRemaining<=0;

  useEffect(()=>{ if(!plan.seenByMe) dispatch({type:"MARK_SEEN", planId}); }, []);

  const canShowFallback = plan.state==="at_risk" && !plan.fallbackDismissed;
  const directionsHref = "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(activity.location);

  function onTouchStart(e){
    const scrollEl = scrollRef.current;
    if(!scrollEl || scrollEl.scrollTop > 2) return;
    dragRef.current = {startY: e.touches[0].clientY, dragging:true};
  }
  function onTouchMove(e){
    if(!dragRef.current.dragging) return;
    const dy = e.touches[0].clientY - dragRef.current.startY;
    if(dy > 0){
      e.preventDefault();
      dragDistRef.current = dy;
      setDragY(dy);
    }
  }
  function onTouchEnd(){
    if(!dragRef.current.dragging) return;
    dragRef.current.dragging = false;
    const shouldClose = dragDistRef.current > 90;
    dragDistRef.current = 0;
    if(shouldClose) onClose();
    else setDragY(0);
  }

  return (
    <div className="sheet" role="dialog" aria-modal="true"
      style={dragY ? {transform:`translateX(-50%) translateY(${dragY}px)`, transition:"none"} : {transition:"transform .2s ease"}}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}>
      <div className="sheet-scroll" ref={scrollRef}>
        <div className="plan-hero" style={{backgroundImage:`linear-gradient(rgba(0,0,0,0.18), rgba(0,0,0,0.62)), url("${plan.coverImage || planPlaceholderImage(activity)}")`, backgroundSize:"cover", backgroundPosition:"center", color:"#fff"}}>
          <span className="glyph-big">{catGlyph(activity.category)}</span>
          <button className={`pin-toggle ${plan.pinnedToTop?"on":""}`} onClick={(e)=>{e.stopPropagation(); dispatch({type:"TOGGLE_PIN", planId}); dispatch({type:"TOAST", message:plan.pinnedToTop?"Unpinned this plan":"Pinned to the top"});}} aria-label={plan.pinnedToTop?"Unpin plan":"Pin plan to top"}><IconPin filled={plan.pinnedToTop}/></button>
          <button className="sheet-close" onClick={onClose} aria-label="Close"><IconClose/></button>
          <div className="hcat">{group?group.emoji:"👥"} {group?group.name:"Group"}</div>
          <div className="htitle">{activity.title}</div>
        </div>
        <div className="notch-dot"/>

        <div className="plan-body">
          {canShowFallback && <FallbackCard plan={plan} activity={activity} dispatch={dispatch}/>}

          {editingDetails ? (
            <EditDetailsForm plan={plan} activity={activity} dispatch={dispatch} onDone={()=>setEditingDetails(false)}/>
          ) : (
            <>
              <div className="meta-head">
                <span/>
                {amPlanner && plan.state!=="happened" && <button className="pencil-btn" onClick={()=>setEditingDetails(true)} aria-label="Edit details"><IconPencil/></button>}
              </div>

              <div className="meta-list">
                <div className="meta-row"><span className="mi">🕐</span>{plan.dateIsProposed ? <><b>Proposed date</b><span style={{marginLeft:5}}>· {fmtWhen(plan.dateTime)}</span></> : <b>{fmtWhen(plan.dateTime)}</b>}</div>
                <div className="meta-row"><span className="mi"><IconTarget/></span>Need at least <b>{plan.minPeople}</b> people</div>
                {plan.budget !== undefined && plan.budget !== null && plan.budget !== "" && <div className="meta-row"><span className="mi">💰</span>About <b>₹{Number(plan.budget).toLocaleString("en-IN")}</b> per person</div>}
                {plan.groupTravelPlan && <div className="meta-row"><span className="mi">🚗</span>{plan.groupTravelPlan}</div>}
              </div>

              <div className="directions-card">
                <div className="dir-copy">
                  <div className="dir-icon">📍</div>
                  <div style={{minWidth:0}}>
                    <div className="dir-label">Get there</div>
                    <div className="dir-location">{activity.location}</div>
                  </div>
                </div>
                <a className="dir-btn" href={directionsHref} target="_blank" rel="noopener noreferrer">Directions ↗</a>
              </div>

              {plan.sourceLink && <a className="maps-link" href={plan.sourceLink} target="_blank" rel="noopener noreferrer">📎 View source</a>}

              {amPlanner && plan.state!=="happened" && (
                <div style={{marginTop:4, marginBottom:16}}>
                  <button className="poke-mini" data-tour="poke-button" disabled={!canPoke}
                    style={{opacity:canPoke?1:.5,cursor:canPoke?"pointer":"not-allowed"}}
                    onClick={()=>{
                      if(!canPoke) return;
                      dispatch({type:"NUDGE", planId});
                      dispatch({type:"TOAST", message:"Poke sent 👋"});
                    }}>
                    {canPoke ? "👋 Poke" : `👋 Poked · again in ${formatCountdown(pokeRemaining)}`}
                  </button>
                </div>
              )}
            </>
          )}

          {plan.note && !editingDetails && <div className="note-box">"{plan.note}"</div>}

          {plan.state!=="happened" && (
            <>
              <div style={{height:6}}/>
              <div className="people-row"><span className="people-summary">{counts.in} are in · waiting on {counts.pending}</span></div>
              <div className="people-avatars">{planMembers(db, plan).map(id=><PersonRow key={id} db={db} plan={plan} userId={id} dispatch={dispatch}/>)}</div>
            </>
          )}

          <ResponseSection db={db} plan={plan} dispatch={dispatch} planId={planId}/>
          {plan.state!=="happened" && <PlannerBox db={db} plan={plan} dispatch={dispatch}/>}

          {amPlanner && plan.state!=="happened" && (
            <div className="planner-box">
              <div className="pb-title">🧭 Planner tools</div>
              <div className="planner-actions">
                {plan.meetProposedTime && <div style={{fontSize:12.5,fontWeight:600,color:"var(--text-soft)",padding:"2px 2px 4px"}}>🤝 Meeting proposed: {plan.meetProposedTime}</div>}
                {!meetTimeOpen ? (
                  <button className="primary-btn ghost" onClick={()=>setMeetTimeOpen(true)}>Let's meet in person to decide</button>
                ) : (
                  <div className="inline-add-row">
                    <input className="form-input" placeholder="When? e.g. Thu 7pm" value={meetTime}
                      onChange={e=>setMeetTime(e.target.value)}
                      onKeyDown={e=>{if(e.key==="Enter" && meetTime.trim()){dispatch({type:"MEET_IN_PERSON",planId,proposedTime:meetTime.trim()});dispatch({type:"TOAST",message:"Sent — let's figure this one out together"});setMeetTimeOpen(false);setMeetTime("");}}}/>
                    <button className="small-btn accent" onClick={()=>{dispatch({type:"MEET_IN_PERSON",planId,proposedTime:meetTime.trim()});dispatch({type:"TOAST",message:"Sent — let's figure this one out together"});setMeetTimeOpen(false);setMeetTime("");}}>Send</button>
                  </div>
                )}
                {!plan.finalized ? (
                  <button className="primary-btn accent" onClick={()=>{dispatch({type:"FINALIZE",planId});dispatch({type:"TOAST",message:"Yesss. It's on the calendar 📅"});}}>Finalize plan</button>
                ) : (
                  <div style={{fontSize:12.5,fontWeight:600,color:"var(--text-soft)",padding:"6px 2px"}}>✅ Finalized — on everyone's calendar</div>
                )}
              </div>
            </div>
          )}

          {plan.state==="confirmed" && <button className="primary-btn ghost" style={{marginTop:8}} onClick={()=>openDayOf(planId)}>Preview day-of check</button>}

          {isPutAsideForMe(plan) && <div style={{marginTop:14}}><p style={{fontSize:13,color:"var(--text-soft)",fontWeight:500}}>Set aside {timeAgo(putAsideAt(plan))} — {putAsideReason(plan)}. Your spot isn't gone forever.</p></div>}
          {plan.state==="happened" && <div style={{marginTop:14,fontSize:13.5,color:"var(--text-soft)",fontWeight:500}}>This one happened {timeAgo(plan.dateTime)}. Hope it was a good one 🎉</div>}
          <div style={{height:24}}/>
        </div>
      </div>
    </div>
  );
}

/* ======================================================================
   DAY-OF

const REACTION_COLORS = ["#F2745E","#F3B94D","#C3D65C","#ACA2EA","#8FD6C0","#8CC1EA"];
function DayOfScreen({db, planId, onClose, dispatch}){
  const plan = db.plans[planId];
  const activity = db.activities[plan.activityId];
  const color = catColor(activity.category);
  const mins = Math.max(0, Math.round((plan.dateTime - now())/60000));
  const hrs = Math.floor(mins/60);
  const [out, setOut] = useState(false);
  const [mySnap, setMySnap] = useState(null);
  const [customOpen, setCustomOpen] = useState(false);
  const [customVal, setCustomVal] = useState("");

  function react(emoji){
    const c = REACTION_COLORS[Math.floor(Math.random()*REACTION_COLORS.length)];
    setMySnap({color:c, emoji});
    dispatch({type:"DAYOF_RESPOND", planId, userId:ME, val:"in"});
    dispatch({type:"DAYOF_REACT", planId, userId:ME, emoji});
    dispatch({type:"TOAST", message:"Reaction sent to the group 📸"});
  }
  function submitCustom(){
    if(customVal.trim()){ react(customVal.trim().slice(0,4)); setCustomOpen(false); setCustomVal(""); }
  }
  function cantMake(){ setOut(true); dispatch({type:"DAYOF_RESPOND", planId, userId:ME, val:"out"}); }
  const otherReactions = Object.entries(plan.dayOfReactions||{}).filter(([uid])=>uid!==ME);

  return (
    <div className="fullscreen dayof-screen">
      <div className="dayof-hero" style={{background:color}}>
        <button className="sheet-close" onClick={onClose} aria-label="Close" style={{top:18}}><IconClose/></button>
        <div className="dglyph">{catGlyph(activity.category)}</div>
        <h1><Q text={`Still on for ${activity.title}?`}/></h1>
        <p>{activity.location} · {fmtWhen(plan.dateTime)}</p>
        <div className="countdown">{hrs>0? `${hrs}h ${mins%60}m to go` : `${mins}m to go`}</div>
      </div>
      <div className="notch-dot"/>
      <div className="dayof-actions">
        {!out ? (
          <>
            <p style={{textAlign:"center", fontSize:12.5, color:"var(--text-soft)", margin:"0 0 2px", fontWeight:500}}>Tap an emoji to react — it's sent to the group instantly</p>
            <div className="dayof-reactions">
              {["🔥","👍","😅"].map(e=>(<button key={e} className={`dayof-react ${mySnap && mySnap.emoji===e?"picked":""}`} onClick={()=>react(e)}>{e}</button>))}
              {!customOpen ? (
                <button className="dayof-react" onClick={()=>setCustomOpen(true)} aria-label="Custom reaction">➕</button>
              ) : (
                <input className="custom-emoji-input" autoFocus placeholder="😊" value={customVal}
                  onChange={e=>setCustomVal(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") submitCustom(); }}
                  onBlur={submitCustom}/>
              )}
            </div>

            {(otherReactions.length>0 || mySnap) && (
              <div className="snap-strip">
                {mySnap && <div className="snap-photo" style={{background:mySnap.color}}>{mySnap.emoji}</div>}
                {otherReactions.map(([uid,r])=>(<div className="snap-photo" key={uid} style={{background:REACTION_COLORS[uid.length % REACTION_COLORS.length]}}>{r.emoji}</div>))}
              </div>
            )}

            <button className="quiet-out" onClick={cantMake}>Can't make it anymore</button>
          </>
        ) : (
          <div style={{textAlign:"center"}}>
            <p style={{fontSize:14, color:"var(--text-soft)", marginBottom:16, fontWeight:500}}>No worries — the group will see you're out. No explanation needed.</p>

/* ======================================================================
   CALENDAR — week (default) + month, event-name boxes, border-select
====================================================================== */
function startOfWeek(d){ const nd = new Date(d); nd.setHours(0,0,0,0); nd.setDate(nd.getDate()-nd.getDay()); return nd; }
function calendarDefaultTime(){
  const d = new Date(); d.setHours(19,0,0,0); return d;
}
function CalendarScreen({db, onOpen, onCreateAt}){
  const [view, setView] = useState("week");
  const [weekOffset, setWeekOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);
  const plans = Object.values(db.plans).filter(p=>!isPutAsideForMe(p));

  function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
  const byDay = {};
  plans.forEach(p=>{ const k=dayKey(p.dateTime); (byDay[k]=byDay[k]||[]).push(p); });
  const today = new Date();
  const todayKey = dayKey(today.getTime());

  function addOnDay(d){
    const date = new Date(d);
    date.setHours(19,0,0,0);
    onCreateAt(date.getTime());
  }

  if(view==="week"){
    const start = startOfWeek(new Date(today.getTime() + weekOffset*7*DAY));
    const days = Array.from({length:7}, (_,i)=> new Date(start.getTime() + i*DAY));
    const rangeLabel = `${days[0].toLocaleDateString([], {month:"short", day:"numeric"})} – ${days[6].toLocaleDateString([], {month:"short", day:"numeric"})}`;
    return (
      <div className="fullscreen">
        <div className="section" style={{paddingBottom:8}}><h2 className="section-title">Calendar</h2><p className="section-sub">tap a day to add a plan</p></div>
        <div className="cal-view-toggle"><button className="on">Week</button><button onClick={()=>setView("month")}>Month</button></div>
        <div className="cal-grid-head">
          <button className="cal-nav-btn" onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <span className="cal-month-label">{rangeLabel}</span>
          <button className="cal-nav-btn" onClick={()=>setWeekOffset(w=>w+1)}>›</button>
        </div>
        <div className="week-list">
          {days.map((d,i)=>{
            const k = dayKey(d.getTime());
            const dayPlans = (byDay[k]||[]).sort((a,b)=>a.dateTime-b.dateTime);
            const isToday = k===todayKey;
            return (
              <div className={`week-day-row ${isToday?"today":""}`} key={i} onClick={()=>addOnDay(d)}>
                <div className="week-day-num">
                  <div className="wd-dow">{d.toLocaleDateString([], {weekday:"short"})}</div>
                  <div className="wd-num">{d.getDate()}</div>
                </div>
                <div className="week-day-events">
                  {dayPlans.length===0 && <div className="week-event-empty">Tap to add something</div>}
                  {dayPlans.map(p=>{
                    const a = db.activities[p.activityId];
                    return (
                      <div className="week-event-chip" key={p.id} style={{background:catColor(a.category)}} onClick={e=>{e.stopPropagation();onOpen(p.id);}}>
                        <span>{catGlyph(a.category)}</span><span>{a.title}</span><span style={{marginLeft:"auto",fontWeight:600,opacity:.8}}>{fmtTimeOnly(p.dateTime)}</span>
                      </div>
                    );
                  })}
                  {dayPlans.length>0 && <div className="calendar-add-hint">+ add another</div>}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{height:20}}/>
      </div>
    );
  }

  const viewDate = new Date(today.getFullYear(), today.getMonth()+monthOffset, 1);
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = viewDate.toLocaleDateString([], {month:"long", year:"numeric"});
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  return (
    <div className="fullscreen">
      <div className="section" style={{paddingBottom:8}}><h2 className="section-title">Calendar</h2><p className="section-sub">tap a date to add a plan</p></div>
      <div className="cal-view-toggle"><button onClick={()=>setView("week")}>Week</button><button className="on">Month</button></div>
      <div className="cal-grid-head">
        <button className="cal-nav-btn" onClick={()=>setMonthOffset(m=>m-1)}>‹</button>
        <span className="cal-month-label">{monthLabel}</span>
        <button className="cal-nav-btn" onClick={()=>setMonthOffset(m=>m+1)}>›</button>
      </div>
      <div className="cal-grid">
        {["S","M","T","W","T","F","S"].map((d,i)=><div className="cal-dow" key={i}>{d}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={i} className="cal-day empty"/>;
          const date = new Date(year, month, d);
          const k = `${year}-${month}-${d}`;
          const dayPlans = (byDay[k]||[]).sort((a,b)=>a.dateTime-b.dateTime);
          const isToday = k===todayKey;
          return (
            <div key={i} className={`cal-day ${isToday?"today":""}`} onClick={()=>addOnDay(date)} role="button" tabIndex={0}
              onKeyDown={e=>{if(e.key==="Enter"||e.key===" ") addOnDay(date);}}>
              <span>{d}</span>
              {dayPlans.slice(0,2).map(p=>{
                const a = db.activities[p.activityId];
                return <span key={p.id} className="cal-day-chip" style={{background:catColor(a.category)}} onClick={e=>{e.stopPropagation();onOpen(p.id);}}>{a.title}</span>;
              })}
              {dayPlans.length>2 && <span className="cal-more">+{dayPlans.length-2} more</span>}
            </div>
          );
        })}
      </div>
      <div style={{padding:"12px 24px 22px",fontSize:11.5,color:"var(--text-soft)",fontWeight:500}}>Tip: tap any date, or tap an existing plan to open it.</div>
    </div>
  );
}

function NewGroupSheet({db, onClose, dispatch, onCreated}){
  const [name, setName] = useState("");
  const [emoji, setEmoji] = useState("✨");
  const [members, setMembers] = useState([]);
  const [customEmojiOpen, setCustomEmojiOpen] = useState(false);
  const [showNewPerson, setShowNewPerson] = useState(false);
  const [newPersonName, setNewPersonName] = useState("");
  const emojiOptions = ["✨","🌤️","💼","🏠","🎉","🏔️","🍜","🎮"];
  function toggle(id){ setMembers(m=> m.includes(id) ? m.filter(x=>x!==id) : [...m, id]); }
  function addNewPerson(){
    const personName = newPersonName.trim();
    if(!personName) return;
    const uid = `u_${personName.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"") || "friend"}_${Date.now()}`;
    dispatch({type:"CREATE_USER_FREEFORM", uid, name:personName});
    setMembers(m=>m.includes(uid) ? m : [...m, uid]);
    setNewPersonName("");
    setShowNewPerson(false);
  }
  function submit(){
    const id = `g_${now()}`;
    dispatch({type:"CREATE_GROUP", id, name: name.trim()||"New group", emoji, memberIds:Array.from(new Set([ME, ...members]))});
    if(onCreated) onCreated(id);
    if(onClose) onClose();
  }
  return (
    <div className="sheet" role="dialog" aria-modal="true">
      <div className="sheet-handle"/>
      <button className="sheet-close" onClick={onClose} style={{background:"rgba(20,20,20,0.5)"}}><IconClose/></button>

            {!customEmojiOpen ? (
              <div className={`ps-opt ${!emojiOptions.includes(emoji)?"on":""}`} onClick={()=>setCustomEmojiOpen(true)}>{!emojiOptions.includes(emoji) ? emoji : "+ custom"}</div>
            ) : (
              <input className="custom-emoji-input" style={{width:44,height:44}} autoFocus value={emoji} onChange={e=>setEmoji(e.target.value.slice(-2)||"✨")} onBlur={()=>setCustomEmojiOpen(false)}/>
            )}
          </div>
        </div>
        <div className="form-field"><label className="form-label">Who's in it</label>
          <div className="pill-select">{Object.values(db.users).filter(u=>u.id!==ME).map(u=>(<div key={u.id} className={`ps-opt ${members.includes(u.id)?"on":""}`} onClick={()=>toggle(u.id)}>{members.includes(u.id)?"✓ ":""}{u.name}</div>))}</div>
          {!showNewPerson ? (
            <button className="hype-note-btn" style={{marginTop:10}} onClick={()=>setShowNewPerson(true)}>＋ Add a new person</button>
          ) : (
            <div className="inline-add-row" style={{marginTop:10}}>
              <input className="form-input" autoFocus placeholder="Their name" value={newPersonName} onChange={e=>setNewPersonName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter") addNewPerson();}}/>

            </div>
          )}

/* ======================================================================
   NOTIFICATIONS — three action categories
====================================================================== */
function SwipeableNotification({n, db, onOpen, dispatch, category, urgent}){
  const [dx, setDx] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startX = useRef(null);
  const startY = useRef(null);
  const didSwipe = useRef(false);

  function onTouchStart(e){
    if(!e.touches || !e.touches[0]) return;
    startX.current = e.touches[0].clientX;
    startY.current = e.touches[0].clientY;
    didSwipe.current = false;
    setDragging(false);
  }
  function onTouchMove(e){
    if(startX.current===null || !e.touches || !e.touches[0]) return;
    const x = e.touches[0].clientX;
    const y = e.touches[0].clientY;
    const rawDx = x - startX.current;
    const rawDy = y - startY.current;
    if(Math.abs(rawDx) < 8 && Math.abs(rawDy) < 8) return;
    if(Math.abs(rawDy) > Math.abs(rawDx) && Math.abs(dx) < 8){
      return;
    }
    didSwipe.current = true;
    setDragging(true);
    setDx(Math.max(-150, Math.min(150, rawDx)));
  }
  function onTouchEnd(){
    if(startX.current===null) return;
    const shouldDismiss = Math.abs(dx) >= 78;
    if(shouldDismiss){
      dispatch({type:"DISMISS_NOTIFICATION", notificationId:n.id});
    }
    setDx(0);
    setDragging(false);
    startX.current = null;
    startY.current = null;
  }
  function onClick(){
    if(didSwipe.current){ didSwipe.current = false; return; }
    dispatch({type:"MARK_NOTIF_READ", notificationId:n.id});
    if(n.planId && db.plans[n.planId]) onOpen(n.planId);
  }

  const side = dx < 0 ? "right" : "left";
  const cls = category === "slipping" ? "notif-slipping" : category === "poked" ? "notif-poked" : "notif-calendar-reminder";
  return (
    <div className="notif-swipe-wrap">
      <div className={`notif-hide-action ${side}`}>Hide</div>
      <div
        className={`notif-row notif-swipeable ${cls} ${urgent?"urgent":""} ${!n.read?"unread":""} ${dragging?"dragging":""}`}
        style={{transform:`translateX(${dx}px)`}}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        onClick={onClick}>
        <div className="notif-emoji">{notificationEmoji(n)}</div>
        <div style={{flex:1,minWidth:0}}>
          <div className="notif-text">{n.message}</div>
          {urgent && <div className="notif-flag">⚠ Needs attention</div>}
          <div className="notif-time">{timeAgo(n.createdAt)}</div>
        </div>
      </div>
    </div>
  );
}

function NotificationsScreen({db, onOpen, dispatch}){
  const list = [...db.notifications].filter(n=>isVisibleNotification(n, db)).sort((a,b)=>b.createdAt-a.createdAt);

  return (
    <div className="fullscreen">
      <div className="section"><h2 className="section-title">Updates</h2><p className="section-sub">quick things worth knowing</p></div>
      {list.length===0 && <div className="empty-state"><div className="em-emoji">🔔</div><h3>All quiet</h3><p>Nothing to report. Peace and snacks.</p></div>}
      {list.map(n=>{
        const category = notificationCategory(n);
        const urgent = category === "slipping" && (n.urgent || (n.planId && db.plans[n.planId] && ["at_risk","needs_nudge"].includes(db.plans[n.planId].state)));
        return <SwipeableNotification key={n.id} n={n} db={db} onOpen={onOpen} dispatch={dispatch} category={category} urgent={urgent}/>;
      })}
    </div>
  );
}

function inputDateValue(ts){
  const d = new Date(ts || now());
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function inputTimeValue(ts){
  const d = new Date(ts || now());
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function presetDateTime(preset, customDate, customTime){
  const d = new Date();
  if(preset==="today"){ d.setHours(19,0,0,0); return d.getTime(); }
  if(preset==="tomorrow"){ d.setDate(d.getDate()+1); d.setHours(19,0,0,0); return d.getTime(); }
  if(preset==="weekend"){
    const day=d.getDay(); const daysUntilSat=(6-day+7)%7;
    d.setDate(d.getDate()+daysUntilSat); d.setHours(19,0,0,0); return d.getTime();
  }
  if(preset==="nextweek"){
    const day=d.getDay(); const daysUntilMon=((1-day)+7)%7 || 7;
    d.setDate(d.getDate()+daysUntilMon); d.setHours(19,0,0,0); return d.getTime();
  }
  if(preset==="custom" && customDate){
    const [y,m,day]=customDate.split("-").map(Number);
    const [hh,mm]=(customTime||"19:00").split(":").map(Number);
    return new Date(y,(m||1)-1,day||1,hh||0,mm||0,0,0).getTime();
  }
  return now()+3*DAY;
}

      </div>
    </div>
  );

/* ======================================================================
   REDUCER
====================================================================== */
function recomputePlanState(next, plan){
  const counts = responseCounts(next, plan);
  if(["day_of_check","at_risk","happened"].includes(plan.state)) return;
  if(counts.in >= plan.minPeople){
    if(plan.state !== "confirmed"){
      plan.state = "confirmed";
    }
  } else if(plan.state==="confirmed"){
    plan.state = "gathering";
  } else if(plan.state==="shared" && counts.in + counts.no + counts.backedOut > 0){
    plan.state = "gathering";
  }
}

function actorName(next){ return (ME && next.users[ME]) ? next.users[ME].name : "Someone"; }

function reducer(db, action){
  const next = JSON.parse(JSON.stringify(db));
  switch(action.type){
    case "MARK_SEEN": { next.plans[action.planId].seenByMe = true; return next; }
    case "TOGGLE_PIN": { const p = next.plans[action.planId]; p.pinnedToTop = !p.pinnedToTop; return next; }

    case "RESPOND": {
      const plan = next.plans[action.planId];
      plan.responses[action.userId] = action.response;
      if(action.response && ["no","backed_out"].includes(action.response.type)){
        plan.fallbackDismissed = false;
      }
      // "no" / "backed out" only affects the responder's own view (see
      // isPutAsideForMe) — it never changes the shared plan for the group.
      recomputePlanState(next, plan);
      return next;
    }
    case "KICK_FROM_PLAN": {
      const plan = next.plans[action.planId];
      if(!plan || !isPlanner(plan, ME) || action.userId===ME || isPlanner(plan, action.userId)) return db;
      plan.excludedMemberIds = Array.from(new Set([...(plan.excludedMemberIds||[]), action.userId]));
      delete plan.responses[action.userId];
      if(plan.dayOfResponses) delete plan.dayOfResponses[action.userId];
      if(plan.dayOfReactions) delete plan.dayOfReactions[action.userId];
      if(plan.suggestionNotes) delete plan.suggestionNotes[action.userId];
      if(plan.travelPlans) delete plan.travelPlans[action.userId];
      plan.coplannerRequests = (plan.coplannerRequests||[]).filter(id=>id!==action.userId);
      recomputePlanState(next, plan);
      return next;
    }
    case "UPDATE_PLAN_DETAILS": {
      const plan = next.plans[action.planId];
      const activity = next.activities[plan.activityId];
      activity.title = action.title; activity.location = action.location;
      plan.minPeople = action.minPeople; plan.budget = action.budget ?? plan.budget ?? ""; plan.priority = action.priority; plan.note = action.note;
      plan.groupTravelPlan = (action.travelPlan||"").trim();
      if(action.coverImage !== undefined) plan.coverImage = action.coverImage;
      plan.updatedAt = now();
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:plan.id, message:`${actorName(next)} tweaked ${activity.title} ✏️ have another peek`, createdAt:now(), read:false});
      return next;
    }
    case "ADD_PLANNER": {
      const plan = next.plans[action.planId];
      plan.plannerIds = Array.from(new Set([...(plan.plannerIds||[]), action.userId]));
      plan.coplannerRequests = (plan.coplannerRequests||[]).filter(id=>id!==action.userId);
      const addedName = next.users[action.userId] ? next.users[action.userId].name : "Someone";
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"planner", planId:plan.id, message:`${addedName} joined the planning squad for ${next.activities[plan.activityId].title} 🧭`, createdAt:now(), read:true});
      return next;
    }
    case "ASK_COPLANNER": {
      const plan = next.plans[action.planId];
      plan.coplannerRequests = Array.from(new Set([...(plan.coplannerRequests||[]), action.userId]));
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"planner", planId:plan.id, message:`${actorName(next)} wants to help plan ${next.activities[plan.activityId].title} 🧭`, createdAt:now(), read:true});
      return next;
    }
    case "MEET_IN_PERSON": {
      const plan = next.plans[action.planId];
      const when = action.proposedTime && action.proposedTime.trim() ? ` — proposed for ${action.proposedTime.trim()}` : "";
      plan.meetProposedTime = action.proposedTime && action.proposedTime.trim() ? action.proposedTime.trim() : null;
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"meet", planId:plan.id, message:`${actorName(next)} wants to hash out ${next.activities[plan.activityId].title} in person${when} 🤝`, createdAt:now(), read:false});
      return next;
    }
    case "FINALIZE": {
      const plan = next.plans[action.planId];
      if(!plan) return db;
      plan.finalized = true;
      next.notifications.unshift({
        id:"n"+now()+Math.random(), actorId:ME, type:"calendar_reminder", planId:plan.id,
        message:`Calendar reminder: ${next.activities[plan.activityId].title} is locked in for ${fmtWhen(plan.dateTime)} 📅`,
        createdAt:now(), read:false
      });
      return next;
    }
    case "SUGGEST_NOTE": {
      const plan = next.plans[action.planId];
      const entry = {id:"s"+now()+Math.random(), userId:action.userId, text:action.text, ts:now()};
      if(Array.isArray(plan.suggestionNotes)){
        plan.suggestionNotes.push(entry);
      } else {
        plan.suggestionNotes = plan.suggestionNotes || {};
        const existing = plan.suggestionNotes[action.userId];
        if(Array.isArray(existing)) existing.push({id:entry.id, text:entry.text, ts:entry.ts});
        else if(existing && existing.text) plan.suggestionNotes[action.userId] = [{text:existing.text, ts:existing.ts}, {id:entry.id, text:entry.text, ts:entry.ts}];
        else plan.suggestionNotes[action.userId] = [{id:entry.id, text:entry.text, ts:entry.ts}];
      }
      const isPlannerSelf = (plan.plannerIds||[])[0]===action.userId;
      if(!isPlannerSelf){
        next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:plan.id, message:`${actorName(next)} left a little note on ${next.activities[plan.activityId].title} 💬`, createdAt:now(), read:false});
      }
      return next;
    }
    case "ADD_TRAVEL_PLAN": { const plan = next.plans[action.planId]; plan.travelPlans = plan.travelPlans || {}; plan.travelPlans[action.userId] = {text:action.text, ts:now()}; return next; }
    case "NUDGE": {
      const plan = next.plans[action.planId];
      if(!plan || !isPlanner(plan, ME)) return db;
      if(plan.lastPokedAt && now()-plan.lastPokedAt < POKE_COOLDOWN) return db;
      plan.lastPokedAt = now();
      next.notifications.unshift({
        id:"n"+now()+Math.random(), actorId:ME, type:"poked", planId:plan.id,
        message:`Poke sent for ${next.activities[plan.activityId].title} 👋`, createdAt:now(), read:false
      });
      return next;
    }
    case "DAYOF_RESPOND": {
      const plan = next.plans[action.planId];
      plan.dayOfResponses = plan.dayOfResponses || {};
      plan.dayOfResponses[action.userId] = action.val;
      if(action.val==="out"){
        plan.responses[action.userId] = {type:"backed_out", ts:now()};
        plan.state = "at_risk";
        next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"slipping", planId:plan.id, message:`Uh-oh — ${actorName(next)} dropped out of ${next.activities[plan.activityId].title} 🫠`, createdAt:now(), read:false});
      }
      return next;
    }
    case "DAYOF_REACT": {
      const plan = next.plans[action.planId];
      plan.dayOfReactions = plan.dayOfReactions || {};
      plan.dayOfReactions[action.userId] = {emoji:action.emoji, ts:now()};
      return next;
    }
    case "SEND_FALLBACK": {
      next.plans[action.planId].fallbackSent = true; next.plans[action.planId].fallbackDismissed = false; next.plans[action.planId].fallbackText = action.text;
      next.notifications.unshift({id:"n"+now()+Math.random(), actorId:ME, type:"updated", planId:action.planId, message:`${actorName(next)} suggested a smaller version of ${next.activities[next.plans[action.planId].activityId].title} ✨`, createdAt:now(), read:false});
      return next;
    }
    case "DISMISS_FALLBACK": { next.plans[action.planId].fallbackDismissed = true; return next; }
    case "RESTORE": {
      const plan = next.plans[action.planId];
      if(plan.responses[ME] && ["no","backed_out"].includes(plan.responses[ME].type)) delete plan.responses[ME];
      recomputePlanState(next, plan);
      return next;
    }
    case "DISMISS_NOTIFICATION": { next.notifications = next.notifications.filter(n=>n.id!==action.notificationId); return next; }
    case "MARK_ALL_READ": { next.notifications.forEach(n=>n.read=true); return next; }
    case "MARK_NOTIF_READ": { const n = next.notifications.find(x=>x.id===action.notificationId); if(n) n.read=true; return next; }
    case "CREATE_PLAN": {
      const id = "p_"+now(); const actId = "a_"+now();
      if(action.newGroup){
        const g = action.newGroup;
        next.groups[g.id] = {
          id:g.id, name:g.name, emoji:g.emoji || "✨",
          memberIds:Array.from(new Set(g.memberIds || [ME])),
          color:GROUP_PALETTE[Object.keys(next.groups).length % GROUP_PALETTE.length]
        };
      }
      next.activities[actId] = {
        id:actId, title:action.title, category:"custom",
        location:(action.location||"").trim() || "TBD"
      };
      const ts = action.dateTime || now() + 3*DAY;
      next.plans[id] = {
        id, activityId:actId, groupId:action.groupId,
        extraGroupIds:[], extraMemberIds:action.extraMemberIds||[],
        creatorId:ME, plannerIds:[ME], dateTime:ts, minPeople:action.minPeople,
        priority:"Your plan",
        budget:action.budget ?? "",
        note:action.note, groupTravelPlan:(action.travelPlan||"").trim(),
        sourceLink:(action.sourceLink||"").trim() || null, coverImage:action.coverImage || null,
        state:"shared", createdAt:now(), pinnedToTop:false, seenByMe:true, finalized:false,
        responses:{ [ME]:{type:"yes", ts:now()} }, suggestionNotes:{}, coplannerRequests:[], excludedMemberIds:[],
      };
      return next;
    }
    case "CREATE_GROUP": { const id = action.id || "g_"+now(); next.groups[id] = {id, name:action.name, emoji:action.emoji || "✨", memberIds:Array.from(new Set(action.memberIds || [ME])), color:action.color || GROUP_PALETTE[Object.keys(next.groups).length % GROUP_PALETTE.length]}; return next; }
    case "CREATE_USER_FROM_CONTACT": {
      const contact = next.contacts.find(c=>c.id===action.contactId);
      if(contact && !next.users[action.uid]){
        next.users[action.uid] = {id:action.uid, name:contact.name, handle:"@"+contact.name.toLowerCase(), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
        next.contacts = next.contacts.filter(c=>c.id!==action.contactId);
      }
      return next;
    }
    case "CREATE_USER_FREEFORM": {
      if(!next.users[action.uid]){
        next.users[action.uid] = {id:action.uid, name:action.name, handle:"@"+action.name.toLowerCase().replace(/\s+/g,""), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
      }
      return next;
    }
    case "RENAME_GROUP": { next.groups[action.groupId].name = action.name; return next; }
    case "UPDATE_GROUP_MEMBERS": {
      const group = next.groups[action.groupId];
      if(action.action==="add") group.memberIds = Array.from(new Set([...group.memberIds, action.userId]));
      else group.memberIds = group.memberIds.filter(id=>id!==action.userId);
      return next;
    }
    case "ADD_CONTACT_TO_GROUP": {
      const contact = next.contacts.find(c=>c.id===action.contactId);
      if(contact){
        const uid = "u_"+contact.id;
        next.users[uid] = {id:uid, name:contact.name, handle:"@"+contact.name.toLowerCase(), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
        next.groups[action.groupId].memberIds = Array.from(new Set([...next.groups[action.groupId].memberIds, uid]));
        next.contacts = next.contacts.filter(c=>c.id!==action.contactId);
      }
      return next;
    }
    case "CREATE_USER_AND_ADD_TO_GROUP": {
      const uid = "u_"+now();
      next.users[uid] = {id:uid, name:action.name, handle:"@"+action.name.toLowerCase().replace(/\s+/g,""), color: GROUP_PALETTE[Object.keys(next.users).length % GROUP_PALETTE.length]};
      next.groups[action.groupId].memberIds = Array.from(new Set([...next.groups[action.groupId].memberIds, uid]));
      return next;
    }
    default: return db;
  }
}

/* ======================================================================
   APP SHELL
====================================================================== */
function App(){
  const [authedUserId, setAuthedUserId] = useState(null);
  const [checkingSession, setCheckingSession] = useState(true);
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [cloudStatus, setCloudStatus] = useState("checking"); // checking | connected | unavailable
  const [writeBlocked, setWriteBlocked] = useState(false);
  const [lastWriteError, setLastWriteError] = useState(null);
  const [retryKey, setRetryKey] = useState(0);
  const [tab, setTab] = useState("home");
  const [openPlanId, setOpenPlanId] = useState(null);
  const [dayOfId, setDayOfId] = useState(null);
  const [newPlanOpen, setNewPlanOpen] = useState(false);
  const [prefillSourceLink, setPrefillSourceLink] = useState(null);
  const [prefillDate, setPrefillDate] = useState(null);
  const [showUninterested, setShowUninterested] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const [showNotifications, setShowNotifications] = useState(false);
  const [openGroupId, setOpenGroupId] = useState(null);
  const [newGroupOpen, setNewGroupOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [scrolled, setScrolled] = useState(false);
  const [notifBanner, setNotifBanner] = useState(null);
  const [bellWiggle, setBellWiggle] = useState(false);
  const [tourOpen, setTourOpen] = useState(false);
  const [tourStep, setTourStep] = useState(0);
  const [tourIntro, setTourIntro] = useState(false);
  const prevTopNotifRef = useRef(null);
  const notifBannerTimerRef = useRef(null);
  const [theme, setThemeState] = useState("system");
  const toastTimer = useRef(null);
  const cloudDocRef = useRef(null);
  const pendingWriteRef = useRef(null);
  const writingRef = useRef(false);
  const applyingRemoteRef = useRef(false);
  const hasSeededRef = useRef(false);

  // Restore a remembered session + theme once, on first load.
  useEffect(()=>{
    unlockAudioOnce();
    const savedUserId = safeGet(SESSION_KEY);
    if(savedUserId && Object.values(CREDENTIALS).some(c=>c.userId===savedUserId)){
      ME = savedUserId;
      setAuthedUserId(savedUserId);
    }
    const savedTheme = safeGet(THEME_KEY);
    if(savedTheme) setThemeState(savedTheme);
    setCheckingSession(false);

    // Arrived here via the OS share sheet (Android, installed as a PWA)?
    // Instagram's share intent only ever hands over a link/text — never the
    // caption body or cover image, so this just saves the manual paste step
    // for the URL; caption pasting for autofill still happens by hand.
    try{
      const params = new URLSearchParams(window.location.search);
      const sharedUrl = params.get("shared_url");
      const sharedText = params.get("shared_text");
      const raw = sharedUrl || sharedText;
      if(raw){
        const urlMatch = raw.match(/https?:\/\/\S+/);
        setPrefillSourceLink(urlMatch ? urlMatch[0] : raw);
        window.history.replaceState({}, "", window.location.pathname);
      }
    }catch(e){}
  }, []);

  useEffect(()=>{
    if(authedUserId && prefillSourceLink) setNewPlanOpen(true);
  }, [authedUserId, prefillSourceLink]);

  function handleLogin(userId){
    ME = userId;
    safeSet(SESSION_KEY, userId);
    setAuthedUserId(userId);
  }
  function handleLogout(){
    safeRemove(SESSION_KEY);
    ME = null;
    setDb(null);
    setLoading(true);
    setCloudStatus("checking");
    setAuthedUserId(null);
  }

  // Connect to the shared Firestore document once signed in; fall back to
  // this device only if Firebase isn't configured or reachable.
  useEffect(()=>{
    if(!authedUserId) return;
    let cancelled = false;
    let unsub = null;
    setWriteBlocked(false);
    setLastWriteError(null);

    (async () => {
      const ok = await ensureFirebaseAuth();
      if(cancelled) return;

      if(!ok || !fsDoc){
        setCloudStatus("unavailable");
        setDb(loadLocalFallback());
        setLoading(false);
        return;
      }

      setCloudStatus("connected");
      cloudDocRef.current = fsDoc;

      unsub = fsDoc.onSnapshot((snap)=>{
        if(cancelled) return;
        if(snap.exists){
          applyingRemoteRef.current = true;
          setDb(snap.data());
          setLoading(false);
        } else if(!hasSeededRef.current){
          hasSeededRef.current = true;
          setDb(seed());
          setLoading(false);
        }
      }, (err)=>{
        if(cancelled) return;
        setCloudStatus("unavailable");
        setDb(loadLocalFallback());
        setLoading(false);
      });
    })();

    return ()=>{ cancelled = true; if(unsub) unsub(); cloudDocRef.current = null; hasSeededRef.current = false; };
  }, [authedUserId, retryKey]);

  async function flushCloudWrite(){
    if(writingRef.current) return;
    if(pendingWriteRef.current===null || !cloudDocRef.current) return;
    writingRef.current = true;
    const data = pendingWriteRef.current;
    pendingWriteRef.current = null;
    try{
      await cloudDocRef.current.set(data);
      if(writeBlocked) setWriteBlocked(false);
    }catch(e){
      // A well-formed set() rejecting almost always means this viewer only
      // has read (not write/interact) access to the artifact — surface it
      // rather than pretending the change saved.
      setWriteBlocked(true);
      setLastWriteError((e && e.code) || "unknown");
      saveLocalFallback(data); // don't lose the change locally even if the group never sees it
    }
    writingRef.current = false;
    if(pendingWriteRef.current!==null) flushCloudWrite();
  }

  // Any LOCAL change to db gets persisted — to the shared store when
  // connected, to this device only otherwise. Changes arriving FROM the
  // store (the snapshot handler above) are flagged so they don't bounce
  // straight back out as a write.
  useEffect(()=>{
    if(!db) return;
    if(applyingRemoteRef.current){ applyingRemoteRef.current = false; return; }
    if(cloudStatus==="connected" && cloudDocRef.current){
      pendingWriteRef.current = db;
      flushCloudWrite();
    } else {
      saveLocalFallback(db);
    }
  }, [db]);

  useEffect(()=>{ document.documentElement.setAttribute("data-theme", theme==="system" ? "" : theme); }, [theme]);

  // Fires the bell wiggle + top banner whenever a genuinely new notification
  // shows up at the front of the list AND it's from someone else's action —
  // no need to alert yourself about something you just did.
  useEffect(()=>{
    if(!db || !db.notifications || db.notifications.length===0) return;
    const top = [...db.notifications].filter(n=>isVisibleNotification(n, db)).sort((a,b)=>b.createdAt-a.createdAt)[0];
    if(!top) return;
    if(prevTopNotifRef.current !== null && top.id !== prevTopNotifRef.current && top.actorId !== ME){
      setNotifBanner(top);
      setBellWiggle(true);
      playNotifSound();
      setTimeout(()=>setBellWiggle(false), 550);
      clearTimeout(notifBannerTimerRef.current);
      notifBannerTimerRef.current = setTimeout(()=>setNotifBanner(n => (n && n.id===top.id) ? null : n), 4500);
    }
    prevTopNotifRef.current = top.id;
  }, [db && db.notifications && db.notifications[0] && db.notifications[0].id]);
  function setTheme(t){ setThemeState(t); safeSet(THEME_KEY, t); }

  function dispatch(action){
    if(action.type==="TOAST"){
      setToast({message:action.message, onUndo:action.onUndo});
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(()=>setToast(null), 4200);
      return;
    }
    setDb(d => reducer(d, action));
  }

  const tourSteps = [
    {title:"Create a plan", body:"Tap + to start an idea. Add the details, then choose who you want to share it with.", target:"fab", action:()=>{ setTab("home"); setNewPlanOpen(false); setOpenPlanId(null); setOpenGroupId(null); }},
    {title:"Choose your people", body:"Pick a group, or create a new one and add the people you want in it.", target:"plan-group", action:()=>{ setTab("home"); setNewPlanOpen(true); }},
    {title:"Shared plans", body:"Plans others share with you appear here. Open one to see the proposal and respond.", target:"response-buttons", action:()=>{ setNewPlanOpen(false); setOpenPlanId("p_reel_hp"); setTab("all"); }},
    {title:"Respond or poke", body:"Choose I’m in, Yes but…, or No. If someone hasn’t replied, Poke them for a nudge.", target:"poke-button", action:()=>{ setOpenPlanId("p_reel_kart"); }},
    {title:"See it on the map", body:"Switch to Map to see shared plans by location. Tap a pin to open one.", target:"map-button", action:()=>{ setOpenPlanId(null); setTab("all"); setTimeout(()=>{ const el=document.querySelector('[data-tour="map-button"]'); if(el) el.click(); },90); }}
  ];

  function startWalkthrough(){
    // Use the reel demo as a safe, populated teaching environment. The current
    // user is made the planner of one plan so the Poke step is always visible.
    const demo = seedReelDemo();
    if(demo.plans.p_reel_hp){ delete demo.plans.p_reel_hp.responses[ME]; demo.plans.p_reel_hp.plannerIds=["u_maya"]; }
    if(demo.plans.p_reel_kart){ demo.plans.p_reel_kart.plannerIds=[ME]; demo.plans.p_reel_kart.creatorId=ME; }
    hasSeededRef.current = true;
    setDb(demo);
    setOpenPlanId(null); setNewPlanOpen(false); setOpenGroupId(null);
    setShowNotifications(false); setShowUninterested(false); setShowHistory(false);
    setTab("home"); setTourStep(0); setTourIntro(true); setTourOpen(true);
  }

  function finishWalkthrough(){
    setTourOpen(false); setTourIntro(false); setOpenPlanId(null); setNewPlanOpen(false); setOpenGroupId(null); setTab("profile");
  }

  function nextTourStep(){
    if(tourStep >= tourSteps.length-1){ finishWalkthrough(); return; }
    setTourStep(s=>s+1);
  }
  function prevTourStep(){ if(tourStep>0) setTourStep(s=>s-1); }

  function openPlan(id){ if(showNotifications) dispatch({type:"MARK_ALL_READ"}); setShowUninterested(false); setShowHistory(false); setShowNotifications(false); setOpenGroupId(null); setOpenPlanId(id); }
  function openNewPlan(initialDate=null){ setPrefillDate(initialDate); setNewPlanOpen(true); }
  function closeNotifications(){ dispatch({type:"MARK_ALL_READ"}); setShowNotifications(false); }
  function closePlan(){ setOpenPlanId(null); }
  function openDayOf(id){ setOpenPlanId(null); setDayOfId(id); }
  function closeDayOf(){ setDayOfId(null); }

  useEffect(()=>{
    if(!tourOpen || tourIntro) return;
    const step = tourSteps[tourStep];
    if(step && step.action) step.action();
    const timer = setTimeout(()=>{
      const el = step && step.target ? document.querySelector(`[data-tour="${step.target}"]`) : null;
      if(el) el.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
    }, 140);
    return ()=>clearTimeout(timer);
  }, [tourOpen, tourIntro, tourStep]);

  useEffect(()=>{
    if(!tourOpen) return;
    const onKey = e=>{ if(e.key==="Escape") finishWalkthrough(); };
    window.addEventListener("keydown", onKey);
    return ()=>window.removeEventListener("keydown", onKey);
  }, [tourOpen]);

  useEffect(()=>{
    function onScroll(){ setScrolled(window.scrollY>4); }
    window.addEventListener("scroll", onScroll);
    return ()=>window.removeEventListener("scroll", onScroll);
  },[]);

  if(checkingSession) return null;
  if(!authedUserId) return <LoginScreen onLogin={handleLogin}/>;

  const unreadCount = db ? db.notifications.filter(n=>isVisibleNotification(n, db) && !n.read && n.actorId!==ME).length : 0;
  const currentUserName = (db && db.users[ME] && db.users[ME].name) || (CREDENTIALS[Object.keys(CREDENTIALS).find(k=>CREDENTIALS[k].userId===ME)]||{}).name || "you";

  return (
    <React.Fragment>
      <div className={`app-header ${scrolled?"scrolled":""}`}>
        <span className="brand">who's in<span className="qmark">?</span></span>
        <div className="header-icons">
          <button className={`icon-btn ${unreadCount>0?"has-unread":""} ${bellWiggle?"bell-wiggle":""}`} aria-label="Updates" onClick={()=>setShowNotifications(true)}><IconBell/>{unreadCount>0 && <span className="badge-dot"/>}</button>
        </div>
      </div>

      {notifBanner && (
        <div className="notif-toast" onClick={()=>{ setNotifBanner(null); if(notifBanner.planId && db.plans[notifBanner.planId]) openPlan(notifBanner.planId); }}>
          <span className="nt-emoji">{notificationEmoji(notifBanner)}</span>
          <span className="nt-text">{notifBanner.message}</span>
        </div>
      )}

      {cloudStatus==="unavailable" && !loading && (
        <div className="sync-banner">Syncing on this device only — check that the Firebase config at the top of the file has been filled in, and that you're online.</div>
      )}
      {cloudStatus==="connected" && writeBlocked && !loading && (
        <div className="sync-banner">Connected, but changes aren't saving to the shared copy — check the Firestore security rules match the ones in the setup comment at the top of the file.</div>
      )}

      <div className="main-content">
        {loading || !db ? (
          <HomeScreen loading={true} />
        ) : (
          <>
            {tab==="home" && <HomeScreen db={db} onOpen={openPlan} openDayOf={openDayOf} loading={false}/>}
            {tab==="all" && <AllPlansScreen db={db} onOpen={openPlan} openDayOf={openDayOf} dispatch={dispatch}/>}
            {tab==="calendar" && <CalendarScreen db={db} onOpen={openPlan} onCreateAt={openNewPlan}/>}
            {tab==="profile" && <ProfileScreen db={db} theme={theme} setTheme={setTheme} onOpenUninterested={()=>setShowUninterested(true)} onOpenHistory={()=>setShowHistory(true)} onOpenGroup={(id)=>setOpenGroupId(id)} onNewGroup={()=>setNewGroupOpen(true)} onLogout={handleLogout} currentUserName={currentUserName} cloudStatus={cloudStatus} writeBlocked={writeBlocked} onRetrySync={()=>setRetryKey(k=>k+1)} onReelDemo={()=>{ hasSeededRef.current = true; setDb(seedReelDemo()); dispatch({type:"TOAST", message:"Reel demo loaded 🎬"}); }} onStartWalkthrough={startWalkthrough} onResetData={(mode)=>{ hasSeededRef.current = true; setDb(mode==="blank" ? seedEmpty() : seed()); dispatch({type:"TOAST", message: mode==="blank" ? "Wiped — ready for a new group" : "Demo data restored for everyone"}); }}/>}
          </>
        )}
      </div>

      {!loading && db && <button className="fab" data-tour="fab" aria-label="Share a new idea" onClick={()=>openNewPlan(null)}>+</button>}

      <div className="bottom-nav">
        <button className={`nav-item ${tab==="home"?"active":""}`} onClick={()=>setTab("home")}><IconHome/><span className="nlabel">Home</span></button>
        <button className={`nav-item ${tab==="all"?"active":""}`} data-tour="shared-nav" onClick={()=>setTab("all")}><IconCompass/><span className="nlabel">Shared plans</span></button>
        <button className={`nav-item ${tab==="calendar"?"active":""}`} onClick={()=>setTab("calendar")}><IconCal/><span className="nlabel">Calendar</span></button>
        <button className={`nav-item ${tab==="profile"?"active":""}`} onClick={()=>setTab("profile")}><IconUser/><span className="nlabel">Profile</span></button>
      </div>

      {tourOpen && tourIntro && (
        <div className="tour-intro">
          <div className="tour-intro-card">
            <div className="tour-intro-icon">🧭</div>
            <div className="tour-kicker">Quick guided tour</div>
            <div className="tour-title" style={{fontSize:24}}>Let’s see how who’s in works.</div>
            <div className="tour-copy">We’ll quickly show you how to create, share, respond, nudge, and find plans on the map.</div>
            <div className="tour-actions">
              <button className="tour-skip" onClick={finishWalkthrough}>Not now</button>
              <button className="primary-btn accent" onClick={()=>setTourIntro(false)}>Start walkthrough</button>
            </div>
          </div>
        </div>
      )}
      {tourOpen && !tourIntro && (()=>{
        const step=tourSteps[tourStep];
        const target=step && step.target ? document.querySelector(`[data-tour="${step.target}"]`) : null;
        let rect=null;
        if(target){ const r=target.getBoundingClientRect(); rect={top:Math.max(8,r.top-7),left:Math.max(8,r.left-7),width:Math.min(window.innerWidth-16,r.width+14),height:Math.min(window.innerHeight-16,r.height+14)}; }
        let tipStyle={};
        if(rect){
          const below=rect.top+rect.height+170 < window.innerHeight;
          tipStyle={left:14, right:14, top:below?rect.top+rect.height+14:Math.max(14,rect.top-185)};
          if(window.innerWidth>560){
            tipStyle={width:350, left:Math.min(Math.max(16,rect.left),window.innerWidth-366), top:below?rect.top+rect.height+14:Math.max(14,rect.top-185)};
          }
        }
        return <div className={`tour-layer ${!rect?"tour-no-target":""}`}>
          {rect && <div className="tour-spotlight" style={rect}/>} 
          <div className="tour-tooltip" style={tipStyle}>
            <div className="tour-kicker">App walkthrough · {tourStep+1} / {tourSteps.length}</div>
            <div className="tour-title">{step.title}</div>
            <div className="tour-copy">{step.body}</div>
            <div className="tour-actions">
              {tourStep>0 && <button className="tour-skip" onClick={prevTourStep}>Back</button>}
              <button className="primary-btn accent" onClick={nextTourStep}>{tourStep===tourSteps.length-1?"Finish":"Next"}</button>
              <button className="tour-skip" onClick={finishWalkthrough}>Exit</button>
            </div>
            <div className="tour-progress">{tourSteps.map((_,i)=><i key={i} className={i<=tourStep?"on":""}/>)}</div>
          </div>
        </div>;
      })()}
      {db && openPlanId && db.plans[openPlanId] && (<><div className="scrim" onClick={closePlan}/><PlanDetail db={db} planId={openPlanId} onClose={closePlan} dispatch={dispatch} openDayOf={openDayOf}/></>)}
      {db && dayOfId && db.plans[dayOfId] && (
        <div style={{position:"fixed", inset:0, zIndex:60, maxWidth:520, margin:"0 auto", left:0, right:0}}>
          <DayOfScreen db={db} planId={dayOfId} onClose={closeDayOf} dispatch={dispatch}/>
        </div>
      )}
      {db && newPlanOpen && (<><div className="scrim" onClick={()=>{ setNewPlanOpen(false); setPrefillSourceLink(null); setPrefillDate(null); }}/><NewPlanSheet db={db} onClose={()=>{ setNewPlanOpen(false); setPrefillSourceLink(null); setPrefillDate(null); }} dispatch={dispatch} initialSourceLink={prefillSourceLink} initialDate={prefillDate}/></>)}
      {db && newGroupOpen && (<><div className="scrim" onClick={()=>setNewGroupOpen(false)}/><NewGroupSheet db={db} onClose={()=>setNewGroupOpen(false)} dispatch={dispatch}/></>)}
      {db && openGroupId && db.groups[openGroupId] && (<><div className="scrim" onClick={()=>setOpenGroupId(null)}/><GroupDetailSheet db={db} groupId={openGroupId} onClose={()=>setOpenGroupId(null)} dispatch={dispatch}/></>)}

      {db && showUninterested && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={()=>setShowUninterested(false)}><IconClose/></button>
          <SimplePlanListScreen db={db} plans={Object.values(db.plans).filter(isPutAsideForMe).sort((a,b)=>putAsideAt(b)-putAsideAt(a))}
            title="Put aside" sub="nothing's deleted — drag it back whenever" emptyEmoji="🧺" emptyTitle="Nothing set aside" emptySub="Everything you're part of is still alive and kicking."
            showRestore dispatch={dispatch} onOpen={openPlan}/>
        </div>
      )}
      {db && showHistory && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={()=>setShowHistory(false)}><IconClose/></button>
          <SimplePlanListScreen db={db} plans={Object.values(db.plans).filter(p=>p.state==="happened").sort((a,b)=>b.dateTime-a.dateTime)}
            title="Plan history" sub="everything you've actually done" emptyEmoji="📖" emptyTitle="No history yet" emptySub="Plans move here once they've happened."
            showRestore={false} dispatch={dispatch} onOpen={openPlan}/>
        </div>
      )}
      {db && showNotifications && (
        <div style={{position:"fixed", inset:0, zIndex:55, maxWidth:520, margin:"0 auto", left:0, right:0, background:"var(--bg)", overflowY:"auto"}}>
          <button className="icon-btn" style={{position:"absolute", top:20, right:20, zIndex:5}} onClick={closeNotifications}><IconClose/></button>
          <NotificationsScreen db={db} onOpen={openPlan} dispatch={dispatch}/>
        </div>
      )}

      <Toast toast={toast} onDismiss={()=>setToast(null)}/>
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
