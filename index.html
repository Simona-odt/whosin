<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>who's in?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F6F4EF;
  --surface:#FFFFFF;
  --text:#17140F;
  --text-soft:#726F6A;
  --line: rgba(20,20,20,0.09);
  --accent-ink:#141414;
  --c-coral:#F2745E;
  --c-amber:#F3B94D;
  --c-olive:#C3D65C;
  --c-lavender:#ACA2EA;
  --c-mint:#8FD6C0;
  --c-sky:#8CC1EA;
  --c-rose:#EA9AB2;
  --c-teal:#6FC3B4;
  --danger:#E1573E;
  --muted:#9A968F;
  --chrome:#141414;
  --chrome-text:#F5F3EE;
  --chrome-soft:#77746D;
  --radius-card:28px;
  --radius-sm:16px;
  --font-ui:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1E1E1E; --text:#F2F0EA; --text-soft:#A5A19B; --line: rgba(255,255,255,0.09);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1E1E1E; --text:#F2F0EA; --text-soft:#A5A19B; --line: rgba(255,255,255,0.09);
  color-scheme: dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text); font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased; overflow-x:hidden; min-height:100vh;
  font-feature-settings:"tnum" 1;
}
#root{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg); display:flex; flex-direction:column;}
.main-content{flex:1 0 auto; display:flex; flex-direction:column;}
.main-content > *{flex:1 0 auto;}
button{font-family:inherit;}
::selection{background:var(--c-amber);color:var(--accent-ink);}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important;}}
.hscroll{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}
h1,h2,h3,h4,p{margin:0;}
input,textarea{font-family:inherit;}
.qmark, .excl{color:var(--c-coral);}

/* ============ HEADER ============ */
.app-header{
  position:sticky; top:0; z-index:30; background:var(--bg);
  padding:26px 24px 16px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid transparent; transition:border-color .2s ease;
}
.app-header.scrolled{border-color:var(--line);}
.brand{font-weight:700; font-size:19px; letter-spacing:-0.01em; color:var(--text);}
.header-icons{display:flex; gap:10px; align-items:center;}
.icon-btn{
  width:42px;height:42px;border-radius:50%; border:none; background:var(--surface);
  display:flex;align-items:center;justify-content:center; cursor:pointer; position:relative; color:var(--text); flex:none;
  transition:opacity .1s ease;
}
.icon-btn:active{opacity:.6;}
.badge-dot{position:absolute; top:2px; right:3px; width:9px;height:9px;border-radius:50%; background:var(--c-coral); border:2px solid var(--bg);}
.icon-btn.has-unread{background:rgba(242,116,94,0.18); color:var(--c-coral);}
.icon-btn.bell-wiggle{animation:bellWiggle .5s ease;}
@keyframes bellWiggle{0%,100%{transform:rotate(0);} 20%{transform:rotate(-16deg);} 40%{transform:rotate(14deg);} 60%{transform:rotate(-10deg);} 80%{transform:rotate(6deg);}}

.notif-toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:90;
  width:calc(100% - 48px); max-width:472px; background:var(--chrome); color:var(--chrome-text);
  border-radius:18px; padding:14px 16px; display:flex; align-items:center; gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); animation:notifIn .25s cubic-bezier(.2,.8,.2,1);
  cursor:pointer;
}
@keyframes notifIn{from{opacity:0; transform:translateX(-50%) translateY(-16px);} to{opacity:1; transform:translateX(-50%) translateY(0);}}
.notif-toast .nt-emoji{font-size:18px; flex:none;}
.notif-toast .nt-text{font-size:13px; font-weight:600; line-height:1.4;}

/* ============ SECTIONS ============ */
.section{padding:32px 24px 4px;}
.section-title{font-size:20px; font-weight:700; margin:0 0 5px 0; color:var(--text); letter-spacing:-0.01em;}
.section-sub{font-size:14px; color:var(--text-soft); margin:0 0 20px 0; font-weight:500;}
.hairline{height:1px; background:var(--line); margin:8px 24px 0;}

/* ============ TODAY / IN THE WORKS ROW ============ */
.works-row{display:flex; gap:16px; padding:2px 24px 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
.works-row::-webkit-scrollbar{display:none;}
.works-card{
  flex:none; width:196px; border-radius:26px; padding:20px; color:var(--text);
  background:var(--surface);
  position:relative; overflow:hidden; cursor:pointer; min-height:164px;
  display:flex; flex-direction:column; justify-content:space-between; transition:opacity .1s ease;
}
.works-card:active{opacity:.85;}
.works-card .glyph{position:absolute; right:-10px; bottom:-16px; font-size:78px; opacity:0.5; line-height:1;}
.works-card .p-title{font-weight:700; font-size:16px; line-height:1.25; position:relative; z-index:1;}
.works-card .p-when{font-size:12.5px; opacity:0.75; font-weight:600; margin-top:8px; position:relative; z-index:1;}
.works-card .p-status{font-size:11.5px; font-weight:700; margin-top:12px; position:relative; z-index:1; background:rgba(128,128,128,0.22); padding:6px 11px; border-radius:20px; align-self:flex-start;}
.works-card.today-card{background:linear-gradient(135deg, var(--c-amber), var(--c-coral)) !important; color:var(--accent-ink);}
.works-card.today-card .p-status{background:rgba(20,20,20,0.22); color:var(--accent-ink);}
.works-card .p-date-badge{display:inline-block; margin-bottom:8px; font-size:11px; font-weight:800; background:rgba(128,128,128,0.25); padding:4px 10px; border-radius:20px; position:relative; z-index:1; align-self:flex-start;}
.works-card.new-arrival{animation:cardPop .6s cubic-bezier(.2,.8,.2,1);}
@keyframes cardPop{0%{transform:scale(0.85); box-shadow:0 0 0 0 rgba(243,185,77,0);} 60%{transform:scale(1.04); box-shadow:0 0 0 14px rgba(243,185,77,0.25);} 100%{transform:scale(1); box-shadow:0 0 0 0 rgba(243,185,77,0);}}

/* ============ FEED CARD (unified list) ============ */
.pool-label{font-size:13.5px; font-weight:700; color:var(--text); padding:20px 24px 12px;}
.plan-list{padding:0 24px; display:flex; flex-direction:column; gap:18px;}
.feed-card{background:var(--surface); border-radius:var(--radius-card); overflow:hidden; cursor:pointer; position:relative; transition:opacity .1s ease;}
.feed-card:active{opacity:.9;}
.feed-card.muted{opacity:.45;}
.feed-card .fc-hero{height:112px; position:relative; display:flex; align-items:flex-start; justify-content:space-between; padding:14px 16px; color:var(--accent-ink);}
.feed-card .fc-hero .dg{position:absolute; right:-6px; bottom:-16px; font-size:80px; opacity:0.32;}
.feed-card .fc-chip{font-size:11px; font-weight:700; background:rgba(20,20,20,0.15); padding:5px 10px; border-radius:20px; position:relative; z-index:1;}
.feed-card .fc-pin{font-size:13px; position:relative; z-index:1;}
.feed-card .unseen-flag{font-size:10px; font-weight:700; background:var(--chrome); color:var(--chrome-text); padding:5px 9px; border-radius:20px; position:relative; z-index:1;}
.feed-card .fc-body{padding:16px 18px 18px;}
.feed-card .fc-title{font-weight:700; font-size:16px; color:var(--text); line-height:1.3; margin-bottom:5px;}
.feed-card .fc-meta{font-size:12.5px; color:var(--text-soft); font-weight:500;}
.feed-card .fc-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.resp-tag{font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px;}
.resp-tag.yes{background:var(--c-olive); color:var(--accent-ink);}
.resp-tag.yesbut{background:var(--c-sky); color:var(--accent-ink);}
.reason-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; background:var(--bg); padding:4px 10px; border-radius:20px; color:var(--text-soft);}
.feed-card .fc-foot{display:flex; align-items:center; justify-content:space-between; margin-top:12px;}
.avatars{display:flex; align-items:center;}
.avatar{width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700; border:2px solid var(--surface); margin-left:-9px; flex:none;}
.avatar:first-child{margin-left:0;}
.avatar-plus{background:var(--bg); color:var(--text-soft); border:2px solid var(--surface);}

/* ============ EMPTY / LOADING ============ */
.empty-state{padding:60px 32px; text-align:center;}
.empty-state .em-emoji{font-size:38px; margin-bottom:16px;}
.empty-state h3{font-size:17px; font-weight:700; margin:0 0 8px;}
.empty-state p{font-size:14px; color:var(--text-soft); max-width:260px; margin:0 auto; font-weight:500;}
.skeleton{background:linear-gradient(90deg, var(--line) 25%, transparent 37%, var(--line) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:24px;}
@keyframes shimmer{0%{background-position:100% 0} 100%{background-position:0 0}}

/* ============ BOTTOM NAV / FAB ============ */
.bottom-nav{position:sticky; bottom:0; left:0; right:0; z-index:40; background:var(--chrome); display:flex; padding:12px 8px calc(env(safe-area-inset-bottom,0px) + 12px); padding-top:14px;}
.nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; color:var(--chrome-soft); cursor:pointer; padding:4px 2px;}
.nav-item.active{color:var(--c-amber);}
.nav-item .nlabel{font-size:10.5px; font-weight:600;}
.fab{position:fixed; z-index:35; right:calc(50% - 260px + 24px); bottom:96px; width:58px; height:58px; border-radius:50%; background:var(--c-amber); color:var(--accent-ink); border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 20px rgba(0,0,0,0.18); cursor:pointer; font-size:26px; font-weight:400; line-height:1;}
@media (max-width:600px){ .fab{ right:24px; } }
.fab:active{opacity:.85;}

/* ============ SHEET / MODAL ============ */
.scrim{position:fixed; inset:0; background:rgba(10,10,10,0.5); z-index:50; opacity:0; animation:scrimIn .2s ease forwards;}
@keyframes scrimIn{to{opacity:1}}
.sheet{position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:51; width:100%; max-width:520px; max-height:92vh; background:var(--bg); border-radius:32px 32px 0 0; overflow:hidden; display:flex; flex-direction:column; animation:sheetUp .25s cubic-bezier(.2,.8,.2,1) forwards; box-shadow:0 -8px 30px rgba(0,0,0,0.18);}
@keyframes sheetUp{from{transform:translateX(-50%) translateY(100%)} to{transform:translateX(-50%) translateY(0)}}
.sheet-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch;}
.sheet-handle{width:40px;height:4px;border-radius:4px;background:var(--line); margin:12px auto 2px;}
.sheet-close{position:absolute; top:18px; right:18px; width:36px;height:36px;border-radius:50%; background:rgba(20,20,20,0.32); backdrop-filter:blur(6px); color:#fff; border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:5;}
.pin-toggle{position:absolute; top:18px; left:18px; width:36px;height:36px;border-radius:50%; background:rgba(20,20,20,0.32); backdrop-filter:blur(6px); color:#fff; border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; z-index:5;}
.pin-toggle.on{background:var(--c-amber); color:var(--accent-ink);}
.fullscreen{position:relative; min-height:100vh; background:var(--bg); animation:fadeIn .16s ease;}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}

/* ============ PLAN HERO ============ */
.plan-hero{min-height:210px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:24px; color:var(--accent-ink); overflow:hidden;}
.plan-hero .glyph-big{position:absolute; right:-16px; top:-16px; font-size:150px; opacity:0.3;}
.plan-hero .hcat{font-size:12px; font-weight:700; opacity:0.75; background:rgba(20,20,20,0.14); display:inline-block; padding:5px 10px; border-radius:20px; position:relative; z-index:1;}
.plan-hero .htitle{font-weight:700; font-size:23px; line-height:1.2; margin-top:12px; letter-spacing:-0.01em; position:relative; z-index:1;}
.notch-dot{position:relative; z-index:2; width:26px; height:26px; border-radius:50%; background:var(--bg); margin:-13px auto 0;}

.plan-body{padding:22px 24px 16px;}
.meta-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.meta-list{display:flex; flex-direction:column; gap:14px; margin:4px 0 20px; flex:1;}
.meta-row{display:flex; align-items:center; gap:14px; font-size:14.5px; color:var(--text); font-weight:500;}
.meta-row .mi{width:20px; text-align:center; flex:none; opacity:0.7; display:flex; align-items:center; justify-content:center;}
.meta-row b{font-weight:700;}
.pencil-btn{width:34px;height:34px;border-radius:50%; background:var(--surface); border:none; display:flex;align-items:center;justify-content:center; cursor:pointer; flex:none;}
.pencil-btn:active{opacity:.7;}

.status-banner{border-radius:18px; padding:16px 18px; display:flex; align-items:center; gap:12px; margin-bottom:18px;}
.status-banner .sb-title{font-weight:700; font-size:15px;}
.status-banner .sb-sub{font-size:12.5px; opacity:0.85; margin-top:3px; font-weight:500;}

.note-box{background:var(--surface); border-radius:18px; padding:14px 16px; font-size:13.5px; color:var(--text); margin-bottom:18px; font-weight:500; line-height:1.5;}
.section-mini-title{font-size:13px; font-weight:700; color:var(--text); margin:22px 0 12px;}

.people-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.people-summary{font-size:14.5px; font-weight:600;}
.people-avatars{display:flex; flex-direction:column; gap:4px; margin-top:12px;}
.person-chip-wrap{border-radius:14px; overflow:hidden;}
.person-chip{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:500; color:var(--text); padding:8px 6px; cursor:pointer; border-radius:14px; background:none; border:none; width:100%; text-align:left;}
.person-chip:active{background:var(--surface);}
.person-chip .sm-av{width:26px;height:26px;border-radius:50%; display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700; flex:none;}
.person-chip .pc-note{color:var(--text-soft); font-style:normal;}
.role-tag{font-size:10.5px; font-weight:700; color:var(--c-lavender); margin-left:4px;}
.person-actions{padding:2px 6px 12px 42px; display:flex; gap:8px; flex-wrap:wrap;}
.nudge-row{margin-top:6px;}
.poke-mini{background:var(--c-amber); color:var(--accent-ink); border:none; border-radius:14px; padding:6px 12px; font-size:11.5px; font-weight:700; cursor:pointer; flex:none; white-space:nowrap;}
.poke-mini:active{opacity:.8;}
.nudge-btn{width:100%; background:var(--c-amber); color:var(--accent-ink); border:none; border-radius:18px; font-weight:700; font-size:13.5px; padding:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
.nudge-btn:active{opacity:.8;}

/* ============ RESPONSE ============ */
.resp-block{background:rgba(243,185,77,0.14); border-radius:22px; padding:18px; margin:18px 0;}
.resp-summary{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.resp-summary .rs-text{font-size:14.5px; font-weight:600;}
.resp-summary .rs-note{font-size:12.5px; color:var(--text-soft); margin-top:4px; font-weight:500;}
.resp-summary .rs-sub{margin-top:6px;}
.rs-link{background:none; border:none; color:var(--c-coral); font-size:12.5px; font-weight:700; cursor:pointer; padding:0;}
.resp-current .rc-label{font-size:12px; font-weight:600; color:var(--text-soft);}
.resp-buttons{display:flex; gap:10px; margin-top:14px;}
.resp-btn{flex:1; min-width:0; border-radius:18px; border:none; background:var(--bg); padding:14px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; font-weight:600; font-size:12px; color:var(--text); white-space:nowrap;}
.resp-btn .rb-emoji{font-size:19px;}
.resp-btn:active{opacity:.8;}
.resp-btn.selected.yes{background:var(--c-olive); color:var(--accent-ink);}
.resp-btn.selected.yesbut{background:var(--c-amber); color:var(--accent-ink);}
.resp-btn.selected.no{background:var(--chrome); color:var(--chrome-text);}
.yesbut-field{margin-top:14px;}
.yesbut-field textarea{width:100%; border-radius:16px; border:none; background:var(--bg); padding:13px 15px; font-size:13.5px; color:var(--text); resize:none; min-height:50px; font-family:inherit;}
.yesbut-field textarea:focus{outline:2px solid var(--c-amber);}
.yesbut-hint{font-size:11.5px; color:var(--text-soft); margin-top:6px; font-weight:500;}
.backout-link{margin-top:16px; text-align:center; font-size:13px; font-weight:600; color:var(--c-coral); background:none; border:none; cursor:pointer; width:100%; padding:6px;}

.primary-btn{width:100%; background:var(--chrome); color:var(--chrome-text); border:none; border-radius:20px; padding:16px; font-weight:600; font-size:14.5px; cursor:pointer; margin-top:8px;}
.primary-btn:active{opacity:.85;}
.primary-btn.ghost{background:var(--surface); color:var(--text);}
.primary-btn.accent{background:var(--c-amber); color:var(--accent-ink);}
.primary-btn.danger{background:var(--c-coral); color:var(--accent-ink);}
.primary-btn:disabled{opacity:.4; cursor:not-allowed;}
.small-btn{background:var(--bg); border:none; border-radius:14px; padding:10px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text);}
.small-btn.accent{background:var(--c-amber); color:var(--accent-ink);}

.hype-note-btn{width:100%; text-align:left; background:var(--surface); border:none; border-radius:16px; padding:13px 15px; font-size:13px; color:var(--text-soft); cursor:pointer; margin-top:8px; font-weight:500;}

/* ============ TOAST ============ */
.toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); z-index:80; background:var(--chrome); color:var(--chrome-text); padding:14px 18px; border-radius:20px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:16px; box-shadow:0 8px 24px rgba(0,0,0,0.25); max-width:calc(100% - 48px); animation:toastIn .2s cubic-bezier(.2,.8,.2,1);}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(10px)} to{opacity:1; transform:translateX(-50%) translateY(0)}}
.toast button{background:none; border:none; color:var(--c-amber); font-weight:700; font-size:13px; cursor:pointer; flex:none;}

/* ============ DAY-OF ============ */
.dayof-screen{min-height:100vh; display:flex; flex-direction:column;}
.dayof-hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:48px 34px; color:var(--accent-ink); position:relative;}
.dayof-hero .dglyph{font-size:56px; margin-bottom:20px;}
.dayof-hero h1{font-size:24px; font-weight:700; margin:0 0 10px; letter-spacing:-0.01em;}
.dayof-hero p{font-size:13.5px; opacity:0.8; margin:0; font-weight:500;}
.dayof-hero .countdown{font-size:12.5px; font-weight:700; margin-top:20px; background:rgba(20,20,20,0.14); padding:9px 18px; border-radius:20px;}
.dayof-actions{padding:26px 26px calc(env(safe-area-inset-bottom,0px) + 26px); background:var(--bg); display:flex; flex-direction:column; gap:12px;}
.dayof-reactions{display:flex; gap:12px; justify-content:center; margin-bottom:6px;}
.dayof-react{font-size:22px; background:var(--surface); border:none; width:54px;height:54px;border-radius:50%; display:flex;align-items:center;justify-content:center; cursor:pointer;}
.dayof-react.picked{background:var(--c-amber);}
.dayof-react.custom-input{padding:0;}
.custom-emoji-input{width:54px; height:54px; border-radius:50%; border:none; background:var(--surface); text-align:center; font-size:20px; font-family:inherit;}
.custom-emoji-input:focus{outline:2px solid var(--c-amber);}
.snap-btn{background:var(--chrome); color:var(--chrome-text); border:none; border-radius:20px; padding:14px; font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;}
.snap-strip{display:flex; gap:10px; justify-content:center; margin-top:4px; flex-wrap:wrap;}
.snap-photo{width:52px; height:68px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px;}
.quiet-out{text-align:center; font-size:13px; color:var(--text-soft); background:none; border:none; cursor:pointer; padding:6px; font-weight:500;}

/* ============ FALLBACK ============ */
.fallback-card{background:var(--c-lavender); color:var(--accent-ink); border-radius:20px; padding:18px; margin:18px 0;}
.fallback-card .fb-eyebrow{font-size:11px; font-weight:700; opacity:0.8;}
.fallback-card h4{font-size:16.5px; margin:8px 0 6px; font-weight:700;}

function seedEmpty(){

}

function planMembers(db, plan){
  const g = db.groups[plan.groupId];
  let ids = g ? [...g.memberIds] : [];
  (plan.extraGroupIds||[]).forEach(gid=>{ if(db.groups[gid]) ids.push(...db.groups[gid].memberIds); });
  ids.push(...(plan.extraMemberIds||[]));
  return Array.from(new Set(ids));
}
function responseCounts(db, plan){
  const members = planMembers(db, plan);
  let yes=0, yesBut=0, no=0, pending=0, backedOut=0;
  members.forEach(id=>{
    const r = plan.responses[id];
    if(!r) pending++;
    else if(r.type==="yes") yes++;
    else if(r.type==="yes_but") yesBut++;
    else if(r.type==="no") no++;
    else if(r.type==="backed_out") backedOut++;
  });
  return {yes, yesBut, no, pending, backedOut, total: members.length, in: yes+yesBut};
}
function isSameDay(ts, ref){
  const a = new Date(ts), b = new Date(ref===undefined?now():ref);
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function fmtWhen(ts){
  const d = new Date(ts);
  const diffDays = Math.round((ts - new Date().setHours(0,0,0,0)) / DAY);
  const time = d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit", hour12:true});
  const weekday = d.toLocaleDateString([], {weekday:"short"});
  const monthDay = d.toLocaleDateString([], {month:"short", day:"numeric"});
  let dateLabel;
  if(diffDays===0) dateLabel = `Today (${weekday})`;
  else if(diffDays===1) dateLabel = `Tomorrow (${weekday})`;
  else if(diffDays===-1) dateLabel = `Yesterday (${weekday})`;
  else dateLabel = `${weekday}, ${monthDay}`;
  return `${dateLabel} · ${time}`;
}
function fmtDateOnly(ts){ return new Date(ts).toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}); }
function fmtTimeOnly(ts){ return new Date(ts).toLocaleTimeString([], {hour:"numeric", minute:"2-digit", hour12:true}); }
function timeAgo(ts){
  const diff = now() - ts;
  if(diff < 60000) return "just now";
  if(diff < HOUR) return Math.round(diff/60000)+"m ago";
  if(diff < DAY) return Math.round(diff/HOUR)+"h ago";
  return Math.round(diff/DAY)+"d ago";
}
function initials(name){ return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function isPlanner(plan, userId){ return (plan.plannerIds||[]).includes(userId); }
function plannerTagFor(plan){ return (plan.plannerIds||[]).length>1 ? "co-planner" : "planner"; }

// Put-aside is PERSONAL: my own "no" or "backed out" hides a plan from my
// view without touching the shared plan for everyone else in the group.
function isPutAsideForMe(plan){
  const mine = plan.responses[ME];
  return !!mine && (mine.type==="no" || mine.type==="backed_out");
}
function putAsideReason(plan){
  const mine = plan.responses[ME];
  if(!mine) return null;
  if(mine.type==="no") return "you said no";
  if(mine.type==="backed_out") return "you backed out";
  return null;
}
function putAsideAt(plan){ const mine = plan.responses[ME]; return mine ? mine.ts : plan.createdAt; }

function displayStatus(db, plan){

  if(plan.state==="at_risk") return STATUS_META.at_risk;

  return STATUS_META.gathering;

function LoginScreen({onLogin}){
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");

  function submit(e){
    if(e && e.preventDefault) e.preventDefault();
    const key = username.trim().toLowerCase();
    const cred = CREDENTIALS[key];
    if(cred && cred.password===password){
      setError("");
      onLogin(cred.userId);
    } else {
      setError("That username or password doesn't match.");
    }
  }

  return (
    <div className="login-screen">
      <div className="login-brand">who's in<span className="qmark">?</span></div>
      <div className="login-sub">sign in to see what the group's planning</div>
      <div className="login-field"><label className="form-label">Username</label>
        <input className="form-input" autoCapitalize="none" autoCorrect="off" value={username} onChange={e=>setUsername(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/>
      </div>
      <div className="login-field"><label className="form-label">Password</label>
        <input className="form-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") submit(); }}/>
      </div>
      {error && <div className="login-error">{error}</div>}
      <button className="primary-btn accent" onClick={submit}>Sign in</button>
    </div>
  );
}

function FeedCard({db, plan, onOpen, muted, variant, weekBadge, isNew}){
  const activity = db.activities[plan.activityId];
  const group = db.groups[plan.groupId];
  const status = displayStatus(db, plan);
  const color = catColor(activity.category);
  const counts = responseCounts(db, plan);
  const memberIds = planMembers(db, plan).filter(id => plan.responses[id] && ["yes","yes_but"].includes(plan.responses[id].type));
  const mine = plan.responses[ME];
  const isToday = isSameDay(plan.dateTime);

  if(variant==="works"){
    const dateLabel = isToday ? "Today" : new Date(plan.dateTime).toLocaleDateString([], {weekday:"short", day:"numeric"});
    return (
      <div className={`works-card ${isToday?"today-card":""} ${isNew?"new-arrival":""}`} onClick={()=>onOpen(plan.id)}>
        <span className="glyph">{catGlyph(activity.category)}</span>
        <div>
          {weekBadge && <span className="p-date-badge">{dateLabel}</span>}
          <div className="p-title">{activity.title}</div>
          <div className="p-when">{fmtWhen(plan.dateTime)}</div>
        </div>
        <div className="p-status">{isToday && plan.finalized ? "🎉 Tap to check in" : status.label}</div>
      </div>
    );
  }

  return (
    <div className={`feed-card ${muted?"muted":""}`} onClick={()=>onOpen(plan.id)}>
      <div className="fc-hero" style={{background:color}}>
        <span>{plan.pinnedToTop && <span className="fc-pin">📌</span>}{!plan.seenByMe && <span className="unseen-flag">NEW</span>}</span>
        <span className="fc-chip">{status.label}</span>
        <span className="dg">{catGlyph(activity.category)}</span>
      </div>
      <div className="fc-body">
        <div className="fc-title">{activity.title}</div>
        <div className="fc-meta">{group?group.emoji:"👥"} {group?group.name:"Group"} · {fmtWhen(plan.dateTime)}</div>
        {(mine || isPutAsideForMe(plan)) && (
          <div className="fc-tags">
            {mine && mine.type==="yes" && <span className="resp-tag yes">✅ You're in</span>}
            {mine && mine.type==="yes_but" && <span className="resp-tag yesbut">🤏 Yes, but</span>}
            {isPutAsideForMe(plan) && <span className="reason-tag">{putAsideReason(plan)}</span>}
          </div>
        )}
        <div className="fc-foot">
          <AvatarStack db={db} ids={memberIds.length?memberIds:planMembers(db,plan).slice(0,3)} max={3}/>
        </div>
      </div>
    </div>
  );
}

const MAP_POS = {a_rolling:[70,30], a_hike:[20,20], a_taco:[45,55], a_movie:[55,40], a_bonfire:[25,70], a_trivia:[65,62], a_karaoke:[80,50], a_pottery:[35,35], a_market:[50,75]};

function feedSortKey(p){
  if(p.pinnedToTop) return 0;
  if(p.state==="needs_nudge") return 1;
  if(!p.responses[ME]) return 2;
  return 3;
}

function isThisWeek(ts){ const s = startOfWeek(new Date()).getTime(); return ts>=s && ts<s+7*DAY; }

function HomeScreen({db, onOpen, openDayOf, loading}){
  const [seenWorks, setSeenWorks] = useState(()=>{ try{ return JSON.parse(safeGet("planit.seenWorks")||"[]"); }catch(e){ return []; } });
  const [justArrived, setJustArrived] = useState([]);
  const prevNegotiatingRef = useRef(null);

  const plans = db ? Object.values(db.plans) : [];
  const active = plans.filter(p => p.state!=="happened" && !isPutAsideForMe(p));
  const asideList = plans.filter(p => isPutAsideForMe(p));
  const weekPlans = active.filter(p => isThisWeek(p.dateTime) && NEGOTIATING_STATES.includes(p.state)).sort((a,b)=>a.dateTime-b.dateTime);
  const negotiating = active.filter(p => NEGOTIATING_STATES.includes(p.state) && !weekPlans.includes(p));
  const negotiatingKey = negotiating.map(p=>p.id).join(",");

  useEffect(()=>{
    if(!db) return;
    const ids = negotiating.map(p=>p.id);
    if(prevNegotiatingRef.current === null){
      // First mount: just establish the baseline, nothing "arrives" yet.
      const updated = Array.from(new Set([...seenWorks, ...ids]));
      setSeenWorks(updated);
      safeSet("planit.seenWorks", JSON.stringify(updated));
    } else {
      const newOnes = ids.filter(id => !prevNegotiatingRef.current.includes(id) && !seenWorks.includes(id));
      if(newOnes.length>0){
        setJustArrived(j=>[...j, ...newOnes]);
        setTimeout(()=>{ setJustArrived(j=>j.filter(id=>!newOnes.includes(id))); }, 1600);
        const updated = [...seenWorks, ...newOnes];
        setSeenWorks(updated);
        safeSet("planit.seenWorks", JSON.stringify(updated));
      }
    }
    prevNegotiatingRef.current = ids;
    // eslint-disable-next-line
  }, [negotiatingKey, !!db]);

  if(loading || !db){
    return (
      <div className="section">
        <div className="skeleton" style={{height:160, marginBottom:20}}/>
        <div className="skeleton" style={{height:210, marginBottom:20}}/>
        <div className="skeleton" style={{height:210, marginBottom:20}}/>
      </div>
    );
  }

  function cardOpen(id){
    const p = db.plans[id];
    if(p && p.finalized && isSameDay(p.dateTime)) openDayOf(id); else onOpen(id);
  }

  return (
    <div style={{paddingBottom:12}}>
      {weekPlans.length>0 && (
        <>
          <div className="section" style={{paddingBottom:0}}>
            <h2 className="section-title">This week</h2>
          </div>
          <div className="works-row">
            {weekPlans.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen} variant="works" weekBadge/>)}
          </div>
        </>
      )}

      {negotiating.length>0 && (
        <>
          <div className="section" style={{paddingBottom:0}}>
            <h2 className="section-title">In the works</h2>
          </div>
          <div className="works-row">
            {negotiating.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen} variant="works" isNew={justArrived.includes(p.id)}/>)}
          </div>
        </>
      )}

      {plans.length===0 && (
        <div className="empty-state"><div className="em-emoji">👀</div><h3>Suspiciously empty</h3><p>Someone in your group is due for an idea. Could be you.</p></div>
      )}

      {asideList.length>0 && (
        <>
          <div className="hairline" style={{margin:"28px 24px 0"}}/>
          <div className="pool-group">
            <div className="pool-label" style={{paddingTop:24}}>Put aside</div>
            <div className="plan-list">{asideList.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={onOpen} muted/>)}</div>
          </div>
        </>
      )}
    </div>
  );
}

function AllPlansScreen({db, onOpen, openDayOf}){
  const [groupFilter, setGroupFilter] = useState([]);
  const [detailFilters, setDetailFilters] = useState([]);
  const [browseView, setBrowseView] = useState("list");
  const [showFilterPopup, setShowFilterPopup] = useState(false);

  const plans = Object.values(db.plans);
  const active = plans.filter(p => p.state!=="happened" && !isPutAsideForMe(p));
  const weekPlans = active.filter(p => isThisWeek(p.dateTime) && NEGOTIATING_STATES.includes(p.state));
  const negotiating = active.filter(p => NEGOTIATING_STATES.includes(p.state) && !weekPlans.includes(p));
  const rest = active.filter(p => !negotiating.includes(p) && !weekPlans.includes(p))
    .sort((a,b)=> feedSortKey(a)-feedSortKey(b) || a.dateTime-b.dateTime);

  function toggleGroupFilter(id){ setGroupFilter(a=> a.includes(id)? a.filter(x=>x!==id) : [...a, id]); }
  function toggleDetailFilter(id){ setDetailFilters(a=> a.includes(id)? a.filter(x=>x!==id) : [...a, id]); }

  const browsePlans = rest.filter(p=>{
    const a = db.activities[p.activityId];
    if(groupFilter.length>0){
      const inGroup = groupFilter.includes(p.groupId) || (p.extraGroupIds||[]).some(gid=>groupFilter.includes(gid));
      if(!inGroup) return false;
    }
    if(detailFilters.length>0 && !detailFilters.every(fid => FILTERS.find(f=>f.id===fid).test(a,p))) return false;
    return true;
  });

  function cardOpen(id){
    const p = db.plans[id];
    if(p && p.finalized && isSameDay(p.dateTime)) openDayOf(id); else onOpen(id);
  }

  return (
    <div style={{paddingBottom:12}}>
      <div className="section">
        <h2 className="section-title">All plans</h2>
      </div>
      <div className="chip-row-with-filter">
        <div className="chip-row" style={{padding:0}}>
          {Object.values(db.groups).map(g=>(<button key={g.id} className={`chip ${groupFilter.includes(g.id)?"active":""}`} onClick={()=>toggleGroupFilter(g.id)}>{g.emoji} {g.name}</button>))}
        </div>
        <button className={`filter-icon-btn ${detailFilters.length>0?"active":""}`} onClick={()=>setShowFilterPopup(true)} aria-label="More filters">
          <IconFilter/>{detailFilters.length>0 && <span className="filter-count">{detailFilters.length}</span>}
        </button>
      </div>
      <div className="map-toggle" style={{marginTop:16}}>
        <button className={browseView==="list"?"on":""} onClick={()=>setBrowseView("list")}>List</button>
        <button className={browseView==="map"?"on":""} onClick={()=>setBrowseView("map")}>Map</button>
      </div>
      {browseView==="list" ? (
        <div className="plan-list" style={{marginTop:16}}>
          {browsePlans.length===0 && <div className="empty-state"><div className="em-emoji">🔍</div><h3>Nothing matches that</h3><p>Loosen a filter — there's more out there.</p></div>}
          {browsePlans.map(p=><FeedCard key={p.id} db={db} plan={p} onOpen={cardOpen}/>)}
        </div>
      ) : (
        <div className="map-visual">
          {browsePlans.map(p=>{
            const group = db.groups[p.groupId];
            const gcolor = group ? group.color : GROUP_PALETTE[0];
            const pos = MAP_POS[p.activityId] || [50,50];
            return (
              <div className="map-pin" key={p.id} style={{left:pos[0]+"%", top:pos[1]+"%"}} onClick={()=>cardOpen(p.id)}>
                <div className="pin-dot" style={{background:gcolor}}><span>{group?group.name[0]:"?"}</span></div>
                <div className="pin-label">{db.activities[p.activityId].title}</div>
              </div>
            );
          })}
        </div>
      )}

      {showFilterPopup && (
        <>
          <div className="scrim" onClick={()=>setShowFilterPopup(false)}/>
          <div className="sheet" role="dialog" aria-modal="true">
            <div className="sheet-handle"/>
            <button className="sheet-close" onClick={()=>setShowFilterPopup(false)} style={{background:"rgba(20,20,20,0.5)"}}><IconClose/></button>
            <div className="sheet-scroll" style={{padding:"22px 24px 34px"}}>
              <h2 style={{fontSize:19, fontWeight:700, marginBottom:18}}>More filters</h2>
              <div className="form-field"><label className="form-label">Vibe</label>
                <div className="pill-select">
                  {FILTERS.filter(f=>f.id!=="tonight").map(f=>(<div key={f.id} className={`ps-opt ${detailFilters.includes(f.id)?"on":""}`} onClick={()=>toggleDetailFilter(f.id)}>{f.label}</div>))}
                </div>
              </div>
              <div className="form-field"><label className="form-label">Timing</label>
                <div className="pill-select">
                  <div className={`ps-opt ${detailFilters.includes("tonight")?"on":""}`} onClick={()=>toggleDetailFilter("tonight")}>Tonight</div>
                </div>
              </div>
              <div className="form-field"><label className="form-label">Distance</label>
                <p style={{fontSize:12.5, color:"var(--text-soft)", fontWeight:500, margin:0}}>Needs location access to filter by distance — not wired up in this demo yet.</p>
              </div>
              <button className="primary-btn ghost" onClick={()=>setDetailFilters([])}>Clear these filters</button>
              <button className="primary-btn accent" onClick={()=>setShowFilterPopup(false)}>Done</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ======================================================================
   RESPONSE SECTION
====================================================================== */
function ResponseSection({db, plan, dispatch, planId}){
  const mine = plan.responses[ME];
  const [editing, setEditing] = useState(!mine);
  const [draftType, setDraftType] = useState(mine && mine.type!=="backed_out" ? mine.type : null);
  const [draftNote, setDraftNote] = useState(mine && mine.type==="yes_but" ? (mine.note||"") : "");

  if(plan.state==="happened") return null;

  function commit(type, note){
    dispatch({type:"RESPOND", planId, userId:ME, response:{type, note:note||"", ts:now()}});
    setEditing(false);
  }
  function startEdit(){
    setDraftType(mine && mine.type!=="backed_out" ? mine.type : null);
    setDraftNote(mine && mine.type==="yes_but" ? (mine.note||"") : "");
    setEditing(true);
  }
  function backOut(){
    dispatch({type:"RESPOND", planId, userId:ME, response:{type:"backed_out", ts:now()}});
    dispatch({type:"TOAST", message:"Putting this one aside for now", onUndo:()=>dispatch({type:"RESPOND", planId, userId:ME, response:{type:"yes", ts:now()}})});
    setEditing(false);
  }

  if(!editing && mine){
    return (
      <div className="resp-block">
        <div className="resp-summary">
          <div>
            <div className="rs-text">{myResponseLabel(plan)}</div>
            {mine.type==="yes_but" && mine.note && <div className="rs-note">"{mine.note}"</div>}
            {mine.type==="backed_out" && (<div className="rs-sub"><button className="rs-link" onClick={()=>commit("yes","")}>Actually, I'm back in</button></div>)}
          </div>
          <button className="pencil-btn" onClick={startEdit} aria-label="Edit your response"><IconPencil/></button>
        </div>
      </div>
    );
  }

  return (
    <div className="resp-block">
      <div className="resp-current"><span className="rc-label">{mine ? "Change your response" : <Q text="What do you think?"/>}</span></div>
      <div className="resp-buttons">
        <button className={`resp-btn yes ${draftType==="yes"?"selected yes":""}`} onClick={()=>{ setDraftType("yes"); commit("yes",""); }}>
          <span className="rb-emoji">✅</span><Excl text="I'm in!"/>
        </button>
        <button className={`resp-btn yesbut ${draftType==="yes_but"?"selected yesbut":""}`} onClick={()=>setDraftType("yes_but")}>
          <span className="rb-emoji">🤏</span>Yes but…
        </button>
        <button className={`resp-btn no ${draftType==="no"?"selected no":""}`} onClick={()=>{ setDraftType("no"); commit("no",""); }}>
          <span className="rb-emoji">😔</span>No
        </button>
      </div>
      {draftType==="yes_but" && (
        <div className="yesbut-field">
          <textarea placeholder="What's the condition? “I'm in if we go after 7”" value={draftNote} onChange={e=>setDraftNote(e.target.value)} />
          <div className="yesbut-hint">{draftNote.trim() ? "Everyone in the group will see this" : "Add a quick note so they know your condition"}</div>
          <button className="primary-btn" style={{marginTop:10}} disabled={!draftNote.trim()} onClick={()=>commit("yes_but", draftNote.trim())}>Send response</button>
        </div>
      )}
      {mine && mine.type==="yes" && draftType!=="yes_but" && (<button className="backout-link" onClick={backOut}>I wanna back out</button>)}
      {mine && (<button className="rs-link" style={{marginTop:14, display:"block", marginLeft:"auto", marginRight:"auto"}} onClick={()=>setEditing(false)}>Cancel</button>)}
    </div>
  );
}

/* ======================================================================
   FALLBACK (with generate + editable text)
====================================================================== */
function fallbackCopy(activity){
  const smaller = {
    music:"Same crew, a laid-back gig night instead — lower cost, same energy.",
    food:"Same spot, just the ones still in — no need for a big table.",
    outdoors:"A shorter walk nearby instead of the full hike.",
    night:"Move it closer, keep it small — same vibe, less planning.",
    chill:"Push it to just the couch crew, same night.",
    water:"Smaller fire, closer spot, whoever's still down.",
    custom:"A smaller, closer version of the same plan.",
  };
  return smaller[activity.category] || smaller.custom;
}
const GENERATE_POOL = [
  "What if we just push it 2 hours later and see who's still around?",
  "Move it to whoever's place is closest and keep the guest list tight.",
  "Swap it for something 15 minutes away — same energy, way less friction.",
  "Cut it down to a smaller group dinner instead, same night.",
];
function FallbackCard({plan, activity, dispatch}){
  const [text, setText] = useState(fallbackCopy(activity));
  if(plan.fallbackSent){
    return (<div className="fallback-card"><div className="fb-eyebrow">Sent to the group</div><h4>Smaller plan proposed</h4><p style={{fontSize:13, fontWeight:500, opacity:.85}}>{plan.fallbackText || fallbackCopy(activity)}</p></div>);
  }
  return (
    <div className="fallback-card">
      <div className="fb-eyebrow">A few people can't make it</div>
      <h4>Want to try a smaller version?</h4>
      <button className="generate-btn" onClick={()=>setText(GENERATE_POOL[Math.floor(Math.random()*GENERATE_POOL.length)])}>
        <IconSparkle/> Suggest one for me
      </button>
      <textarea value={text} onChange={e=>setText(e.target.value)} />
      <div className="fb-actions">
        <button className="fb-yes" onClick={()=>{ dispatch({type:"SEND_FALLBACK", planId:plan.id, text}); dispatch({type:"TOAST", message:"Suggestion sent to the group"}); }}>Suggest it</button>
        <button className="fb-no" onClick={()=>dispatch({type:"DISMISS_FALLBACK", planId:plan.id})}>Not now</button>
      </div>
    </div>
  );
}

/* ======================================================================
   EDIT DETAILS (inline, pencil-triggered)
====================================================================== */
function EditDetailsForm({plan, activity, dispatch, onDone}){
  const [title, setTitle] = useState(activity.title);
  const [location, setLocation] = useState(activity.location);
  const [minPeople, setMinPeople] = useState(plan.minPeople);
  const [customMinOpen, setCustomMinOpen] = useState(false);
  const [priority, setPriority] = useState(plan.priority);
  const [note, setNote] = useState(plan.note || "");
  const [travelPlan, setTravelPlan] = useState(plan.groupTravelPlan || "");

  function save(){
    dispatch({type:"UPDATE_PLAN_DETAILS", planId:plan.id, title, location, minPeople, priority, note, travelPlan});
    dispatch({type:"TOAST", message:"Updated — the group's been notified"});
    onDone();
  }
  return (
    <div className="planner-box">
      <div className="form-field"><label className="form-label">Title</label><input className="form-input" value={title} onChange={e=>setTitle(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">Location</label><input className="form-input" value={location} onChange={e=>setLocation(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">Minimum people</label>
        <div className="pill-select">
          {[2,3,4,5,6].map(n=>(<div key={n} className={`ps-opt ${minPeople===n && !customMinOpen?"on":""}`} onClick={()=>{ setMinPeople(n); setCustomMinOpen(false); }}>{n}+</div>))}
          {!customMinOpen ? (
            <div className={`ps-opt ${![2,3,4,5,6].includes(minPeople)?"on":""}`} onClick={()=>setCustomMinOpen(true)}>{![2,3,4,5,6].includes(minPeople) ? `${minPeople}+ (custom)` : "+ custom"}</div>
          ) : (
            <input className="form-input" type="number" min="1" style={{maxWidth:90}} autoFocus value={minPeople}
              onChange={e=>setMinPeople(Math.max(1, parseInt(e.target.value)||1))} onBlur={()=>setCustomMinOpen(false)}/>
          )}
        </div>
      </div>
      <div className="form-field"><label className="form-label">Vibe</label><input className="form-input" value={priority} onChange={e=>setPriority(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">Hype line</label><textarea className="form-textarea" value={note} onChange={e=>setNote(e.target.value)}/></div>
      <div className="form-field"><label className="form-label">How's the group getting there? (optional)</label>
        <textarea className="form-textarea" placeholder="e.g. carpooling from Bandra, meet at the station…" value={travelPlan} onChange={e=>setTravelPlan(e.target.value)}/>
      </div>
      <TravelEstimate activity={{...activity, location}} plan={plan}/>
      <button className="primary-btn accent" style={{marginTop:14}} onClick={save}>Save changes</button>
      <button className="primary-btn ghost" onClick={onDone}>Cancel</button>
    </div>
  );
}

/* ======================================================================
   PLANNER BOX (suggestions gated to negotiation phase + coplanner requests)
====================================================================== */
function PlannerBox({db, plan, dispatch}){
  const [myNote, setMyNote] = useState((plan.suggestionNotes && plan.suggestionNotes[ME] && plan.suggestionNotes[ME].text) || "");
  const [sentNote, setSentNote] = useState((plan.suggestionNotes && plan.suggestionNotes[ME] && plan.suggestionNotes[ME].text) || "");
  const [editingNote, setEditingNote] = useState(!sentNote);
  const iPlan = isPlanner(plan, ME);
  const inNegotiation = NEGOTIATING_STATES.includes(plan.state);
  const suggestions = Object.entries(plan.suggestionNotes||{}).filter(([id])=>id!==ME);
  const requests = (plan.coplannerRequests||[]).filter(id=>!isPlanner(plan,id));

  if(!inNegotiation && !iPlan) return null;

  function send(){
    dispatch({type:"SUGGEST_NOTE", planId:plan.id, userId:ME, text:myNote.trim()});
    dispatch({type:"TOAST", message: iPlan? "Note saved" : "Sent to the plan-maker"});
    setSentNote(myNote.trim()); setEditingNote(false);
  }

  return (
    <>
      {inNegotiation && (
        <div className="planner-box">
          <div className="pb-title">💬 Suggestions &amp; notes</div>
          {iPlan && suggestions.length>0 && suggestions.map(([uid, s])=>(
            <div className="suggestion-row" key={uid}>
              <Avatar user={db.users[uid]} size={26}/>
              <div><div className="suggestion-text">{s.text}</div><div className="suggestion-author">{db.users[uid].name} · {timeAgo(s.ts)}</div></div>
            </div>
          ))}
          {iPlan && suggestions.length===0 && <p style={{fontSize:12.5, color:"var(--text-soft)", fontWeight:500, marginBottom:10}}>No suggestions from the group yet.</p>}

          {!editingNote ? (
            <div className="suggestion-row" style={{alignItems:"center"}}>
              <div style={{flex:1}}><div className="suggestion-text">"{sentNote}"</div><div className="suggestion-author">{iPlan?"Your note":"Sent to the plan-maker"}</div></div>
              <button className="pencil-btn" onClick={()=>{ setMyNote(sentNote); setEditingNote(true); }}><IconPencil/></button>
            </div>
          ) : (
            <div className="form-field" style={{marginTop:iPlan?12:0, marginBottom:0}}>
              <label className="form-label">{iPlan ? "Your own note" : "Suggest a change or leave a note"}</label>
              <textarea className="form-textarea" placeholder="e.g. can we push it 30 min later?" value={myNote} onChange={e=>setMyNote(e.target.value)}/>
              <button className="primary-btn ghost" style={{marginTop:10}} onClick={send} disabled={!myNote.trim()}>{iPlan?"Save note":"Send suggestion"}</button>
            </div>
          )}
        </div>
      )}

      {iPlan && requests.length>0 && (
        <div className="planner-box">
          <div className="pb-title">🙋 Wants to help plan</div>
          {requests.map(uid=>(
            <div className="request-row" key={uid}>
              <Avatar user={db.users[uid]} size={26}/>
              <span style={{flex:1, fontSize:13, fontWeight:600}}>{db.users[uid].name}</span>
              <button className="small-btn accent" onClick={()=>{ dispatch({type:"ADD_PLANNER", planId:plan.id, userId:uid}); dispatch({type:"TOAST", message:`${db.users[uid].name} is now a co-planner`}); }}>Approve</button>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

/* ======================================================================
   PERSON CHIP (click for ask/make co-planner)
====================================================================== */
function PersonRow({db, plan, userId, dispatch}){
  const u = db.users[userId];
  const [open, setOpen] = useState(false);
  if(!u) return null;
  const r = plan.responses[userId];
  let tag = "hasn't answered";
  if(r){
    if(r.type==="yes") tag = "yes"; else if(r.type==="yes_but") tag = "yes, but";
    else if(r.type==="no") tag = "no"; else if(r.type==="backed_out") tag = "backed out";
  }
  const amPlanner = isPlanner(plan, ME);
  const theyArePlanner = isPlanner(plan, userId);
  const alreadyRequested = (plan.coplannerRequests||[]).includes(ME);

  return (
    <div className="person-chip-wrap">
      <button className="person-chip" onClick={()=>setOpen(o=>!o)}>
        <span className="sm-av" style={{background:u.color, color:"var(--accent-ink)"}}>{initials(u.name)}</span>
        <span>{userId===ME?"You":u.name} · {tag}
          {r && r.type==="yes_but" && r.note && <span className="pc-note"> — "{r.note}"</span>}
          {theyArePlanner && <span className="role-tag">{plannerTagFor(plan)}</span>}
        </span>
      </button>
      {open && (
        <div className="person-actions">
          {userId===ME && !theyArePlanner && (
            alreadyRequested
              ? <span style={{fontSize:12, color:"var(--text-soft)", fontWeight:600}}>Request sent — waiting on the planner</span>
              : <button className="small-btn accent" onClick={()=>{ dispatch({type:"ASK_COPLANNER", planId:plan.id, userId:ME}); dispatch({type:"TOAST", message:"Asked to help plan this one"}); }}>Ask to be co-planner</button>
          )}
          {userId!==ME && amPlanner && !theyArePlanner && (
            <button className="small-btn accent" onClick={()=>{ dispatch({type:"ADD_PLANNER", planId:plan.id, userId}); dispatch({type:"TOAST", message:`${u.name} is now a co-planner`}); }}>Make {u.name} a planner</button>
          )}
          {(userId===ME && theyArePlanner) || (userId!==ME && (theyArePlanner || !amPlanner)) ? (
            <span style={{fontSize:12, color:"var(--text-soft)", fontWeight:500}}>{theyArePlanner ? `Already a ${plannerTagFor(plan)}` : "Nothing to do here"}</span>
          ) : null}
        </div>
      )}
    </div>
  );
}

/* ======================================================================
   GETTING THERE — a real Google Maps directions link. (The in-app AI
   estimate from the Claude-hosted version isn't available here — that
   capability only exists inside a Claude artifact page, not on a plain
   site. This needs no key and always works.)
====================================================================== */
function TravelEstimate({activity, plan}){
  const [origin, setOrigin] = useState(()=> safeGet("planit.lastOrigin") || "");

  function saveOrigin(v){ setOrigin(v); safeSet("planit.lastOrigin", v); }

  const mapsHref = "https://www.google.com/maps/dir/?api=1"
    + (origin.trim() ? "&origin=" + encodeURIComponent(origin.trim()) : "")
    + "&destination=" + encodeURIComponent(activity.location);

  return (
    <div className="travel-card">
      <div className="pb-title" style={{marginBottom:12}}>🧭 How will you get there?</div>
      <div className="travel-row">
        <input className="form-input" placeholder="Starting from…" value={origin} onChange={e=>saveOrigin(e.target.value)}/>
      </div>
      <a className="maps-link" href={mapsHref} target="_blank" rel="noopener noreferrer">🗺️ Open directions in Google Maps</a>
      <div className="travel-placeholder">
        <div className="tp-row"><span>Suggested mode</span><b>🚗 Cab / rideshare</b></div>
        <div className="tp-row"><span>Est. time</span><b>~20 min</b></div>
        <div className="tp-row"><span>Est. cost</span><b>~$12–18</b></div>
        <div className="tp-note">Placeholder numbers — hook up a real routing API for live estimates.</div>
      </div>
    </div>
  );
}


function PlanDetail({db, planId, onClose, dispatch, openDayOf}){
  const plan = db.plans[planId];
  const activity = db.activities[plan.activityId];
  const group = db.groups[plan.groupId];
  const status = displayStatus(db, plan);
  const counts = responseCounts(db, plan);
  const color = catColor(activity.category);
  const [editingDetails, setEditingDetails] = useState(false);
  const [meetTimeOpen, setMeetTimeOpen] = useState(false);
  const [meetTime, setMeetTime] = useState("");
  const [dragY, setDragY] = useState(0);
  const amPlanner = isPlanner(plan, ME);
  const scrollRef = useRef(null);
  const dragRef = useRef({startY:0, dragging:false});
  const dragDistRef = useRef(0);

  useEffect(()=>{ if(!plan.seenByMe) dispatch({type:"MARK_SEEN", planId}); }, []);

  const canShowFallback = plan.state==="at_risk";

  function onTouchStart(e){
    const scrollEl = scrollRef.current;
    if(!scrollEl || scrollEl.scrollTop > 2) return;
    dragRef.current = {startY: e.touches[0].clientY, dragging:true};
  }
  function onTouchMove(e){
    if(!dragRef.current.dragging) return;
    const dy = e.touches[0].clientY - dragRef.current.startY;
    if(dy > 0){ dragDistRef.current = dy; setDragY(dy); }
  }
  function onTouchEnd(){
    if(!dragRef.current.dragging) return;
    dragRef.current.dragging = false;
    if(dragDistRef.current > 110) onClose(); else setDragY(0);
    dragDistRef.current = 0;
  }

  return (
    <div className="sheet" role="dialog" aria-modal="true"
      style={dragY ? {transform:`translateX(-50%) translateY(${dragY}px)`, transition:"none"} : undefined}
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} onTouchCancel={onTouchEnd}>
      <div className="sheet-scroll" ref={scrollRef}>
        <div className="plan-hero" style={{background:color}}>
          <span className="glyph-big">{catGlyph(activity.category)}</span>
          <button className={`pin-toggle ${plan.pinnedToTop?"on":""}`} onClick={()=>dispatch({type:"TOGGLE_PIN", planId})} aria-label="Pin to top">
            <IconPin filled={plan.pinnedToTop}/>
          </button>
          <button className="sheet-close" onClick={onClose} aria-label="Close"><IconClose/></button>
          <div className="hcat">{group?group.emoji:"👥"} {group?group.name:"Group"}</div>
          <div className="htitle">{activity.title}</div>
        </div>
        <div className="notch-dot"/>

        <div className="plan-body">
          <div className="status-banner" style={{background:status.bg, color:"var(--accent-ink)"}}>
            <div className="sb-text">
              <div className="sb-title">{status.label}</div>
            </div>
          </div>

          {canShowFallback && <FallbackCard plan={plan} activity={activity} dispatch={dispatch}/>}

          {editingDetails ? (
            <EditDetailsForm plan={plan} activity={activity} dispatch={dispatch} onDone={()=>setEditingDetails(false)}/>
          ) : (
            <>
              <div className="meta-head">
                <span/>
                {amPlanner && plan.state!=="happened" && <button className="pencil-btn" onClick={()=>setEditingDetails(true)} aria-label="Edit details"><IconPencil/></button>}
              </div>
              <div className="meta-list">
                <div className="meta-row" style={{justifyContent:"space-between"}}>
                  <span style={{display:"flex", alignItems:"center", gap:14}}><span className="mi">🕐</span> <b>{fmtWhen(plan.dateTime)}</b></span>
                  {plan.state!=="happened" && counts.pending>0 && (
                    <button className="poke-mini" onClick={()=>{ dispatch({type:"NUDGE", planId}); dispatch({type:"TOAST", message:"Poked everyone who's still on the fence 👋"}); }}>👋 Poke</button>
                  )}
                </div>
                <div className="meta-row"><span className="mi">📍</span> {activity.location}</div>
                <div className="meta-row"><span className="mi"><IconTarget/></span>Need at least <b>{plan.minPeople}</b> people</div>
                <div className="meta-row"><span className="mi">✨</span> {plan.priority}</div>
                {plan.groupTravelPlan && <div className="meta-row"><span className="mi">🚗</span> {plan.groupTravelPlan}</div>}
              </div>
              <a className="maps-link" href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(activity.location)}`} target="_blank" rel="noopener noreferrer">🗺️ Get directions</a>
            </>
          )}

          {plan.note && !editingDetails && <div className="note-box">"{plan.note}"</div>}

          {plan.state!=="happened" && (
            <>
              <div style={{height:14}}/>
              <div className="people-row"><span className="people-summary">{counts.in} are in · waiting on {counts.pending}</span></div>
              <div className="people-avatars">
                {planMembers(db, plan).map(id=><PersonRow key={id} db={db} plan={plan} userId={id} dispatch={dispatch}/>)}
              </div>
            </>
          )}

          <ResponseSection db={db} plan={plan} dispatch={dispatch} planId={planId}/>


          {plan.state!=="happened" && <PlannerBox db={db} plan={plan} dispatch={dispatch}/>}

          {amPlanner && plan.state!=="happened" && (
            <div className="planner-box">
              <div className="pb-title">🧭 Planner tools</div>
              <div className="planner-actions">
                {plan.meetProposedTime && (
                  <div style={{fontSize:12.5, fontWeight:600, color:"var(--text-soft)", padding:"2px 2px 4px"}}>🤝 Meeting proposed: {plan.meetProposedTime}</div>
                )}
                {!meetTimeOpen ? (
                  <button className="primary-btn ghost" onClick={()=>setMeetTimeOpen(true)}>Let's meet in person to decide</button>
                ) : (
                  <div className="inline-add-row">
                    <input className="form-input" placeholder="When? e.g. Thu 7pm" value={meetTime} onChange={e=>setMeetTime(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter" && meetTime.trim()){ dispatch({type:"MEET_IN_PERSON", planId, proposedTime:meetTime.trim()}); dispatch({type:"TOAST", message:"Sent — let's meet in person to decide"}); setMeetTimeOpen(false); setMeetTime(""); } }}/>
                    <button className="small-btn accent" onClick={()=>{ dispatch({type:"MEET_IN_PERSON", planId, proposedTime:meetTime.trim()}); dispatch({type:"TOAST", message:"Sent — let's meet in person to decide"}); setMeetTimeOpen(false); setMeetTime(""); }}>Send</button>
                  </div>
                )}
                {!plan.finalized ? (
                  <button className="primary-btn accent" onClick={()=>{ dispatch({type:"FINALIZE", planId}); dispatch({type:"TOAST", message:"Finalized — added to everyone's calendar 📅"}); }}>Finalize plan</button>
                ) : (
                  <div style={{fontSize:12.5, fontWeight:600, color:"var(--text-soft)", padding:"6px 2px"}}>✅ Finalized — on everyone's calendar</div>
                )}
              </div>
            </div>
          )}

          {plan.state==="confirmed" && (<button className="primary-btn ghost" style={{marginTop:8}} onClick={()=>openDayOf(planId)}>Preview day-of check (demo)</button>)}

          {isPutAsideForMe(plan) && (
            <div style={{marginTop:14}}><p style={{fontSize:13, color:"var(--text-soft)", fontWeight:500}}>Put aside {timeAgo(putAsideAt(plan))} — {putAsideReason(plan)}. Change your response above anytime to bring it back.</p></div>
          )}
          {plan.state==="happened" && (
            <div style={{marginTop:14, fontSize:13.5, color:"var(--text-soft)", fontWeight:500}}>This one happened {timeAgo(plan.dateTime)}. Hope it was good 🎉</div>
          )}

          <div style={{height:24}}/>
        </div>
      </div>
    </div>
  );
}

====================================================================== */
const REACTION_COLORS = ["#F2745E","#F3B94D","#C3D65C","#ACA2EA","#8FD6C0","#8CC1EA"];
function DayOfScreen({db, planId, onClose, dispatch}){
  const plan = db.plans[planId];
  const activity = db.activities[plan.activityId];
  const color = catColor(activity.category);
  const mins = Math.max(0, Math.round((plan.dateTime - now())/60000));
  const hrs = Math.floor(mins/60);
  const [out, setOut] = useState(false);
  const [mySnap, setMySnap] = useState(null);
  const [customOpen, setCustomOpen] = useState(false);
  const [customVal, setCustomVal] = useState("");

  function react(emoji){
    const c = REACTION_COLORS[Math.floor(Math.random()*REACTION_COLORS.length)];
    setMySnap({color:c, emoji});
    dispatch({type:"DAYOF_RESPOND", planId, userId:ME, val:"in"});
    dispatch({type:"DAYOF_REACT", planId, userId:ME, emoji});
    dispatch({type:"TOAST", message:"Reaction sent to the group 📸"});
  }
  function submitCustom(){
    if(customVal.trim()){ react(customVal.trim().slice(0,4)); setCustomOpen(false); setCustomVal(""); }
  }
  function cantMake(){ setOut(true); dispatch({type:"DAYOF_RESPOND", planId, userId:ME, val:"out"}); }
  const otherReactions = Object.entries(plan.dayOfReactions||{}).filter(([uid])=>uid!==ME);

  return (
    <div className="fullscreen dayof-screen">
      <div className="dayof-hero" style={{background:color}}>
        <button className="sheet-close" onClick={onClose} aria-label="Close" style={{top:18}}><IconClose/></button>
        <div className="dglyph">{catGlyph(activity.category)}</div>
        <h1><Q text={`Still on for ${activity.title}?`}/></h1>
        <p>{activity.location} · {fmtWhen(plan.dateTime)}</p>
        <div className="countdown">{hrs>0? `${hrs}h ${mins%60}m to go` : `${mins}m to go`}</div>
      </div>
      <div className="notch-dot"/>
      <div className="dayof-actions">
        {!out ? (
          <>
            <p style={{textAlign:"center", fontSize:12.5, color:"var(--text-soft)", margin:"0 0 2px", fontWeight:500}}>Tap an emoji to react — it's sent to the group instantly</p>
            <div className="dayof-reactions">
              {["🔥","👍","😅"].map(e=>(<button key={e} className={`dayof-react ${mySnap && mySnap.emoji===e?"picked":""}`} onClick={()=>react(e)}>{e}</button>))}
              {!customOpen ? (
                <button className="dayof-react" onClick={()=>setCustomOpen(true)} aria-label="Custom reaction">➕</button>
              ) : (
                <input className="custom-emoji-input" autoFocus placeholder="😊" value={customVal}
                  onChange={e=>setCustomVal(e.target.value)}
                  onKeyDown={e=>{ if(e.key==="Enter") submitCustom(); }}
                  onBlur={submitCustom}/>
              )}
            </div>

            {(otherReactions.length>0 || mySnap) && (
              <div className="snap-strip">
                {mySnap && <div className="snap-photo" style={{background:mySnap.color}}>{mySnap.emoji}</div>}
                {otherReactions.map(([uid,r])=>(<div className="snap-photo" key={uid} style={{background:REACTION_COLORS[uid.length % REACTION_COLORS.length]}}>{r.emoji}</div>))}
              </div>
            )}

            <button className="quiet-out" onClick={cantMake}>Can't make it anymore</button>
          </>
        ) : (
          <div style={{textAlign:"center"}}>
            <p style={{fontSize:14, color:"var(--text-soft)", marginBottom:16, fontWeight:500}}>No worries — the group will see you're out. No explanation needed.</p>
            <button className="primary-btn" onClick={onClose}>Done</button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ======================================================================
   CALENDAR — week (default) + month, event-name boxes, border-select
====================================================================== */
function startOfWeek(d){ const nd = new Date(d); nd.setHours(0,0,0,0); nd.setDate(nd.getDate()-nd.getDay()); return nd; }
function CalendarScreen({db, onOpen}){
  const [view, setView] = useState("week");
  const [weekOffset, setWeekOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedKey, setSelectedKey] = useState(null);

  const plans = Object.values(db.plans).filter(p=>!isPutAsideForMe(p));
  function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
  const byDay = {};
  plans.forEach(p=>{ const k=dayKey(p.dateTime); (byDay[k]=byDay[k]||[]).push(p); });
  const today = new Date();
  const todayKey = dayKey(today.getTime());

  if(view==="week"){
    const start = startOfWeek(new Date(today.getTime() + weekOffset*7*DAY));
    const days = Array.from({length:7}, (_,i)=> new Date(start.getTime() + i*DAY));
    const rangeLabel = `${days[0].toLocaleDateString([], {month:"short", day:"numeric"})} – ${days[6].toLocaleDateString([], {month:"short", day:"numeric"})}`;
    return (
      <div className="fullscreen">
        <div className="section" style={{paddingBottom:12}}><h2 className="section-title">Calendar</h2><p className="section-sub">everything you're part of, in order</p></div>
        <div className="cal-view-toggle"><button className={view==="week"?"on":""} onClick={()=>setView("week")}>Week</button><button onClick={()=>setView("month")}>Month</button></div>
        <div className="cal-grid-head">
          <button className="cal-nav-btn" onClick={()=>setWeekOffset(w=>w-1)}>‹</button>
          <span className="cal-month-label">{rangeLabel}</span>
          <button className="cal-nav-btn" onClick={()=>setWeekOffset(w=>w+1)}>›</button>
        </div>
        <div className="week-list">
          {days.map((d,i)=>{
            const k = dayKey(d.getTime());
            const dayPlans = (byDay[k]||[]).sort((a,b)=>a.dateTime-b.dateTime);
            const isToday = k===todayKey;
            const isSelected = k===selectedKey;
            return (
              <div className={`week-day-row ${isToday?"today":""} ${isSelected?"selected":""}`} key={i}>
                <div className="week-day-num" onClick={()=>setSelectedKey(isSelected?null:k)}>
                  <div className="wd-dow">{d.toLocaleDateString([], {weekday:"short"})}</div>
                  <div className="wd-num">{d.getDate()}</div>
                </div>
                <div className="week-day-events">
                  {dayPlans.length===0 && <div className="week-event-empty">Nothing planned</div>}
                  {dayPlans.map(p=>{
                    const a = db.activities[p.activityId];
                    return (
                      <div className="week-event-chip" key={p.id} style={{background:catColor(a.category)}} onClick={()=>onOpen(p.id)}>
                        <span>{catGlyph(a.category)}</span><span>{a.title}</span><span style={{marginLeft:"auto", fontWeight:600, opacity:.8}}>{fmtTimeOnly(p.dateTime)}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{height:20}}/>
      </div>
    );
  }

  // month view
  const viewDate = new Date(today.getFullYear(), today.getMonth()+monthOffset, 1);
  const year = viewDate.getFullYear(), month = viewDate.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = viewDate.toLocaleDateString([], {month:"long", year:"numeric"});
  const cells = [];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const selectedDayPlans = selectedKey ? (byDay[selectedKey]||[]).sort((a,b)=>a.dateTime-b.dateTime) : [];

  return (
    <div className="fullscreen">
      <div className="section" style={{paddingBottom:12}}><h2 className="section-title">Calendar</h2><p className="section-sub">everything you're part of, in order</p></div>
      <div className="cal-view-toggle"><button onClick={()=>setView("week")}>Week</button><button className="on" onClick={()=>setView("month")}>Month</button></div>
      <div className="cal-grid-head">
        <button className="cal-nav-btn" onClick={()=>setMonthOffset(m=>m-1)}>‹</button>
        <span className="cal-month-label">{monthLabel}</span>
        <button className="cal-nav-btn" onClick={()=>setMonthOffset(m=>m+1)}>›</button>
      </div>
      <div className="cal-grid">
        {["S","M","T","W","T","F","S"].map((d,i)=><div className="cal-dow" key={i}>{d}</div>)}
        {cells.map((d,i)=>{
          if(!d) return <div key={i} className="cal-day empty"/>;
          const k = `${year}-${month}-${d}`;
          const dayPlans = byDay[k]||[];
          const isToday = k===todayKey;
          const isSelected = k===selectedKey;
          return (
            <button key={i} className={`cal-day ${isToday?"today":""} ${isSelected?"selected":""}`} onClick={()=>setSelectedKey(isSelected?null:k)}>
              <span>{d}</span>
              {dayPlans.slice(0,2).map(p=>{
                const a = db.activities[p.activityId];
                return <span key={p.id} className="cal-day-chip" style={{background:catColor(a.category)}}>{a.title}</span>;
              })}
              {dayPlans.length>2 && <span className="cal-more">+{dayPlans.length-2} more</span>}
            </button>
          );
        })}
      </div>
      {selectedKey && (
        <>
          <div className="agenda-date">{selectedDayPlans.length? "That day" : "Nothing that day"}</div>
          {selectedDayPlans.map(p=>{
            const a = db.activities[p.activityId];
            return (
              <div className="agenda-row" key={p.id} onClick={()=>onOpen(p.id)}>
                <div className="ar-glyph" style={{background:catColor(a.category)}}>{catGlyph(a.category)}</div>
                <div style={{flex:1}}><div className="ar-title">{a.title}</div><div className="ar-meta">{fmtWhen(p.dateTime)}</div></div>
                {p.finalized && <span className="ar-check">✅</span>}
              </div>
            );
          })}
        </>
      )}
      <div style={{height:20}}/>
    </div>
  );
}

const NOTIF_EMOJI = {shared:"✨", responded:"💬", confirmed:"🎉", dayof:"⏰", backedout:"🙈", nudge:"👋", updated:"✏️", meet:"🤝", finalized:"📅", planner:"🧭"};
function NotificationsScreen({db, onOpen, dispatch}){
  const list = [...db.notifications].sort((a,b)=>b.createdAt-a.createdAt);

  const groups = {};
  const order = [];
  list.forEach(n=>{
    const plan = n.planId && db.plans[n.planId];
    const g = plan ? db.groups[plan.groupId] : null;
    const key = g ? g.id : "other";
    if(!groups[key]){ groups[key]={group:g, items:[]}; order.push(key); }
    groups[key].items.push(n);
  });

  return (
    <div className="fullscreen">
      <div className="section"><h2 className="section-title">Updates</h2><p className="section-sub">only the stuff that actually matters</p></div>
      {list.length===0 && <div className="empty-state"><div className="em-emoji">🔔</div><h3>All quiet</h3><p>We'll ping you the second something moves.</p></div>}
      {order.map(key=>{
        const {group, items} = groups[key];
        return (
          <div key={key}>
            <div className="notif-group-label">{group? <>{group.emoji} {group.name}</> : "Other"}</div>
            {items.map(n=>(
              <div className={`notif-row ${!n.read?"unread":""}`} key={n.id} onClick={()=> n.planId && db.plans[n.planId] && onOpen(n.planId)}>
                <div className="notif-emoji">{NOTIF_EMOJI[n.type]||"🔔"}</div>
                <div><div className="notif-text">{n.message}</div><div className="notif-time">{timeAgo(n.createdAt)}</div></div>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}
